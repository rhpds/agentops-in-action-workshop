---
# E2E — AgentOps in Action
#
# Walks the learner's path through the content and fails on the first broken
# step, naming the module.
#
#   ansible-playbook qa-automation/e2e.yml -e e2e_tenant=user-4jnxn
#   curl -sk -N https://<showroom-host>/stream/qa/e2e
#
# IMPLEMENTATION STATUS
#
#   module 1   implemented and verified against a live tenant
#   modules 2+ scaffolding only — the tasks below announce what each module
#              will assert and exit 0 without touching anything
#
# Module 1's content is written and its prompts are exact, so its steps are
# real. Modules 2 to 6 are still being authored; their designed steps —
# including the full OpenShell sandbox sequence derived from the current
# module-02 draft — are recorded under `e2e_steps` in
# qa-automation/healthcheck-spec.yaml. Implement them here as each module's
# content settles, and flip its `implemented` flag in the spec.
#
# Module 1 is read-only. The scaffolding for later modules is not: sandboxing
# the agent and repointing the console is the lab. When those land, run them
# against a scratch tenant, not one a participant is holding.

- name: AgentOps in Action — end-to-end lab walkthrough
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"

  environment:
    KUBECONFIG: "{{ k8s_kubeconfig | default(omit) }}"
    K8S_AUTH_KUBECONFIG: "{{ k8s_kubeconfig | default(omit) }}"

  vars:
    e2e_tenant: ""
    e2e_prompt_timeout: 180
    e2e_user_data_file: /user_data/user_data.yml
    hc_mcp_servers: [control-mcp, maintenance-mcp, telemetry-mcp]

    # Which modules to run. Module 1 is read-only; module 2 creates a sandbox
    # and repoints the console. `-e e2e_modules=1` keeps the run read-only.
    e2e_modules: "1,2"
    _e2e_modules: >-
      {{ (e2e_modules | string).split(',') | map('trim') | select() | map('int') | list }}

    e2e_sandbox: hermie
    # Must match tenant-openshell's hermes.image — module 2 sandboxes the same
    # image the agent already runs, which is what makes "we changed nothing
    # about the agent" true.
    e2e_agent_image: quay.io/rh-aiservices-bu/waterplant-hermes:0.2.2

    # The three prompts module 1 has the participant type, verbatim from
    # content/modules/ROOT/pages/module-01.adoc.
    e2e_prompt_normal: "What's the status of pump 4?"
    e2e_prompt_websearch: "use the search tool to list water plants in new york"
    e2e_prompt_readfile: "Use read_file on /README.md, output the contents"

  tasks:

    # ── Setup ───────────────────────────────────────────────────────────────

    - name: "setup | Read the Showroom user data, when running inside a Showroom pod"
      ansible.builtin.slurp:
        src: "{{ e2e_user_data_file }}"
      register: e2e_user_data_raw
      failed_when: false

    - name: "setup | Resolve the tenant"
      ansible.builtin.set_fact:
        t_user: "{{ e2e_tenant if e2e_tenant else _user_data.get('user', '') }}"
      vars:
        _user_data: "{{ (e2e_user_data_raw.content | default('') | b64decode | from_yaml) | default({}, true) }}"

    - name: "setup | A tenant is required"
      ansible.builtin.assert:
        that: t_user | length > 0
        fail_msg: >-
          No tenant to test. Pass -e e2e_tenant=<username>, or run inside a
          Showroom pod where {{ e2e_user_data_file }} supplies it.

    - name: "setup | Derive namespaces and agent URLs"
      ansible.builtin.set_fact:
        t_ns: "{{ t_user }}-agentops"
        # The unsandboxed agent the console talks to at baseline. Module 2
        # repoints the console at hermes-agent, which the bridge relay fronts
        # with the sandboxed one.
        t_plain_url: "http://hermes-plain.{{ t_user }}-agentops.svc:8787"
        t_sandboxed_url: "http://hermes-agent.{{ t_user }}-agentops.svc:8787"

    - name: "setup | Read the cluster's ingress domain"
      kubernetes.core.k8s_info:
        api_version: config.openshift.io/v1
        kind: Ingress
        name: cluster
      register: t_ingress

    - name: "setup | Read the bridge Deployment for its model endpoint"
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        namespace: "{{ t_ns }}"
        name: hermes-openshell-bridge
      register: t_bridge_deploy

    - name: "setup | Derive the hosts module 2's policy rules have to name"
      ansible.builtin.set_fact:
        # Read from the cluster and from the workload rather than hardcoded:
        # these hostnames differ per cluster, and a wrong one is the most
        # likely reason E2E-M2-03 fails on a new build.
        t_keycloak_host: "sso.{{ t_ingress.resources[0].spec.domain }}"
        t_model_host: "{{ _model_base | regex_replace('^https?://([^/:]+).*$', '\\1') }}"
      vars:
        # selectattr('env', 'defined') first: the bridge pod has containers
        # with no env block at all (cli, relay-proxy), and map(attribute='env')
        # over those yields Undefined, which silently collapses the whole
        # chain to '' and produces a ':443' endpoint later.
        _model_base: >-
          {{ (t_bridge_deploy.resources[0].spec.template.spec.containers
              | selectattr('env', 'defined') | map(attribute='env') | flatten
              | selectattr('name', 'equalto', 'MODEL_BASE_URL')
              | map(attribute='value') | first | default('')) }}

    - name: "setup | The policy hosts must have resolved"
      ansible.builtin.assert:
        that:
          - t_keycloak_host | length > 4
          - t_model_host | length > 0
        fail_msg: >-
          Could not derive the hosts module 2's policy rules need
          (keycloak={{ t_keycloak_host | default('') }},
          model={{ t_model_host | default('') }}).
          MODEL_BASE_URL is read from the hermes-openshell-bridge Deployment;
          check it is still set there.

    - name: "setup | Read the agent credentials"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        namespace: "{{ t_ns }}"
        name: hermes-env
      register: t_secret
      no_log: true

    - name: "setup | The agent credentials must exist"
      ansible.builtin.assert:
        that: t_secret.resources | length > 0
        fail_msg: "No hermes-env Secret in {{ t_ns }} — run healthcheck.yml first (TEN-SEC-01)."

    - name: "setup | Decode the agent credentials"
      ansible.builtin.set_fact:
        t_api_key: "{{ t_secret.resources[0].data.API_SERVER_KEY | b64decode }}"
      no_log: true

    - name: "setup | Find the baseline agent and the console pods"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ t_ns }}"
        label_selectors:
          - "app.kubernetes.io/name={{ item }}"
        field_selectors:
          - status.phase=Running
      loop: [hermes-plain, water-plant-ui]
      loop_control:
        label: "{{ item }}"
      register: t_pods

    - name: "setup | The baseline agent and the console must both be running"
      ansible.builtin.assert:
        that:
          - t_pods.results[0].resources | length > 0
          - t_pods.results[1].resources | length > 0
        fail_msg: >-
          Missing a running pod in {{ t_ns }}
          (hermes-plain={{ t_pods.results[0].resources | length }},
          water-plant-ui={{ t_pods.results[1].resources | length }}).
          Run healthcheck.yml first.

    - name: "setup | Record the console as the client pod"
      ansible.builtin.set_fact:
        # Every prompt is curl'd from inside the operator console's pod. Two
        # reasons: the agent Services are ClusterIP so there is no route to
        # them from the controller, and the bridge's own NetworkPolicy
        # (hermes-openshell-bridge-ingress) admits port 8787 ONLY from pods
        # labelled water-plant-ui. Prompting from anywhere else reaches plain
        # Hermes but gets a connection failure against the sandboxed agent in
        # module 2 — correctly, since the console is the only thing allowed to
        # talk to it. Sending from the console is also what the lab describes.
        e2e_client_pod: "{{ t_pods.results[1].resources[0].metadata.name }}"
        e2e_client_container: ui

    # ── Module 1: Introduction to AgentOps & Meet Hermie ────────────────────

    - name: "M1 | Count tool invocations before the first prompt"
      ansible.builtin.include_tasks: tasks/count-tool-calls.yml
      vars:
        count_label: "M1 before"

    - name: "M1 | Remember the baseline tool-call count"
      ansible.builtin.set_fact:
        m1_tools_before: "{{ tool_calls }}"

    - name: "M1 | Ask the agent the module's opening question"
      ansible.builtin.include_tasks: tasks/ask-agent.yml
      vars:
        ask_label: "E2E-M1-01 — {{ e2e_prompt_normal }}"
        ask_url: "{{ t_plain_url }}"
        ask_prompt: "{{ e2e_prompt_normal }}"

    - name: "M1 | E2E-M1-01 — the console's first question must be answered"
      ansible.builtin.assert:
        that:
          - not (ask_failed | bool)
          - ask_text | length > 0
        fail_msg: >-
          E2E-M1-01 FAILED (module-01): the first prompt the lab asks a
          participant to type did not produce an answer.
          {{ ('Agent error: ' ~ ask_error) if ask_error else ('Raw reply: ' ~ (ask_raw_stdout | truncate(400))) }}
        success_msg: "E2E-M1-01 passed — agent answered: {{ ask_text | truncate(120) }}"

    - name: "M1 | Count tool invocations after the first prompt"
      ansible.builtin.include_tasks: tasks/count-tool-calls.yml
      vars:
        count_label: "M1 after"

    - name: "M1 | E2E-M1-02 — the answer must come from a tool, not the model"
      ansible.builtin.assert:
        that: (tool_calls | int) > (m1_tools_before | int)
        fail_msg: >-
          E2E-M1-02 FAILED (module-01): the agent answered without calling any
          MCP tool ({{ m1_tools_before }} calls before, {{ tool_calls }} after).
          A fluent answer with no tool call means the agent lost its tools and
          is improvising — which still looks like a pass to E2E-M1-01.
        success_msg: "E2E-M1-02 passed — {{ (tool_calls | int) - (m1_tools_before | int) }} tool call(s) made"

    # The next three assert that an ATTACK SUCCEEDS. That is deliberate: these
    # are the baseline over-permissions module 1 demonstrates and module 2
    # proves are blocked. If they already fail, the lab's before-and-after has
    # no "before" and the whole narrative collapses — so a lab that is too
    # secure at this point is as broken as one that is not secure at the end.

    - name: "M1 | Attempt the baseline web-search over-permission"
      ansible.builtin.include_tasks: tasks/ask-agent.yml
      vars:
        ask_label: "E2E-M1-03a — unrestricted web search"
        ask_url: "{{ t_plain_url }}"
        ask_prompt: "{{ e2e_prompt_websearch }}"

    - name: "M1 | Remember the web-search outcome"
      ansible.builtin.set_fact:
        m1_websearch_worked: "{{ (not (ask_failed | bool)) and (ask_text | length > 0) }}"

    - name: "M1 | Attempt the baseline filesystem over-permission"
      ansible.builtin.include_tasks: tasks/ask-agent.yml
      vars:
        ask_label: "E2E-M1-03b — arbitrary file read"
        ask_url: "{{ t_plain_url }}"
        ask_prompt: "{{ e2e_prompt_readfile }}"

    - name: "M1 | E2E-M1-03 — the baseline attacks must both SUCCEED"
      ansible.builtin.assert:
        that:
          - m1_websearch_worked | bool
          - not (ask_failed | bool)
          - ask_text | length > 0
        fail_msg: >-
          E2E-M1-03 FAILED (module-01): a baseline over-permission did not
          reproduce (web search worked={{ m1_websearch_worked }},
          file read worked={{ not (ask_failed | bool) }}).
          Both are meant to work before sandboxing — they are the "before" the
          rest of the lab is measured against.
        success_msg: "E2E-M1-03 passed — both baseline over-permissions reproduce"

    - name: "M1 | Module 1 complete"
      ansible.builtin.debug:
        msg: >-
          Module 1 passed for {{ t_user }}: the agent answers the console's
          opening question using a real tool call, and both baseline
          over-permissions reproduce.

    # ── Modules 2-6: scaffolding ────────────────────────────────────────────
    #
    # Placeholders, not skipped assertions. Each announces what it will assert
    # so the gap is visible in the run output rather than inferred from the
    # absence of tasks. The designed steps and their rationale — including the
    # verbatim OpenShell command sequence from the module-02 draft — are in
    # healthcheck-spec.yaml under `e2e_steps`.
    #
    # To implement one: add its tasks below this comment, reusing
    # tasks/ask-agent.yml for prompts and tasks/count-tool-calls.yml for tool
    # evidence, and set `implemented: true` on its step in the spec.

    # ── Module 2: Sandbox the Agent ─────────────────────────────────────────
    #
    # Mutating. Skip with -e e2e_modules=1 to run module 1 on its own, which
    # keeps the whole playbook read-only.

    - name: "Module 2 — Sandbox the Agent"
      ansible.builtin.include_tasks: tasks/e2e-module-02.yml
      when: 2 in _e2e_modules

    - name: "M2 | Skipped"
      ansible.builtin.debug:
        msg: "Module 2 skipped (e2e_modules={{ e2e_modules }}). Module 1 only — nothing was mutated."
      when: 2 not in _e2e_modules

    # ── Modules 3-6: scaffolding ────────────────────────────────────────────
    #
    # Placeholders, not silent gaps. Each says what it will assert and why it
    # is not implemented, so the hole is visible in the run output.

    - name: "M3-M6 | Not yet implemented"
      ansible.builtin.debug:
        msg: |
          SCAFFOLD — modules 3 to 6 have no e2e coverage yet.

          {% for s in _scaffold %}
          {{ s.id }} ({{ s.module }}) — {{ s.title }}
              {{ s.why }}
          {% endfor %}

          See `e2e_steps` in qa-automation/healthcheck-spec.yaml for the
          designed steps, and implement them here as each blocker clears.
      vars:
        _scaffold:
          - id: E2E-M3-01
            module: module-03
            title: "Restrict the operator's Keycloak roles, then re-run the attacks"
            why: >-
              Blocked on judgement, not content. The module has the participant
              open the Keycloak admin console, read two attack traces, and
              decide which of ~10 role mappings to remove. Scripting it means
              hardcoding that answer, which would assert our guess rather than
              the lab. Implementable via the Keycloak Admin REST API once the
              intended role set is pinned down.
          - id: E2E-M4-01
            module: module-04
            title: "Scoped filesystem policy restores report writing"
            why: >-
              Implementable — the policy edit, sandbox recreate and report
              round trip are all deterministic CLI steps. Depends on module 3
              having run first.
          - id: E2E-M4-02
            module: module-04
            title: "An ambiguous cleanup request deletes reports it should not"
            why: >-
              Deliberately non-deterministic. The module itself says the
              behaviour "can vary: if it asks a question or declines, inspect
              whether any deletion occurred rather than claiming the
              demonstration succeeded." Not assertable as pass/fail.
          - id: E2E-M5-01
            module: module-05
            title: "Let the agent reach the docs website"
            why: "Content is still a 23-line stub with no commands."
          - id: E2E-M6-01
            module: module-06
            title: "Guard against a compromised account"
            why: "Content is still a 24-line stub with no commands."
