---
# Sends one prompt to a Hermes agent and leaves the parsed reply in
# `ask_reply`, plus `ask_text` (the assistant message), `ask_failed` and
# `ask_error`.
#
# Callers set:
#   ask_label   what to call this in the task name
#   ask_url     base URL of the agent, e.g. http://hermes-plain.<ns>.svc:8787
#   ask_prompt  the prompt, verbatim from the module content
#
# Executed inside the hermes-plain pod rather than from the controller: the
# agent Services are ClusterIP, so this has to work the same from the Showroom
# pod and from a laptop.
#
# The payload is base64'd on the controller and decoded in the pod. Two
# problems go away at once: k8s_exec shlex-splits its command, so a raw JSON
# body full of quotes (and prompts like "What's the status of pump 4?" that
# contain an apostrophe) cannot be passed as a literal; and k8s_exec does not
# close the exec stdin stream, so `curl -d @-` fed by the module's own `stdin`
# parameter blocks until --max-time and returns nothing. A base64 blob is
# shlex-safe, and piping it gives curl a real EOF.

- name: "ask | {{ ask_label }}"
  kubernetes.core.k8s_exec:
    namespace: "{{ t_ns }}"
    pod: "{{ e2e_client_pod }}"
    container: "{{ e2e_client_container }}"
    command: >-
      sh -c 'echo {{ _payload_b64 }} | base64 -d |
      curl -s --max-time {{ e2e_prompt_timeout }}
      -H "Content-Type: application/json"
      -H "Authorization: Bearer {{ t_api_key }}"
      -d @- {{ ask_url }}/v1/chat/completions'
  vars:
    _payload_b64: >-
      {{ {'model': 'hermes-agent',
          'messages': [{'role': 'user', 'content': ask_prompt}]} | to_json | b64encode }}
  register: ask_raw
  failed_when: false
  changed_when: true

- name: "ask | {{ ask_label }} | Parse the reply"
  ansible.builtin.set_fact:
    ask_raw_stdout: "{{ _out }}"
    ask_reply: "{{ _parsed }}"
    ask_text: "{{ _parsed.get('choices', [{}])[0].get('message', {}).get('content', '') }}"
    # Hermes reports a refusal or a tool failure as a 200 carrying an `error`
    # object, so transport success does not mean the turn worked. An
    # unparseable or empty body counts as failed too.
    #
    # It also has a third failure shape: when its outbound calls are blocked
    # it answers with an ordinary assistant message reading "API call failed
    # after N retries: Connection error." — no error object, non-empty
    # content. Matched here so callers are not told the turn succeeded.
    # Callers that need infrastructure-level proof should still assert on
    # denial logs or tool-call counts rather than on this flag.
    ask_failed: >-
      {{ (_parsed | length == 0) or ('error' in _parsed)
         or (_parsed.get('choices', []) | length == 0)
         or (_content is search('API call failed after .* retries')) }}
    ask_error: "{{ _parsed.get('error', {}).get('message', '') }}"
  vars:
    _out: "{{ ask_raw.stdout | default('') | trim }}"
    _parsed: "{{ (_out | from_json) if (_out.startswith('{')) else {} }}"
    _content: "{{ _parsed.get('choices', [{}])[0].get('message', {}).get('content', '') }}"
