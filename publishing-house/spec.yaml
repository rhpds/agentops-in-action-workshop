project:
  slug: "agentops-in-action-workshop"
  owner_email: "phayes@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "gitops"
  description: "A hands-on AgentOps lab where participants operate Hermie, a waterplant AI assistant, and use OpenShell sandbox policy, Keycloak/MCP Gateway tool authorization, scoped documentation access, MLflow traces, evaluations, and NeMo Guardrails to keep the assistant useful while reducing risk"
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-1108"
  workflow_id: "59356dc8-e3e9-412e-b183-e11d048ed21f"

spec:
  title: "AgentOps in Action: Evaluate, Secure, and Operate Enterprise AI Agents"
  learning_objectives:
  - "Identify and assess common security and operational risks in tool-enabled AI agents by reviewing their permissions, traces, tool calls, and evaluation results"
  - "Apply runtime controls that restrict an agent's network, filesystem, documentation, and tool access without rebuilding or redeploying the agent application"
  - "Configure Keycloak and MCP Gateway tool authorization so the operator can use only the plant tools required for their role"
  - "Use attack cases, evaluations, MLflow traces, logs, and plant-state evidence to detect unsafe behavior and verify that controls work"
  - "Tune network, filesystem, documentation, tool, and guardrail policy to balance security with required operator workflows"
  - "Interpret agent execution traces to distinguish model-level behavior from runtime and platform-level enforcement"
  - "Differentiate the enforcement responsibilities of sandbox isolation, filesystem and network policy, tool authorization, scoped content access, tracing, evaluations, and inference guardrails"
  # [{id, title, duration_min, status}] — id is stable (e.g. module-01)
  modules:
  # Content source of truth: content/modules/ROOT/pages/*.adoc and nav.adoc.
  # Durations below are the two-hour PH review allocation for the current
  # Showroom module flow.
  - id: module-01
    title: "Introduction to AgentOps & Meet Hermie"
    duration_min: 20
    status: complete
  - id: module-02
    title: "Sandbox the Agent"
    duration_min: 20
    status: complete
  - id: module-03
    title: "Let the Agent Use Its Tools"
    duration_min: 15
    status: complete
  - id: module-04
    title: "Let the Agent Write Files"
    duration_min: 20
    status: complete
  - id: module-05
    title: "Let the Agent Reach the Docs Website"
    duration_min: 20
    status: complete
  - id: module-06
    title: "Check What Goes In and Comes Out"
    duration_min: 20
    status: complete
  - id: module-07
    title: "Keep Hermie Working Safely"
    duration_min: 5
    status: complete
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "shared-cluster" # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv    # cnv | aws | troshka — troshka: Kata/OSC needs bare metal or nested virt
    max_concurrent_users: 30   # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.22"                # Agent Sandbox TP requires OCP 4.22 / OSC 1.12
    cluster_type: "multinode"          # sno | multinode — only for platform = ocp
    control_plane_instance_count: 3    # 1 if sno, 3 if multinode
    control_plane_cpu: 16              # 32 if sno, 16 if multinode
    control_plane_ram_gb: 64           # 128 if sno, 64 if multinode
    worker_count: 8                    # estimate at 30 concurrent participants
    worker_cpu: 32                     # vCPU per worker
    worker_ram_gb: 64                  # RAM per worker in GB
    worker_disk_gb: 200                # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: "maas"             # maas | gpu | none
    ai_model_tier: "open-source"       # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # TBD — instruction-following model with agentic tool use, served by vLLM in MaaS
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    # list of non-GA products/versions
    non_ga_products:
    - "OpenShell (Gateway, Supervisor, Sandbox, CLI, and TUI) — Tech Preview"
    - "Red Hat build of Agent Sandbox — Tech Preview, with OCP 4.22 / OpenShift Sandboxed Containers 1.12"
    - "MCP Gateway — Tech Preview"
    - "NeMo Guardrails integration — workshop guardrail service and console integration"
    # how access is provided for non-GA products
    non_ga_access_plan: "All workshop components are provisioned by the GitOps automation and pulled from approved registries. The delivered Showroom environment provides OpenShell, Agent Sandbox, MCP Gateway, the waterplant services, NeMo Guardrails, MLflow wiring, attacks, and evaluations before participants begin; participants do not install non-GA components during the lab."
    # named external service dependencies e.g. [github.com]
    external_services:
    - "registry.redhat.io — Red Hat product images"
    - "quay.io — operator catalogs, Red Hat build images, and all non-GA/Tech Preview components"
    - "github.com — GitOps chart and manifest sources for ArgoCD"
    - "MaaS model endpoint — hosted tool-calling model used by Hermie and guardrails checks"
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "intermediate"   # beginner | intermediate | advanced

