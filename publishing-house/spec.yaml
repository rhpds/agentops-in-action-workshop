# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "agentops-in-action-workshop"
  owner_email: "phayes@redhat.com"
  content_type: "lab"
  deployment_mode: "rhdp_published"
  initiative_key: "rh1_2027"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "gitops"
  description: "A hands-on AgentOps lab that teaches participants how to evaluate, secure, observe, and operate enterprise AI agents on Red Hat OpenShift AI using runtime controls, identity-aware authorization, automated testing, and policy tuning"
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: ""
  workflow_id: ""

spec:
  title: "AgentOps in Action: Evaluate, Secure, and Operate Enterprise AI Agents"
  learning_objectives:
  - "Identify and assess common security and operational risks in tool-enabled AI agents by reviewing their permissions, traces, tool calls, and evaluation results"
  - "Apply runtime controls that restrict an agent's network, filesystem, process, and tool access without rebuilding or redeploying the agent application"
  - "Configure identity-aware authorization so that agents can access only the enterprise resources and MCP tools permitted for the requesting user"
  - "Use automated evaluations and red-team tests to detect unsafe behavior and verify that security controls are working as intended"
  - "Tune agent policies to balance security, usability, and required business functionality in an enterprise deployment"
  - "Interpret agent execution traces to distinguish model-level behavior from runtime and platform-level enforcement"
  - "Differentiate the enforcement responsibilities of sandbox isolation, execution policy, tool authorization, and inference guardrails"
  # [{id, title, duration_min, status}] — id is stable (e.g. module-01)
  modules:
  - id: module-01
    title: "Introduction to AgentOps"
    duration_min: 10
    status: not_started
  - id: module-02
    title: "Explore the agent and establish a baseline"
    duration_min: 15
    status: not_started
  - id: module-03
    title: "Identify unsafe and unintended behavior"
    duration_min: 20
    status: not_started
  - id: module-04
    title: "Apply runtime isolation and policy controls"
    duration_min: 30
    status: not_started
  - id: module-05
    title: "Add identity-aware access controls"
    duration_min: 20
    status: not_started
  - id: module-06
    title: "Re-evaluate and tune the agent"
    duration_min: 15
    status: not_started
  - id: module-07
    title: "AgentOps lifecycle and wrap-up"
    duration_min: 10
    status: not_started
  environment:
    platform: ""               # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 2
  audience: "intermediate"   # beginner | intermediate | advanced

development:
