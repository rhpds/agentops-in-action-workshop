# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Evidence-based rather than solve/validate buttons: participants confirm outcomes through plant state, saved reports, MLflow traces, OpenShell logs, Keycloak role mappings, guardrail verdicts, attack notifications, and evaluation results. Module 1 establishes useful baseline behavior and over-broad access; module 2 proves sandboxing plus scoped network rules restore only required dependencies; module 3 verifies Keycloak/MCP Gateway role removal blocks dangerous plant tools while preserving legitimate tools; module 4 verifies report writing after scoped filesystem access and discusses deletion/instruction-poisoning limits; module 5 verifies useful documentation reads while blocking the compromised redirect path; module 6 verifies NeMo Guardrails blocks synthetic contact details and off-topic requests while allowing operational work; module 7 is trust-based recap."
    catalog_gap: "No existing catalog item covers the current end-to-end Hermie operating flow: sandboxing a tool-enabled waterplant assistant, restoring required dependencies with least-privilege OpenShell policy, narrowing Keycloak/MCP Gateway tool roles, restoring report writes with scoped filesystem access, restricting documentation paths after an indirect prompt-injection redirect, connecting NeMo Guardrails for input checks, and using MLflow traces plus evaluations throughout. Nearby catalog items cover MCP production or AI observability pieces, but not this full sequence of runtime containment, tool authorization, filesystem/network policy, documentation-path control, guardrail placement, and operational evidence."
    design_overview: "This two-hour lab gives participants a predeployed waterplant AI assistant, Hermie, and has them operate it through a realistic AgentOps loop. They first observe useful baseline behavior and over-broad access in the operator console and MLflow. They then put Hermie into an OpenShell sandbox, restore only required network dependencies, narrow plant-tool roles in Keycloak/MCP Gateway, add scoped filesystem access for report generation, constrain documentation access after a compromised bulletin redirects to an attack path, and connect NeMo Guardrails to block sensitive contact details and off-topic requests before they reach the agent. Participants repeatedly verify controls with traces, logs, plant state, reports, attacks, and evaluations."
    module_summaries:
    - title: "Introduction to AgentOps & Meet Hermie"
      overview: "Participants meet Hermie, inspect the waterplant operator console, ask plant questions, stop an individual pump, generate a report, find evidence in MLflow, try broad web/file access and attack prompts, then run baseline attacks and evaluations."
    - title: "Sandbox the Agent"
      overview: "Participants create sandboxed Hermie with OpenShell, point the UI at it, observe default-deny failures, then restore Keycloak, MCP Gateway, model, and MLflow access with scoped rules while confirming unnecessary web, file, and report access remains blocked."
    - title: "Let the Agent Use Its Tools"
      overview: "Participants reproduce whole-plant shutdown and configuration-dump attacks, identify the exact tools in traces, remove the corresponding Keycloak `tool:` roles from the operator, and verify attacks fail while telemetry and individual pump control still work."
    - title: "Let the Agent Write Files"
      overview: "Participants diagnose report-writing failure, inspect the `write-report` skill, recreate Hermie with `/reports` writable, verify report generation, and explore why broad write access can still enable accidental deletion or instruction poisoning."
    - title: "Let the Agent Reach the Docs Website"
      overview: "Participants restore safety-documentation access through the `read-safety-docs` skill, investigate a compromised bulletin redirect to `/attack/override`, replace broad documentation-host access with `GET /doc` and `GET /doc/**`, and verify useful documentation still works."
    - title: "Check What Goes In and Comes Out"
      overview: "Participants create a poisoned handover skill, test synthetic personal contact details and off-topic travel requests, inspect NeMo Guardrails configuration, connect the console to the guardrails endpoint, and verify input blocks without breaking legitimate plant work."
    - title: "Keep Hermie Working Safely"
      overview: "Participants recap what each layer contributed, acknowledge remaining gaps such as report deletion semantics and checks on retrieved content, and carry forward the AgentOps loop of observe, change, act, evaluate, and continue."
    rcars_overlap_pct: 74
    rcars_top_matches:
    - title: "Taking MCP Servers to Production on OpenShift AI with the Red Hat MCP Registry"
      ci_name: "published.openshift-mcp-lab.prod"
      url: "https://catalog.demo.redhat.com/catalog?item=published.openshift-mcp-lab.prod"
      relevance_score: 74
      why_it_fits: "Directly covers MCP server security controls, least-privilege tool access via allowlists, RBAC for AI agents, and OAuth/OIDC authentication on OpenShift AI. Does not cover OpenShell sandbox policy, filesystem/report-write controls, documentation path restriction, MLflow evidence, or NeMo Guardrails placement, so the current Hermie operating flow is out of scope."
      workloads: []
    - title: "AgentOps in Production - AI Observability on OpenShift"
      ci_name: "published.agentops-ocp.prod"
      url: "https://catalog.demo.redhat.com/catalog?item=published.agentops-ocp.prod"
      relevance_score: 71
      why_it_fits: "Covers MLflow Tracing and LLM evaluation including LLM-as-a-Judge on Red Hat OpenShift AI, overlapping the evaluation objectives. Primary focus is observability rather than security controls; does not cover OpenShell sandbox policy, Keycloak/MCP tool-role narrowing, scoped documentation access, filesystem/report-write controls, or NeMo Guardrails placement."
      workloads: []
    - title: "LB2144: AI AgentOps OpenShift (AWS)"
      ci_name: "summit-2026.lb2144-agentops-ocp-aws.prod"
      url: "https://catalog.demo.redhat.com/catalog?item=summit-2026.lb2144-agentops-ocp-aws.prod"
      relevance_score: 69
      why_it_fits: "Covers MLflow Tracing, MCP, OpenShift AI, and LLM evaluation frameworks with a multi-agent focus. Emphasis is observability - metrics, logs, traces, dashboards - not the current Hermie security-control sequence; does not cover OpenShell sandbox tuning, Keycloak/MCP tool-role narrowing, documentation path restriction, report filesystem controls, or NeMo Guardrails placement."
      workloads:
      - role: "ocp4_workload_authentication"
        collection: "agnosticd.core_workloads"
      - role: "ocp4_workload_gitops_bootstrap"
        collection: "agnosticd.core_workloads"
      - role: "ocp4_workload_litellm_virtual_keys"
        collection: "rhpds.litellm_virtual_keys"
      - role: "ocp4_workload_ocp_console_embed"
        collection: "agnosticd.showroom"
      - role: "ocp4_workload_openshift_gitops"
        collection: "agnosticd.core_workloads"
      - role: "ocp4_workload_showroom"
        collection: "agnosticd.showroom"
    rejections: []

