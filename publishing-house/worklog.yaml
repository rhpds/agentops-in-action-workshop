# Publishing House Worklog
# Human context, decisions, and notes that bridge sessions and people.
# Not a task tracker — the manifest tracks structured progress.

entries:
  - id: "2026-09-11-001"
    timestamp: "2026-09-11T19:00:17Z"
    author: "deewhyweb"
    status: resolved
    type: summary
    content: >-
      Diagnosed why the lab deploys nothing from a freshly provisioned cluster, and restructured the GitOps charts around the catalog item's fixed bootstrap paths. Root cause is not in this repo: the lb1285 cluster catalog item sets no ocp4_workload_gitops_bootstrap_helm_values, so the AgnosticD role takes its else-branch and renders the bootstrap Application with plugin: {name: kustomize-envvar} - a plugin nobody installs, because ocp4_workload_openshift_gitops_kustomize_plugin defaults to false and the item does not set it either. Confirmed live on dev cluster-2xbzc: ComparisonError "could not find cmp-server plugin with name kustomize-envvar", sync Unknown, health Healthy, zero resources, no plugin ConfigMap, no CMP sidecar on the repo-server. Along the way fixed three genuine repo-side bugs: an AppProject that could never be created, an AppProject too narrow to permit the operator namespaces and cluster-scoped resources the charts render, and a per-tenant username collision.
  - id: "2026-09-11-002"
    timestamp: "2026-09-11T19:00:17Z"
    author: "deewhyweb"
    status: resolved
    type: action
    content: >-
      BLOCKER - ask the RHDP CI team to add ocp4_workload_gitops_bootstrap_helm_values to rh1-2027/lb1285-ai-agent-sec-cnv-cluster, in BOTH common.yaml and dev.yaml since dev re-declares the gitops_bootstrap block. Any non-empty value flips the role to native Helm and drops the plugin reference; the repo paths stay exactly as the CI team specified. Precedent is internal and strong: agd_v2/rhoai-migration drives the same role against an identically shaped bootstrap-infra Helm chart and works purely because it sets helm_values. summit-2026/lb2144-agentops-ocp-cnv (prod), summit-2026/lb1559 and our own lb1285 tenant item all set it too - the lb1285 cluster item is the only one of the four that sets neither helm_values nor the kustomize plugin. Nothing in this repository can work around it, because ArgoCD never fetches the repo at all.
  - id: "2026-09-11-003"
    timestamp: "2026-09-11T19:00:17Z"
    author: "deewhyweb"
    status: open
    type: decision
    content: >-
      Need confirmation from the CI team that the tenant catalog item is the only thing that creates per-participant resources. The GitOps charts were restructured on that assumption: bootstrap-tenant now creates the namespace, quota, RBAC and the two per-user Applications, and the cluster-side ApplicationSet fan-out was deleted along with the app-of-apps layer. If the CI team instead expects the cluster side to fan out to N participants, bootstrap-tenant should not be creating those Applications and the change needs reworking. Worth settling before the align-ci-paths branch merges.
  - id: "2026-09-11-004"
    timestamp: "2026-09-11T19:00:17Z"
    author: "deewhyweb"
    status: open
    type: action
    content: >-
      Add an ArgoCD CR patch raising the application-controller memory limit, copying the pattern from rh-aiservices-bu/rhoai-2.25-baseline bootstrap-infra/templates/argocd-config.yaml. That repo documents the 2Gi operator default OOMKilling the controller roughly every 20 seconds across about 20 Applications, leaving resources half-applied, and raises the limit to 6Gi. This lab creates two Applications per participant plus shared infra - over 60 at 30 users - so it will hit the same wall harder. Not yet observed here only because nothing has synced.
  - id: "2026-09-11-005"
    timestamp: "2026-09-11T19:00:17Z"
    author: "deewhyweb"
    status: open
    type: note
    content: >-
      Spec drift to reconcile before infra review. spec.yaml non_ga_products is written around Red Hat OpenShift AI 3.6 (GA 2026-11-19) but bootstrap-infra/values.yaml pins channel stable-3.5 and csv rhods-operator.3.5.0, with DataScienceCluster comments describing v2 as the storage version in RHOAI 3.5. One of the two is wrong and it changes the non-GA access-plan story reviewers will read. Separately spec.environment.ai_model_name is still empty although the choice is settled in practice: the cluster catalog item provisions litellm virtual keys for qwen3-235b and tenant-platform/values.yaml hardcodes that model. spec.environment.cloud_provider was also changed from troshka to cnv by someone else, which is consistent with the deliberate decision not to install Kata/OpenShift Sandboxed Containers recorded in bootstrap-infra/values.yaml.
  - id: "2026-09-11-006"
    timestamp: "2026-09-11T19:00:17Z"
    author: "deewhyweb"
    status: open
    type: handoff
    content: >-
      Two branches need attention. align-ci-paths holds the chart restructure aligning to the CI team's fixed paths and is committed but not pushed - it should not merge until the question in 2026-09-11-003 is answered. feat/hermes-harness exists only on this laptop with no remote and no backup: two commits from 9 September adding Hermes as an alternative agent harness, branched from 4ad1cac, so it predates every GitOps fix and will need a rebase.
  - id: "2026-09-11-007"
    timestamp: "2026-09-11T19:20:00Z"
    author: "deewhyweb"
    status: open
    type: decision
    content: >-
      ArgoCD sync policy is a deliberate contract, not boilerplate - do not 'tidy' it. The per-participant platform Application runs auto-sync with selfHeal and prune ON, because nothing in it is something an attendee is told to touch, so restoring a deleted agent Deployment can only help them. The policy Application is MANUAL with selfHeal and prune OFF, because self-heal there would revert an attendee's OpenShell or MCP Gateway policy within seconds of them making it, silently and with variable timing, and would read as a broken product rather than a misconfigured lab. That single setting is what makes modules 4 and 5 possible: an OutOfSync status on the policy Application is the signal a participant has started working, and argocd app diff on it prints exactly the infrastructure changes that hardened their agent. Prune stays OFF on infra and namespace Applications too - pruning a namespace takes every workload in it, and pruning infra means an operator or a DataScienceCluster. Originally established in f6ccbf5; the Applications moved from cluster-side ApplicationSets into bootstrap-tenant during the align-ci-paths restructure, and the policies were carried across unchanged and re-verified by render.
  - id: "2026-09-11-008"
    timestamp: "2026-09-11T19:20:00Z"
    author: "deewhyweb"
    status: open
    type: note
    content: >-
      The app-of-apps chart at automation/gitops/argocd was added in f6ccbf5 to escape the kustomize-envvar plugin, then deleted again in the align-ci-paths restructure - so nobody should re-add it without reading this first. It was the right diagnosis and the wrong remedy: the plugin problem is real but lives in AgnosticV (see 2026-09-11-002), and routing around it in the repo meant a second bootstrap path the catalog item never uses. It also introduced an Application declaring project agentops-in-action in order to deploy the chart that DEFINED that project, which deadlocked ArgoCD with 'Application referencing project agentops-in-action which does not exist'. With the layer gone the cycle is gone too, because both provisioned Applications run under project default and bootstrap-infra can simply own the AppProject.
  - id: "2026-09-11-009"
    timestamp: "2026-09-11T19:20:00Z"
    author: "deewhyweb"
    status: open
    type: action
    content: >-
      Pin targetRevision to a per-event tag before any delivery. It currently reads main in bootstrap-tenant/values.yaml under gitops.targetRevision, and the catalog item passes ocp4_workload_gitops_bootstrap_repo_revision: main for both cluster and tenant items - so a merge to main reaches a live lab mid-exercise. Both the chart value and the AgnosticV value need changing together, in common.yaml and dev.yaml.
  - id: "2026-09-11-010"
    timestamp: "2026-09-11T19:20:00Z"
    author: "deewhyweb"
    status: resolved
    type: action
    content: >-
      Operator InstallPlan approval is manual and nothing automates it. Every Subscription in bootstrap-infra pins an exact startingCSV with installPlanApproval Manual, which is the right call for a lab built on Tech Preview components whose APIs shift between builds - an unattended upgrade between a dry run and delivery day would silently re-base the policy CRs the whole exercise rests on. But it means a human must run oc get installplan -A and patch each one approved before RHOAI or Agent Sandbox install at all, and until then the DataScienceCluster sits Progressing by design rather than by fault. qa-automation holds only e2e.yml and healthcheck.yml, so this belongs in a short bootstrap playbook before an event.
  - id: "2026-09-13-001"
    timestamp: "2026-09-13T15:45:00Z"
    author: "deewhyweb"
    status: resolved
    type: note
    content: >-
      The AgnosticV helm_values fix landed and is confirmed working end to end. A cluster provisioned from the catalog item (cluster-mc86p) came up with the bootstrap Application rendering via native Helm instead of the missing kustomize-envvar plugin, and reached Synced/Healthy across all 12 resources with no repo change and no manual patching beyond the InstallPlan approvals below. Resolves the blocker recorded in 2026-09-11-002. One cosmetic leftover: the helm_values block carries overlay.all, overlay.minimal and repoRevision, which are keys from the rhoai-migration chart that was used as the precedent - bootstrap-infra does not read them, so they are inert, but worth removing so nobody assumes they do something.
  - id: "2026-09-13-002"
    timestamp: "2026-09-13T15:45:00Z"
    author: "deewhyweb"
    status: open
    type: action
    content: >-
      BLOCKER for a working lab - nothing builds the six workload container images. tenant-platform expects plant-api, waterplant-ui, waterplant-agent, mcp-telemetry, mcp-maintenance and mcp-control from ImageStreams in the wp-dev-phayes namespace, and values.yaml claims they are 'Built on-cluster by BuildConfig', but there is no BuildConfig or ImageStream anywhere in the repository - the only matches are those two comments. Confirmed on cluster-2xbzc by applying bootstrap-tenant by hand: plant-api went to ImagePullBackOff and oc get is -n wp-dev-phayes returned nothing. wp-dev-phayes is also a personal dev namespace that will not survive an event. Recommendation is to build and push to quay.io and reference by tag or digest, which removes the on-cluster build entirely, keeps provisioning deterministic at 30x concurrency, and matches what non_ga_access_plan already tells reviewers. Needs a GitHub Actions workflow in this repo plus an image values change. This is now the last thing standing between a provisioned cluster and a lab that actually runs.
  - id: "2026-09-13-003"
    timestamp: "2026-09-13T15:45:00Z"
    author: "deewhyweb"
    status: resolved
    type: decision
    content: >-
      Operator InstallPlan approval is now automated inside bootstrap-infra rather than by flipping installPlanApproval to Automatic. A Sync-hook Job approves only InstallPlans whose clusterServiceVersionNames matches the exact pinned startingCSV, so the first install is unattended while a later catalog-refresh InstallPlan carries a different CSV, does not match, and is left alone - the pin keeps its meaning. The Job shares sync wave -2 with the Subscriptions and that is load-bearing: ArgoCD waits for every resource in a wave to be healthy before advancing, a Subscription is not healthy until its InstallPlan is approved, so an approver in any later wave can never run, and one in an earlier wave would wait for InstallPlans that do not exist yet. Verified live on cluster-mc86p: the Job matched both pinned CSVs and exited 0 as an idempotent no-op against already-approved plans. Resolves 2026-09-11-010.
