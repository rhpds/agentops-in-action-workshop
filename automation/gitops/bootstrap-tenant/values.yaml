# ---------------------------------------------------------------------------
# Participant identity
#
# The tenant catalog item supplies this as `tenant.username` via
# ocp4_workload_gitops_bootstrap_helm_values. `username` is the legacy spelling
# and is kept only as a fallback for manual `helm install` runs — see
# templates/_helpers.tpl.
# ---------------------------------------------------------------------------
tenant:
  username: ""
username: ""

# Per-participant namespace is <username>-<namespaceSuffix>. Must match
# namespaceSuffix in bootstrap-infra, tenant-platform and tenant-policy.
namespaceSuffix: agentops

# With platform.hermesRuntime openshell, the participant's OpenShell gateway and
# Hermes sandbox run in <username>-<openshellNamespaceSuffix>. Must match
# bootstrap-infra, which allows it as an ArgoCD destination.
openshellNamespaceSuffix: openshell

# The cluster's apps domain. Used to derive the Keycloak host below when the
# catalog item does not pass one explicitly.
deployer:
  domain: apps.example.com

# Rendered into the hermes-env Secret in <username>-agentops. Supplied by the
# tenant catalog item via ocp4_workload_gitops_bootstrap_helm_values.
#   modelApiKey   the participant's LiteLLM virtual key (sk-…)
#   apiServerKey  Hermes' static bearer, one random value per participant
# Never commit real values here.
secrets:
  modelApiKey: ""
  apiServerKey: ""

# RHDP's Keycloak. Empty means sso.<deployer.domain>, which is where RHDP
# publishes it (verified on cluster-tpss7). Forwarded to both tenant
# Applications: the platform one creates the participant's realm and points the
# gateway's OAuth metadata at it; the policy one validates tokens against it.
keycloak:
  host: ""

# ---------------------------------------------------------------------------
# Where the per-participant Applications point.
#
# repoURL and targetRevision are supplied by the catalog item under `gitops`,
# which is why that key name is used verbatim. Pin targetRevision to a per-event
# tag before a delivery: on a moving branch, a merge to main reaches a live lab
# mid-exercise.
# ---------------------------------------------------------------------------
gitops:
  repoURL: https://github.com/rhpds/agentops-in-action-workshop.git
  targetRevision: main
  argocdNamespace: openshift-gitops
  # Created by bootstrap-infra, which the cluster catalog item bootstraps.
  argocdProject: agentops-in-action

# Values forwarded to tenant-platform.
platform:
  # Quay org holding the workload images. Forwarded as a Helm *parameter*, so
  # it overrides image.namespace in tenant-platform rather than merging with
  # it — the two have to agree, and this one wins.
  imageNamespace: rh-aiservices-bu
  # Where the operator console links for MLflow traces.
  #
  # Empty means https://rh-ai.<deployer.domain>/mlflow — RHOAI's dashboard
  # gateway, which is where the MLflow operator surfaces the UI. MLflow has no
  # Route of its own, so that gateway is the only way in, and it is reachable by
  # any participant: RHOAI's Auth CR allows system:authenticated.
  #
  # Set explicitly if a cluster's dashboard is not at rh-ai.<domain>; that
  # prefix was confirmed on cluster-jddlk, where all six RHOAI *-params
  # ConfigMaps record it as gateway-domain, but it is not read from the cluster
  # at render time.
  mlflowUrl: ""
  # Whether this participant's Hermes emits OTLP traces to MLflow. Only the
  # openshell runtime does: the bridge installs the hermes_otel plugin into the
  # sandbox and creates the participant's experiment. The plain Hermes
  # Deployment ignores this.
  mlflowTracing: true
  # "hermes" (the harness the lab ships) or "waterplant" (our own agent, kept
  # as a fallback and as the control case for BYOA comparisons). Per
  # participant, so one attendee can be given the other harness without
  # touching anyone else.
  #
  # hermes needs a hermes-env Secret in that namespace holding MODEL_API_KEY and
  # API_SERVER_KEY — see tenant-platform values, agent.hermes.envSecret. No
  # chart creates it, so tenant provisioning must supply it alongside
  # litellm-credentials or the agent cannot start.
  agentHarness: hermes
  # Where Hermes runs, with agentHarness hermes:
  #
  #   openshell  inside an OpenShell sandbox, in the participant's own
  #              <username>-openshell namespace (templates/openshell.yaml,
  #              tenant-openshell). Needs mcpGateway: the sandbox reaches tools
  #              only through it.
  #   pod        a plain Deployment in <username>-agentops, no sandbox.
  hermesRuntime: openshell
  # Give this participant their own MCP Gateway, and route the agent's tool
  # calls through it instead of straight to the MCP servers.
  #
  # Needs bootstrap-infra's mcpGateway.enabled on the cluster: its
  # AdminNetworkPolicy is what makes the gateway the only way to reach a tool.
  # The corollary is that with that policy in place a tenant with this set to
  # false has an agent that cannot reach its MCP servers at all.
  mcpGateway: true

# Values forwarded to tenant-policy.
policy:
  # Tool authorization at baseline. false is deliberate — see
  # tenant-policy/templates/mcp-gateway-policy.yaml.
  mcpGatewayEnforced: false

# ---------------------------------------------------------------------------
# Per-tenant resource limits
# Lab workload: one agent pod + sidecar + generated-code sandbox
# ---------------------------------------------------------------------------
quota:
  requests:
    cpu: "4"
    memory: "8Gi"
  limits:
    cpu: "8"
    memory: "16Gi"
  maxPods: "20"
