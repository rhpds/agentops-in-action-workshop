{{- if eq .Values.platform.agentHarness "hermes" }}
{{/*
The hermes-env Secret, in <username>-agentops.

Both values come from the tenant catalog item via
ocp4_workload_gitops_bootstrap_helm_values — nothing is generated here. Helm's
randAlphaNum is re-rolled on every render and ArgoCD renders client-side with no
cluster lookup, so a chart-generated key would rewrite this Secret on every sync
and restart Hermes mid-exercise.

Wave -1: after the namespace (-2), before the platform Application (10).
Name must match tenant-platform agent.hermes.envSecret and
tenant-openshell hermes.envSecret.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: hermes-env
  namespace: {{ include "tenant.namespace" . }}
  labels:
    app.kubernetes.io/managed-by: argocd
    rhdp.redhat.com/lab: agentops-in-action
    rhdp.redhat.com/participant: {{ include "tenant.username" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: Opaque
stringData:
  MODEL_API_KEY: {{ required "secrets.modelApiKey is required (LiteLLM virtual elApiKey | quote }}
  API_SERVER_KEY: {{ required "secrets.apiServerKey is required (Hermes bearer token)" .Values.secrets.apiServerKey | quote }}
{{- end }}