{{- include "to.checks" . -}}
{{- $ns := include "to.namespace" . -}}
{{- $agentops := include "to.agentopsNamespace" . -}}
{{- $gwHost := include "to.gatewayHost" . -}}
{{- $mcpHost := include "to.mcpGatewayHost" . -}}
{{- $mcpUrl := printf "http://%s:8080/mcp" $mcpHost -}}
{{/*
The bridge between the console and Hermes in the sandbox.

The participant starts Hermes themselves, from the `cli` container:

  oc exec -it deploy/hermes-openshell-bridge -c cli -- bash
  openshell gateway add $GATEWAY_URL --local --name lab
  openshell gateway select lab
  openshell sandbox create --name hermes --from $HERMES_IMAGE --policy /hermes/policy.yaml \
    --cpu $SANDBOX_CPU --memory $SANDBOX_MEMORY --no-tty -- true
  tar -C /hermes -cz . | openshell sandbox exec --name hermes -- \
    sh -c 'mkdir -p /sandbox/setup && tar -xz -C /sandbox/setup'
  openshell sandbox exec --name hermes -- sh /sandbox/setup/start-hermes.sh
  openshell service expose hermes 8080 openai

`sandbox create` ends with a harmless "No such file or directory": its initial
command, like `sandbox upload`, goes over ssh, and this image has no ssh client.
That is why the upload is a tar stream through `sandbox exec`, which uses the
gateway's own API (verified on cluster-z5jhc).

Three containers:

  cli         Where the participant runs those commands: the openshell CLI on
              PATH, the gateway's client certificate pre-placed for the gateway
              name "lab", and the supervisor's prepared files at /hermes.
  supervisor  Prepares /hermes before the participant starts: waits for the MCP
              gateway, renders Hermes' config with the model key, fetches the
              MLflow plugin and token, and copies the current sandbox policy.
              Then adopts the participant's exposed Hermes for the relay, and
              restarts it — by re-running start-hermes.sh in the sandbox — when
              it stops answering, or, if roleWatch.enabled, the moment the
              operator's Keycloak tool: roles change (see
              files/bridge-supervisor.sh's role_watch_loop). It never creates
              the sandbox and never applies a policy.
  relay-proxy nginx on :8787, forwarding to the relay with the gateway's client
              certificate and the relay's Host header, unbuffered so streamed
              replies stream. A 503 placeholder until there is a Hermes to relay
              to, so the pod is Ready either way.

The sandbox policy participants edit is tenant-policy's openshell-sandbox-policy
ConfigMap in this namespace, mounted at /policy. Until that Application has been
synced it does not exist, and the supervisor publishes the baseline shipped here
(templates/_sandbox-policy.tpl), which is the same permissive starting point.
Either way it lands at /hermes/policy.yaml, refreshed when it changes; applying
it, and restarting Hermes, is the participant's job:

  openshell policy set --policy /hermes/policy.yaml --wait hermes
  openshell sandbox exec --name hermes -- sh /sandbox/setup/start-hermes.sh

Why a supervisor at all. A sandbox pod always runs `sleep infinity`; the
command given to `openshell sandbox create` is a one-off exec, not the pod's
command (verified on cluster-tpss7). Processes started with
`openshell sandbox exec` run inside the policy-enforced network namespace, which
is the only place the relay can reach, but nothing restarts them. The
supervisor restarts them when roles change or Hermes stops answering; if the
sandbox pod itself restarts, the participant re-runs start-hermes.sh.

Why a proxy rather than pointing the console at the relay. The relay needs the
gateway's client certificate, which the console should not hold. The console
keeps speaking plain HTTP to a Service named hermes-agent on 8787, exactly as it
does to the plain Hermes Deployment. The participant does hold the certificate,
in the cli container: with it they can create sandboxes of any image as the
privileged sandbox ServiceAccount — which, with admin on this namespace, they
could reach anyway.

Why the relay's Host header. The relay routes on Host, not on SNI or address
(verified: gateway Service DNS name plus Host: <relay host> -> 200, without it
-> 404). The gateway certificate already covers the Service name, so no
hostAliases or pinned ClusterIP is needed.

Restarting this Deployment does not restart Hermes, which lives in the sandbox
pod: the supervisor adopts it again. It does end a participant's cli session.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-openshell-bridge
  namespace: {{ $ns }}
  labels:
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
# Tenant provisioning owns this Secret in the same namespace. The bridge can
# read this one Secret; participants cannot read Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-openshell-bridge-env
  namespace: {{ $agentops }}
  labels:
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.hermes.envSecret | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-openshell-bridge-env
  namespace: {{ $agentops }}
  labels:
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-openshell-bridge-env
subjects:
  - kind: ServiceAccount
    name: hermes-openshell-bridge
    namespace: {{ $ns }}
{{- if .Values.mlflow.enabled }}
---
# MLflow turns every request into a Kubernetes SelfSubjectAccessReview: it runs
# with --app-name=kubernetes-auth and self_subject_access_review, and reviews
# against the namespace named in X-MLflow-Workspace, which is this
# participant's lab namespace. Creating the experiment is `create`; posting
# spans to /v1/traces is `update` on the same resource — the plugin's
# rules_base.py maps the OTLP route to experiments, with the experiment name
# from the x-mlflow-experiment-id header as the RBAC resourceName.
#
# Nothing serves mlflow.kubeflow.org: there is no CRD, and none is needed,
# because access review matches these strings against RBAC and no object is
# ever created. Without this Role, reads answer 200 and writes 403
# PERMISSION_DENIED (verified on cluster-jddlk).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-openshell-bridge-mlflow
  namespace: {{ $agentops }}
  labels:
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-openshell-bridge-mlflow
  namespace: {{ $agentops }}
  labels:
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-openshell-bridge-mlflow
subjects:
  - kind: ServiceAccount
    name: hermes-openshell-bridge
    namespace: {{ $ns }}
---
# MLflow reads the caller's identity from the bearer token, and the sandbox
# holds a static file while the bridge's projected token rotates. So the bridge
# mints a long-lived one for itself. resourceNames keeps that to its own
# ServiceAccount: it cannot mint a token for the sandbox's privileged one,
# which lives in this namespace too.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-openshell-bridge-token
  namespace: {{ $ns }}
  labels:
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["hermes-openshell-bridge"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-openshell-bridge-token
  namespace: {{ $ns }}
  labels:
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-openshell-bridge-token
subjects:
  - kind: ServiceAccount
    name: hermes-openshell-bridge
    namespace: {{ $ns }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-openshell-bridge
  namespace: {{ $ns }}
  labels:
    {{- include "to.labels" . | nindent 4 }}
data:
  supervisor.sh: |
{{ .Files.Get "files/bridge-supervisor.sh" | indent 4 }}
  mcp-token-refresh.py: |
{{ .Files.Get "files/mcp-token-refresh.py" | indent 4 }}
  wait-for-gateway.py: |
{{ .Files.Get "files/wait-for-gateway.py" | indent 4 }}
  start-hermes.sh: |
{{ .Files.Get "files/start-hermes.sh" | indent 4 }}
  # Hermes' config. The supervisor appends the model block, which carries the
  # key, so the key never reaches a manifest, and publishes it to /hermes.
  hermes-config.yaml: |
    mcp_servers:
      # One endpoint: this participant's MCP Gateway. `auth: oauth` makes Hermes
      # send the token mcp-token-refresh.py keeps at
      # $HERMES_HOME/mcp-tokens/gateway.json.
      gateway:
        url: {{ $mcpUrl | quote }}
        transport: streamable-http
        auth: oauth
        ssl_verify: false
        enabled: true
        timeout: {{ .Values.hermes.mcpTimeoutSeconds }}
        connect_timeout: 30

    # The relay strips Authorization before a request reaches Hermes; the
    # gateway's mTLS has already authenticated the caller. skip_auth, a patch in
    # this image, accepts loopback callers without a bearer, and only when set
    # under `extra`. See hermes/README.md in the agent repo.
    platforms:
      api_server:
        enabled: true
        extra:
          skip_auth: true
{{- if .Values.mlflow.enabled }}

    # Traces to MLflow. The supervisor installs the plugin and writes its
    # config into the sandbox; Hermes only has to switch it on.
    plugins:
      enabled: [hermes_otel]
{{- end }}
{{- if .Values.mlflow.enabled }}
  # hermes_otel's own config. The supervisor fills in the experiment id and the
  # token, and publishes it to /hermes: the token authenticates the
  # participant's agent to MLflow, so it never belongs in a manifest.
  hermes-otel-config.yaml.template: |
    enabled: true
    force_flush_on_session_end: true
    capture_sender_id: true
    capture_conversation_history: true
    backends:
      - type: otlp
        name: mlflow
        # The relay in this pod, over plain HTTP: OpenShell's egress proxy
        # cannot verify MLflow's service-CA certificate, so the sandbox never
        # speaks to MLflow directly. OTLP ingest sits at the server root, not
        # under the /mlflow prefix the REST API uses.
        endpoint: {{ printf "http://%s:%v/v1/traces" (include "to.mlflowRelayHost" .) .Values.mlflow.relay.port | quote }}
        metrics: false
        logs: false
        headers:
          x-mlflow-experiment-id: "__MLFLOW_EXPERIMENT_ID__"
          Authorization: "Bearer __MLFLOW_TOKEN__"
          X-MLflow-Workspace: {{ $agentops | quote }}
{{- end }}
  # The sandbox policy used until tenant-policy's openshell-sandbox-policy
  # exists. See templates/_sandbox-policy.tpl.
  baseline-policy.yaml: |
{{ include "to.baselinePolicy" . | indent 4 }}
  # Rendered by the supervisor into /shared/nginx.conf, twice over: first as a
  # placeholder (the #BEGIN_RELAY..#END_RELAY block dropped, the #PLACEHOLDER
  # line kept), then — once the participant has exposed Hermes — with
  # __GATEWAY_HOST__ and __RELAY_HOST__ filled in and the placeholder dropped.
  # relay-proxy reloads nginx whenever the file changes.
  nginx.conf.template: |
    daemon off;
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
      access_log /dev/stdout;
      client_body_temp_path /tmp/nginx-client-body;
      proxy_temp_path /tmp/nginx-proxy;
      fastcgi_temp_path /tmp/nginx-fastcgi;
      uwsgi_temp_path /tmp/nginx-uwsgi;
      scgi_temp_path /tmp/nginx-scgi;
      server {
        listen {{ .Values.bridge.port }};
        # The pod's own readiness: nginx is up, whether or not Hermes is.
        location = /healthz {
          default_type text/plain;
          return 200 "ok\n";
        }
        location / {
          #PLACEHOLDER default_type text/plain; return 503 "Hermes is not started in the OpenShell sandbox yet - see the lab instructions\n";
          #BEGIN_RELAY
          proxy_pass https://__GATEWAY_HOST__:8080;
          proxy_http_version 1.1;
          proxy_set_header Host __RELAY_HOST__;
          proxy_set_header Connection "";
          proxy_ssl_certificate /mtls/tls.crt;
          proxy_ssl_certificate_key /mtls/tls.key;
          proxy_ssl_trusted_certificate /mtls/ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 2;
          proxy_ssl_name __GATEWAY_HOST__;
          proxy_ssl_server_name on;
          # Streamed replies: no buffering either way, and room for a long turn.
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;
          client_max_body_size 10m;
          #END_RELAY
        }
      }
{{- if .Values.mlflow.enabled }}
      # The MLflow relay. Spans arrive from the sandbox as plain HTTP and leave
      # as HTTPS, verified against the service CA OpenShift injects at
      # /service-ca. This exists because OpenShell's egress proxy re-originates
      # TLS and trusts only public roots, so it cannot verify MLflow's
      # service-CA certificate; plain HTTP in-cluster is a path it does allow.
      server {
        listen {{ .Values.mlflow.relay.port }};
        location / {
          proxy_pass https://{{ .Values.mlflow.host }}:{{ .Values.mlflow.port }};
          proxy_http_version 1.1;
          proxy_set_header Host {{ .Values.mlflow.host }};
          proxy_set_header Connection "";
          proxy_ssl_trusted_certificate /service-ca/service-ca.crt;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 2;
          proxy_ssl_name {{ .Values.mlflow.host }};
          proxy_ssl_server_name on;
          proxy_buffering off;
          proxy_request_buffering off;
          proxy_read_timeout 120s;
          proxy_send_timeout 120s;
          client_max_body_size 10m;
        }
      }
{{- end }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-openshell-bridge
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-openshell-bridge
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    # After the gateway (wave 0), whose client certificate this mounts.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  # Two supervisors would fight over one sandbox.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-openshell-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-openshell-bridge
        {{- include "to.labels" . | nindent 8 }}
      annotations:
        # Roll the bridge when its scripts or any value change. Hermes keeps
        # running in the sandbox; the new supervisor adopts it.
        checksum/bridge: {{ printf "%s%s%s%s" (.Files.Get "files/bridge-supervisor.sh") (.Files.Get "files/wait-for-gateway.py") (.Files.Get "files/start-hermes.sh") (toJson .Values) | sha256sum }}
    spec:
      serviceAccountName: hermes-openshell-bridge
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: get-openshell-cli
          image: {{ .Values.bridge.cliImage }}
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              curl -fsSL "https://github.com/NVIDIA/OpenShell/releases/download/{{ .Values.bridge.cliVersion }}/openshell-x86_64-unknown-linux-musl.tar.gz" \
                | tar -xz -C /tools openshell
              chmod +x /tools/openshell
              /tools/openshell --version
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.bridge.resources | nindent 12 }}
          volumeMounts:
            - { name: tools, mountPath: /tools }
      containers:
        - name: supervisor
          image: {{ .Values.bridge.cliImage }}
          command: ["bash", "/config/supervisor.sh"]
          env:
            - { name: HOME, value: /tmp }
            - { name: SANDBOX_NAME, value: {{ .Values.sandbox.name | quote }} }
            - { name: IMAGE_REF, value: {{ .Values.sandbox.image | quote }} }
            - { name: SANDBOX_CPU, value: {{ .Values.sandbox.cpu | quote }} }
            - { name: SANDBOX_MEMORY, value: {{ .Values.sandbox.memory | quote }} }
            - { name: API_PORT, value: {{ .Values.sandbox.apiPort | quote }} }
            - { name: GATEWAY_HOST, value: {{ $gwHost | quote }} }
            - { name: AGENTOPS_NS, value: {{ $agentops | quote }} }
            - { name: HERMES_ENV_SECRET, value: {{ .Values.hermes.envSecret | quote }} }
            - { name: HEALTH_CHECK_SECONDS, value: {{ .Values.bridge.healthCheckSeconds | quote }} }
            - { name: TOKEN_REFRESH_SECONDS, value: {{ .Values.hermes.tokenRefreshSeconds | quote }} }
            - { name: MODEL_BASE_URL, value: {{ .Values.model.baseUrl | quote }} }
            - { name: MODEL_DEFAULT, value: {{ .Values.model.model | quote }} }
            - { name: MCP_GATEWAY_URL, value: {{ $mcpUrl | quote }} }
            - { name: MCP_WAIT_SECONDS, value: {{ .Values.hermes.mcpWaitSeconds | quote }} }
            - name: MCP_PREFIXES
              value: "{{ range $i, $s := .Values.mcpGateway.servers }}{{ if $i }},{{ end }}{{ trimSuffix "-mcp" $s }}_{{ end }}"
            - { name: MCP_SERVER_NAME, value: gateway }
            - { name: MCP_CLIENT_ID, value: {{ .Values.keycloak.agentClientId | quote }} }
            - { name: MCP_USERNAME, value: {{ .Values.keycloak.agentUser | quote }} }
            - { name: MCP_PASSWORD, value: {{ .Values.keycloak.agentPassword | quote }} }
            - name: MCP_TOKEN_URL
              value: {{ printf "https://%s/realms/waterplant-%s/protocol/openid-connect/token" .Values.keycloak.host .Values.username | quote }}
            # This namespace, for the token the bridge mints for itself.
            - { name: OPENSHELL_NS, value: {{ $ns | quote }} }
            - { name: ROLE_WATCH_ENABLED, value: {{ .Values.roleWatch.enabled | quote }} }
            - { name: ROLE_WATCH_SECONDS, value: {{ .Values.roleWatch.pollSeconds | quote }} }
            - { name: ROLE_WATCH_ADMIN_USER, value: {{ .Values.roleWatch.adminUser | quote }} }
            - { name: ROLE_WATCH_ADMIN_PASSWORD, value: {{ .Values.roleWatch.adminPassword | quote }} }
            - { name: MLFLOW_ENABLED, value: {{ .Values.mlflow.enabled | quote }} }
{{- if .Values.mlflow.enabled }}
            - { name: MLFLOW_TRACKING_URI, value: {{ .Values.mlflow.trackingUri | quote }} }
            - { name: MLFLOW_EXPERIMENT, value: {{ .Values.mlflow.experimentName | default .Values.username | quote }} }
            - { name: MLFLOW_TOKEN_DURATION_HOURS, value: {{ .Values.mlflow.tokenDurationHours | quote }} }
            - name: MLFLOW_PLUGIN_URL
              value: {{ printf "https://github.com/%s/archive/%s.tar.gz" .Values.mlflow.plugin.repo .Values.mlflow.plugin.commit | quote }}
            - { name: MLFLOW_PLUGIN_SHA256, value: {{ .Values.mlflow.plugin.sha256 | quote }} }
            # GitHub names the archive's top directory <repo>-<commit>, and the
            # package is one level inside it.
            - name: MLFLOW_PLUGIN_SUBDIR
              value: {{ printf "%s-%s/hermes_otel" (last (splitList "/" .Values.mlflow.plugin.repo)) .Values.mlflow.plugin.commit | quote }}
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.bridge.resources | nindent 12 }}
          volumeMounts:
            - { name: tools, mountPath: /tools }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: policy, mountPath: /policy, readOnly: true }
            - { name: mtls, mountPath: /mtls, readOnly: true }
            - { name: shared, mountPath: /shared }
            - { name: hermes, mountPath: /hermes }
        # The participant's shell. Deliberately without the supervisor's
        # Keycloak admin and MLflow env: only what the four steps need.
        - name: cli
          image: {{ .Values.bridge.cliImage }}
          command:
            - bash
            - -c
            - |
              # Pre-place the client certificate where `openshell gateway add
              # --local --name lab` looks for it, as the supervisor does.
              mkdir -p "$XDG_CONFIG_HOME/openshell/gateways/lab/mtls"
              cp /mtls/ca.crt /mtls/tls.crt /mtls/tls.key "$XDG_CONFIG_HOME/openshell/gateways/lab/mtls/"
              cat > "$HOME/.bashrc" <<'EOF'
              PS1='[openshell \W]\$ '
              echo "OpenShell CLI for sandbox '$SANDBOX_NAME'. Gateway: $GATEWAY_URL. Prepared files: /hermes"
              EOF
              exec sleep infinity
          env:
            - { name: PATH, value: "/tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            - { name: HOME, value: /home/cli }
            - { name: XDG_CONFIG_HOME, value: /home/cli/.config }
            # Not OPENSHELL_GATEWAY: the CLI reads that as the name of the
            # gateway to use, and every command then fails "Unknown gateway".
            - { name: GATEWAY_URL, value: {{ printf "https://%s:8080" $gwHost | quote }} }
            - { name: HERMES_IMAGE, value: {{ .Values.sandbox.image | quote }} }
            - { name: SANDBOX_NAME, value: {{ .Values.sandbox.name | quote }} }
            - { name: SANDBOX_CPU, value: {{ .Values.sandbox.cpu | quote }} }
            - { name: SANDBOX_MEMORY, value: {{ .Values.sandbox.memory | quote }} }
            - { name: API_PORT, value: {{ .Values.sandbox.apiPort | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.bridge.cliResources | nindent 12 }}
          volumeMounts:
            - { name: tools, mountPath: /tools, readOnly: true }
            - { name: mtls, mountPath: /mtls, readOnly: true }
            - { name: hermes, mountPath: /hermes, readOnly: true }
            - { name: cli-home, mountPath: /home/cli }
        - name: relay-proxy
          image: {{ .Values.bridge.proxyImage }}
          command:
            - sh
            - -c
            - |
              # The supervisor writes a placeholder first, then the real relay
              # once the participant has exposed Hermes: reload on each change.
              until [ -s /shared/nginx.conf ]; do sleep 1; done
              nginx -c /shared/nginx.conf &
              pid=$!
              last=$(md5sum < /shared/nginx.conf)
              while kill -0 "$pid" 2>/dev/null; do
                sleep 2
                cur=$(md5sum < /shared/nginx.conf)
                if [ "$cur" != "$last" ]; then
                  echo "nginx.conf changed; reloading"
                  nginx -c /shared/nginx.conf -s reload
                  last=$cur
                fi
              done
              exit 1
          ports:
            - name: http
              containerPort: {{ .Values.bridge.port }}
{{- if .Values.mlflow.enabled }}
            - name: mlflow-relay
              containerPort: {{ .Values.mlflow.relay.port }}
{{- end }}
          # Ready when nginx is, not when Hermes is: Hermes waits on the
          # participant, and the tenant's sync must not.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          resources:
            {{- toYaml .Values.bridge.proxyResources | nindent 12 }}
          volumeMounts:
            - { name: mtls, mountPath: /mtls, readOnly: true }
            - { name: shared, mountPath: /shared, readOnly: true }
{{- if .Values.mlflow.enabled }}
            - { name: service-ca, mountPath: /service-ca, readOnly: true }
{{- end }}
      volumes:
        - name: tools
          emptyDir: {}
        - name: shared
          emptyDir: {}
        # What the supervisor prepares and the participant uploads.
        - name: hermes
          emptyDir: {}
        - name: cli-home
          emptyDir: {}
        - name: config
          configMap:
            name: hermes-openshell-bridge
        # The participant's sandbox policy, owned by tenant-policy. Optional:
        # until that Application syncs, the supervisor uses the baseline above.
        # The kubelet refreshes it in place, and the supervisor republishes it
        # to /hermes/policy.yaml when its content changes.
        - name: policy
          configMap:
            name: openshell-sandbox-policy
            optional: true
        # Created by the gateway chart's certgen hook, before this Deployment.
        - name: mtls
          secret:
            secretName: openshell-client-tls
{{- if .Values.mlflow.enabled }}
        # OpenShift's service CA, put there by the service-ca operator. nginx
        # verifies MLflow against it.
        - name: service-ca
          configMap:
            name: mlflow-service-ca
{{- end }}
---
# Same name and port as the plain Hermes Service, so the console's contract does
# not change with the runtime.
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-openshell-bridge
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app.kubernetes.io/name: hermes-openshell-bridge
  ports:
    - name: http
      port: {{ .Values.bridge.port }}
      targetPort: http
{{- if .Values.mlflow.enabled }}
---
# Empty on purpose: the service-ca operator fills in service-ca.crt, and
# refreshes it when the CA rotates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-service-ca
  namespace: {{ $ns }}
  labels:
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
    argocd.argoproj.io/sync-wave: "-1"
---
# Where the sandbox posts its spans. The name is what the sandbox policy allows
# and what hermes_otel is pointed at, so the two must agree — both come from
# mlflow.relay in values.yaml.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mlflow.relay.serviceName }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-openshell-bridge
    {{- include "to.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app.kubernetes.io/name: hermes-openshell-bridge
  ports:
    - name: mlflow-relay
      port: {{ .Values.mlflow.relay.port }}
      targetPort: mlflow-relay
{{- end }}
