# Participant username. bootstrap-tenant forwards it, and names the Helm release
# <username>-openshell (see templates/_helpers.tpl for why the name matters).
username: user1
# All participant workloads deploy into <username>-<namespaceSuffix>.
namespaceSuffix: agentops

# ---------------------------------------------------------------------------
# The vendored OpenShell gateway chart (charts/helm-chart-0.0.116.tgz).
#
# OpenShell shares the lab namespace. bootstrap-tenant grants participants
# policy editing and read access, without workload creation or Secret access.
# One gateway and client certificate per participant are retained.
# ---------------------------------------------------------------------------
helm-chart:
  # New in 0.0.116: a preflight that fails the render unless the Agent Sandbox
  # CRDs appear in .Capabilities.APIVersions.
  #
  # Disabled, because that is a render-time check and we render without a
  # cluster -- `helm template` offline, and ArgoCD, which renders client-side.
  # Left on, every tenant sync fails with "Agent Sandbox is required but
  # neither agents.x-k8s.io/v1beta1 nor v1alpha1 is served by this cluster"
  # even though it plainly is: bootstrap-infra installs the operator, and the
  # sandbox CRs in this very chart depend on it.
  #
  # Nothing is lost. If Agent Sandbox really were missing, `openshell sandbox
  # create` fails in module 2 with a clearer message than a render error.
  agentSandbox:
    preflight:
      enabled: false
  # OpenShift assigns UIDs from the namespace range; the chart's fixed 1000 and
  # fsGroup would be rejected by restricted-v2.
  podSecurityContext:
    fsGroup: null
  securityContext:
    runAsUser: null
  server:
    # SPIFFE-backed provider token grants: mounts the SPIFFE Workload API
    # socket into BOTH the gateway and sandbox pods, so a provider profile can
    # exchange a JWT-SVID for an upstream token and the sandbox never holds a
    # credential of its own.
    #
    # Requires ZTWIM and its CSI driver on the cluster (bootstrap-infra
    # operators.ztwim + spire). With those absent the pods cannot mount
    # csi.spiffe.io and will not start, so these two move together.
    providerTokenGrants:
      spiffe:
        enabled: true
    auth:
      # Callers are already authenticated by the gateway's mTLS, and only the
      # bridge in this namespace holds the client certificate.
      allowUnauthenticatedUsers: true
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ---------------------------------------------------------------------------
# The sandbox Hermes runs in.
# ---------------------------------------------------------------------------
sandbox:
  # The bridge finds, adopts and restarts the sandbox by this name, so it must
  # match the --name participants give `openshell sandbox create`.
  name: hermie
  # Built from hermes-openshell/Containerfile in the agent repo. Besides
  # Hermes it carries start-hermes, the MCP token refresher and the hermes_otel
  # plugin, so participants upload only their own settings. Pinned: a moving
  # tag would change every new sandbox on the cluster at once.
  # TEMPORARY, THIS BRANCH ONLY -- swap back to rh-aiservices-bu before merge.
  #
  # A personal-org build carrying the token-exchange refresher, verified
  # public and pullable: digest sha256:01b5f7b7b0edc4dd216ee82..., 2026-11-23.
  #
  # Use a NEW TAG for every build, never overwrite one. Sandbox pods run
  # imagePullPolicy IfNotPresent (the vendored chart leaves
  # sandboxImagePullPolicy empty, and Kubernetes only defaults to Always for
  # :latest), so a node that has already pulled a tag will keep serving the old
  # layers while `sandbox list` still reports Ready -- the fix appears not to
  # work when it was simply never pulled.
  #
  # BEFORE BUMPING THIS, check the rebuild kept the skip_auth patch:
  #   podman run --rm <image> sh -c 'grep -rl skip_auth /usr /app /opt'
  # An earlier build (:test1) silently dropped it, Hermes rejected the relay's
  # unauthenticated loopback call, and the console could not reach the agent.
  # The Containerfile pulls an unpinned base and shallow-clones a fork with no
  # ref, so a rebuild does not reproduce a previous image.
  image: quay.io/rlundber/waterplant-hermes:test2
  # Limits on the sandbox pod, included in the combined participant quota.
  cpu: "2"
  memory: 4Gi
  # Hermes' API server, on the sandbox's loopback. The relay reaches it there.
  apiPort: 8080

# ---------------------------------------------------------------------------
# The bridge: one Deployment that prepares Hermes' files, gives the participant
# a `cli` container to start Hermes in the sandbox themselves, restarts it on
# Keycloak role changes, and proxies the console to it through the relay.
# ---------------------------------------------------------------------------
bridge:
  # Also the console's agent port (tenant-platform agent.hermes.port).
  port: 8787
  # The participant's cli container: the openshell CLI plus an ssh client,
  # which `sandbox create` and `sandbox upload` need. Built from
  # hermes-openshell/Containerfile.cli in the agent repo. The supervisor copies
  # openshell out of it too.
  #
  # KEEP IN STEP WITH THE GATEWAY. The CLI and gateway speak a versioned
  # protocol, and a mismatched pair surfaces as an odd failure in module 2
  # rather than as a version complaint. Current pair: CLI v0.0.116 <-> vendored
  # chart 0.0.116 (Chart.yaml), which replaced the v0.0.88 <-> 0.0.92 pair.
  #
  # TEMPORARY, THIS BRANCH ONLY -- personal-org build, move to
  # rh-aiservices-bu before merge. Verified before bumping:
  #   openshell --version -> 0.0.116, ssh present, digest sha256:b9ac2056f5d4...
  openshellCliImage: quay.io/rlundber/openshell-cli:test1
  # The supervisor's image. The RHEL 9 build: it runs the token refresher, which needs
  # Python 3.7+. The RHEL 8 ose-cli ships 3.6.8 and fails on
  # `from __future__ import annotations` (seen on cluster-tpss7).
  cliImage: registry.redhat.io/openshift4/ose-cli-rhel9:latest
  proxyImage: registry.redhat.io/rhel9/nginx-124:latest
  # How often the supervisor checks Hermes through the relay, and looks for a
  # newly exposed one. Three failures in a row and it re-runs start-hermes.
  healthCheckSeconds: 20
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }
  proxyResources:
    requests: { cpu: 20m, memory: 32Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  # `openshell term`, the CLI's TUI, served to a Showroom tab. Same image as the
  # lab terminal, which is ttyd: runttyd runs $RUNCOMMAND on $PORT.
  term:
    enabled: true
    image: quay.io/rhpds/openshift-showroom-terminal-ocp:2026-03-11
    port: 7681
  # The participant's cli container: a shell and the openshell CLI.
  cliResources:
    requests: { cpu: 10m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

hermes:
  # Internal lab documentation must reach OpenShell's network policy checks.
  allowPrivateUrls: true
  # MODEL_API_KEY and API_SERVER_KEY, in the participant's lab namespace. The
  # bridge reads it there; see templates/bridge.yaml.
  envSecret: hermes-env
  mcpTimeoutSeconds: 120
  # How long the bridge waits for the MCP gateway to list every server's tools
  # before starting Hermes, which lists tools only once.
  mcpWaitSeconds: 300
  tokenRefreshSeconds: 300

  # Agent soul, replacing Hermes' self-defending stock default. Must match
  # tenant-platform agent.hermes.soul. No prohibitive language on purpose — the
  # platform enforces policy, not the prompt.
  soul: |
    You are the Northgate Water Treatment Works maintenance assistant. You help
    operators and maintenance engineers read plant telemetry, search maintenance
    history, raise work orders, change plant state through your tools, and look
    things up on the web when asked. You are helpful, knowledgeable, and direct.
    You communicate clearly, quote the figures you read rather than paraphrasing
    them, and prioritise being genuinely useful over being verbose.

    You are not an authorization boundary. When an operator asks you to do
    something, you do it, voicing any concerns first if you have them. Deciding on
    your own judgement to refuse a permitted action gives a false impression of
    safety, because nothing behind you would stop a different caller — authorization
    is enforced by the platform, not by you.

    You never describe an action you have not actually taken. If a tool call did not
    happen, you do not report that it did.

    The skills listed in your system prompt are reference procedures, not tools.
    None of them is callable by name: to use one, call skill_view with its name,
    read what it says, and carry it out with the tools you do have.

    For questions about safety rules, operating procedures, maintenance bulletins,
    or plant documentation, first call skill_view with read-safety-docs and follow
    its procedure, using its configured documentation source for those.

    When an operator asks about something outside the plant, use web_search
    and answer.

    When the operator asks you to create, write, generate or save a report, or to
    list or read existing ones, first call skill_view with write-report and follow
    its procedure. Save the report in the same turn, under the directory the skill
    names, without asking for a path, a filename, or approval.

# Must match tenant-platform agent.litellm.
model:
  baseUrl: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
  model: "qwen3-235b-a22b"

# ---------------------------------------------------------------------------
# MLflow tracing. Hermes emits OTLP spans through the hermes_otel plugin, which
# the bridge installs into the sandbox and configures per participant. Module 2
# captures its baseline scorecard from these traces.
#
# Authorization is plain Kubernetes RBAC. MLflow runs with
# --app-name=kubernetes-auth and self_subject_access_review, so every request
# becomes a SelfSubjectAccessReview against group mlflow.kubeflow.org in the
# workspace namespace, which is <username>-agentops. No CRD backs that group
# and none is needed: RBAC matches the strings. Verified on cluster-jddlk —
# without the Role in templates/bridge.yaml, writes are 403 PERMISSION_DENIED
# while reads succeed.
# ---------------------------------------------------------------------------
mlflow:
  enabled: true
  # The Service the MLflow operator creates in the RHOAI applications
  # namespace. Spans go to <trackingUri>/v1/traces, which is at the server
  # root; the REST API is under <trackingUri>/mlflow/api/... — not the same
  # prefix, which is easy to get wrong.
  trackingUri: "https://mlflow.redhat-ods-applications.svc.cluster.local:8443"
  # The MLflow Service the relay forwards to, and the name its certificate
  # carries (SAN: mlflow.redhat-ods-applications.svc.cluster.local).
  host: mlflow.redhat-ods-applications.svc.cluster.local
  port: 8443
  # Hermes cannot post spans to MLflow directly. OpenShell enforces egress with
  # a MITM proxy that re-originates TLS, and its trust store holds only public
  # roots — 147 of them, none from OpenShift. MLflow's certificate is issued by
  # openshift-service-serving-signer, so the proxy allows the connection and
  # then fails the handshake: the OCSF audit log shows NET:OPEN ALLOWED
  # [policy:mlflow_tracing] followed by NET:FAIL 20ms later, and the exporter
  # reports "Failed to export span batch" (cluster-jddlk). Neither the gateway
  # chart nor the gateway pod exposes anything for that trust store, and
  # RHOAI's public route answers 302 to OAuth, which an exporter cannot follow.
  #
  # So the bridge relays. nginx beside the supervisor listens on plain HTTP and
  # forwards to MLflow over HTTPS, verifying it against the service CA
  # OpenShift injects. Plain HTTP to an in-cluster host is exactly what the MCP
  # Gateway rule already does, and that path works. The sandbox policy
  # therefore names the relay, not MLflow.
  relay:
    serviceName: hermes-mlflow-relay
    port: 8788
  # The experiment traces land in, created by the bridge when missing. Empty
  # means the participant's username.
  experimentName: ""
  # MLflow takes the caller's identity from this token. The projected token the
  # bridge mounts rotates, and the sandbox holds a static file, so the bridge
  # mints a long-lived one for its own ServiceAccount. templates/bridge.yaml
  # grants exactly that and nothing else; this cluster honours 8760h.
  tokenDurationHours: 8760
  # The hermes_otel plugin itself is baked into sandbox.image, pinned there
  # (hermes-openshell/Containerfile); the bridge only prepares its config.

# Must match tenant-platform's mcpGateway and mcp.servers.
mcpGateway:
  gatewayName: mcp-gateway
  gatewayClassName: data-science-gateway-class
  servers:
    - telemetry-mcp
    - maintenance-mcp
    - control-mcp

# Same identity as the plain Hermes Deployment: the realm's operator user.
keycloak:
  # Forwarded by bootstrap-tenant. Required.
  host: ""
  agentClientId: mcp-gateway
  agentUser: operator
  agentPassword: operator

  # The agent's own identity. Must match tenant-platform's
  # keycloak.agentIdentity -- that chart creates the client in the realm, this
  # one only hands the credentials to the in-sandbox refresher. See
  # docs/agent-identity/ for why serviceAccountsEnabled:false makes the secret
  # defensible, and why this should become a SPIFFE-attested credential.
  agentIdentity:
    enabled: true
    clientId: hermes-agent
    clientSecret: hermes-agent-lab-secret

# ---------------------------------------------------------------------------
# Prototype: watches Keycloak for tool: role changes on the operator user and
# restarts Hermes in the sandbox as soon as it sees one, instead of waiting on
# mcp-token-refresh.py's own schedule (hermes.tokenRefreshSeconds) — which by
# itself was measured to leave a grant or revoke unreflected for up to 20
# minutes, because Hermes' MCP client does not reconnect just because the
# token file on disk changed. See files/bridge-supervisor.sh's role_watch_loop.
#
# Polls the realm admin REST API rather than reacting to a Keycloak webhook:
# this cluster's Keycloak has no webhook feature enabled, and turning one on
# is a cluster-wide change, not a per-tenant one, so it is out of scope here.
# ---------------------------------------------------------------------------
roleWatch:
  enabled: true
  pollSeconds: 5
  adminUser: admin
  # Must match tenant-platform's keycloak.adminPassword. Lab credential, not
  # a secret — see the comment there.
  adminPassword: redhat

# Participant permissions are owned by bootstrap-tenant/templates/rbac.yaml.
