{{- if .Values.installPlanApprover.enabled }}
{{/*
Approves the InstallPlans for this lab's pinned operators, and nothing else.

Why this exists: every Subscription in operators.yaml sets installPlanApproval
Manual, which is correct for Tech Preview components whose APIs shift between
builds — an unattended upgrade between a dry run and delivery day would silently
re-base the policy CRs the whole lab rests on. But nothing approved the initial
InstallPlan, so a freshly provisioned cluster simply stopped: observed on
cluster-mc86p sitting 47 minutes with both Subscriptions in UpgradePending, no
CSVs, and the DataScienceCluster, MLflow, EvalHub and ClusterRole all Missing
behind the wave gate. That is not viable for an event.

This Job restores the intent of the pin rather than removing it. It approves
ONLY an InstallPlan whose clusterServiceVersionNames contains the exact
startingCSV pinned in values.yaml. A later InstallPlan produced by a catalog
refresh carries a different CSV, does not match, and is left alone — so the
initial install is unattended and upgrades still are not.

Do NOT replace this with installPlanApproval: Automatic. That defeats the pin
over time, which is the outcome operators.yaml argues against at length.

SYNC WAVE: -2, the SAME wave as the Subscriptions, and that is load-bearing.
ArgoCD applies every resource in a wave, then waits for all of them to be
healthy before moving on. A Subscription is not healthy until its InstallPlan is
approved, so an approver in any LATER wave can never run — the sync is still
blocked waiting on the very thing the approver would unblock. Sharing the wave
means both are applied together and the Job can act while ArgoCD is waiting.
An EARLIER wave deadlocks the other way: the Job would wait for InstallPlans
that the Subscriptions have not created yet.

Runs as a Sync hook with BeforeHookCreation so a changed pin re-runs cleanly —
a plain Job would fail to apply on the next sync, because a Job's spec is
immutable once created.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: installplan-approver
  namespace: {{ .Values.installPlanApprover.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentops-installplan-approver
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
rules:
  # Cluster-scoped because the InstallPlans live in one namespace per operator
  # (redhat-ods-operator, agent-sandbox-system, and any others enabled later),
  # and that set is driven by values.yaml rather than fixed here.
  - apiGroups: [operators.coreos.com]
    resources: [installplans]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [operators.coreos.com]
    resources: [subscriptions, clusterserviceversions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentops-installplan-approver
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentops-installplan-approver
subjects:
  - kind: ServiceAccount
    name: installplan-approver
    namespace: {{ .Values.installPlanApprover.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: installplan-approver
  namespace: {{ .Values.installPlanApprover.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.installPlanApprover.timeoutSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: installplan-approver
        rhdp.redhat.com/lab: agentops-in-action
    spec:
      serviceAccountName: installplan-approver
      restartPolicy: Never
      containers:
        - name: approve
          image: {{ .Values.installPlanApprover.image }}
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 200m, memory: 256Mi }
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              DEADLINE=$(( $(date +%s) + {{ .Values.installPlanApprover.timeoutSeconds }} - 30 ))

              # ns=csv pairs, one per enabled operator, straight from values.yaml
              PAIRS="{{- range $k, $op := .Values.operators }}{{- if $op.enabled }}{{ $op.namespace }}={{ $op.csv }} {{ end }}{{- end }}"
              echo "waiting to approve InstallPlans for: $PAIRS"

              for pair in $PAIRS; do
                NS="${pair%%=*}"
                CSV="${pair#*=}"
                echo "--- $NS / $CSV"
                while true; do
                  # Only an InstallPlan carrying the exact pinned CSV qualifies.
                  IP=$(oc get installplan -n "$NS" \
                        -o jsonpath="{range .items[?(@.spec.clusterServiceVersionNames[0]=='$CSV')]}{.metadata.name} {.spec.approved}{'\n'}{end}" \
                        2>/dev/null | head -1 || true)
                  NAME=$(echo "$IP" | awk '{print $1}')
                  APPROVED=$(echo "$IP" | awk '{print $2}')

                  if [ -n "$NAME" ]; then
                    if [ "$APPROVED" = "true" ]; then
                      echo "    $NAME already approved — nothing to do"
                      break
                    fi
                    echo "    approving $NAME"
                    oc patch installplan "$NAME" -n "$NS" --type merge -p '{"spec":{"approved":true}}'
                    break
                  fi

                  if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                    echo "    TIMEOUT: no InstallPlan for $CSV appeared in $NS."
                    echo "    Most likely the pinned startingCSV no longer exists in the catalog —"
                    echo "    re-verify operators.*.csv in values.yaml against this cluster."
                    exit 1
                  fi
                  sleep 5
                done
              done
              echo "all pinned InstallPlans approved"
{{- end }}
