# The single Application the kustomize entry point creates.
#
# It runs under `project: default`, exactly as the provisioned `bootstrap`
# Application does, and for the same reason: it has to be able to create the
# AppProject that everything else belongs to. That AppProject is defined in the
# argocd chart this points at, at sync wave -1, ahead of the Applications and
# ApplicationSets that reference it at wave 0.
#
# Chain, end to end:
#
#   bootstrap            (RHDP, plugin)  -> automation/gitops/bootstrap-infra  [kustomize]
#   agentops-app-of-apps (this file)     -> automation/gitops/argocd           [helm]
#   agentops-infra                       -> automation/gitops/bootstrap-infra  [helm]
#   <user>-namespace / -platform / -policy from the three ApplicationSets
#
# Note the third line targets this same directory. ArgoCD renders it with Helm
# because that Application sets an explicit `helm:` block, and Helm only reads
# templates/ — so kustomization.yaml and this file are invisible to it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentops-app-of-apps
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Pin to a per-event tag before a delivery. On a moving branch, a merge to
    # main reaches a live lab mid-exercise. This must be kept in step with
    # repo.targetRevision in automation/gitops/argocd/values.yaml.
    repoURL: https://github.com/rhpds/agentops-in-action-workshop.git
    targetRevision: main
    path: automation/gitops/argocd
    helm:
      releaseName: agentops-bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: { duration: 20s, factor: 2, maxDuration: 5m }
