deployer:
  domain: apps.example.com

lab:
  # Shared namespace for cluster-wide lab infrastructure
  sharedNamespace: agentops-shared
  # ArgoCD project owning the per-participant Applications that bootstrap-tenant
  # creates. Defined in templates/argocd-project.yaml — see the note there on
  # why it is safe for this chart to own it.
  argocdProject: agentops-in-action
  argocdNamespace: openshift-gitops
  # Per-participant namespace is <username>-<namespaceSuffix>. Must match
  # namespaceSuffix in bootstrap-tenant, tenant-platform and tenant-policy.
  namespaceSuffix: agentops
  # Each participant's OpenShell gateway and Hermes sandbox run in
  # <username>-<openshellNamespaceSuffix>, which participants have no rights in.
  # Must match bootstrap-tenant and tenant-openshell.
  openshellNamespaceSuffix: openshell
  # Where the RHDP-provisioned Keycloak runs. Each participant's realm is a
  # KeycloakRealmImport, which must live beside the Keycloak CR, so tenant
  # Applications need this as an allowed destination.
  keycloakNamespace: keycloak

# Maximum concurrent participants (from spec: max_concurrent_users: 30)
maxUsers: 30

# ---------------------------------------------------------------------------
# Operators
#
# Every version below is PINNED and installPlanApproval is Manual — nothing
# upgrades on its own. See templates/operators.yaml for why, and for how to
# approve the generated InstallPlans.
#
# Versions verified against the cluster's catalog on OCP 4.22.11. Re-verify
# before each event build: a catalog refresh can retire a CSV, and a pinned
# startingCSV that no longer exists leaves the Subscription stuck.
#
# `dependencies` lists CSVs OLM resolves into the same InstallPlan. The
# approver refuses any plan containing a CSV that is neither pinned nor listed,
# so a catalog change cannot slip an unreviewed operator in alongside a pinned
# one.
# ---------------------------------------------------------------------------
operators:
  rhoai:
    enabled: true
    package: rhods-operator
    namespace: redhat-ods-operator
    channel: stable-3.5
    csv: rhods-operator.3.5.0
    source: redhat-operators

  agentSandbox:
    enabled: true
    package: agent-sandbox-operator
    namespace: agent-sandbox-system
    channel: preview-0.9
    csv: agent-sandbox-operator.v0.9.0
    source: redhat-operators

  # Red Hat Connectivity Link (GA): AuthPolicy, RateLimitPolicy and the rest of
  # the Kuadrant policy API, plus the Authorino and Limitador that enforce them.
  #
  # This replaces the community authorino-operator v0.16.0 and kuadrant-operator
  # v0.11.1 that used to sit here disabled "as the fallback for MCP Gateway".
  # That fallback is no longer needed — MCP Gateway enforces per-tool policy —
  # and both of them ship supported from redhat-operators under RHCL anyway.
  rhcl:
    enabled: true
    package: rhcl-operator
    namespace: kuadrant-system
    channel: stable
    csv: rhcl-operator.v1.4.3
    source: redhat-operators
    dependencies:
      - authorino-operator.v1.4.3
      - limitador-operator.v1.4.2
      - dns-operator.v1.4.2

  # MCP Gateway (Tech Preview, RHCL subscription): an Envoy-based broker that
  # federates MCP servers and routes each tool call through AuthPolicy.
  # Operator only — each participant's gateway instance is created by the
  # tenant chart.
  #
  # Same namespace as RHCL, deliberately. The mcp-gateway bundle declares
  # olm.package.required rhcl-operator >=1.3.2, and OLM satisfies a package
  # dependency by installing it into the dependent operator's own namespace.
  # In a separate namespace this installed RHCL a second time, alongside the
  # pinned one: two OperatorGroups then provided the same APIs, and one copy's
  # Authorino went to Failed with InterOperatorGroupOwnerConflict ("intersecting
  # operatorgroups provide the same apis"). Observed on cluster-tpss7. Sharing a
  # namespace means one OperatorGroup and RHCL resolved exactly once.
  mcpGatewayOperator:
    enabled: true
    package: mcp-gateway
    namespace: kuadrant-system
    channel: preview
    csv: mcp-gateway.v0.7.1
    source: redhat-operators

# NOTE: sandboxed-containers-operator (Kata) is deliberately NOT installed.
# The Agent Sandbox deployment is not on bare metal and this cluster runs on
# CNV, so Kata is off the critical path. Agent Sandbox still provides the
# lifecycle we need — SandboxTemplate, SandboxClaim, warm pools — on the
# standard runtime, hardened with restricted-v2, seccomp RuntimeDefault and
# SELinux. The OSC pairing exists to supply the Kata runtime we are not using,
# so leaving it out removes an operator rather than a capability.

# ---------------------------------------------------------------------------
# InstallPlan approver
#
# Approves ONLY the InstallPlans matching the pinned startingCSVs above, so the
# initial install is unattended while upgrades remain manual. See
# templates/installplan-approver.yaml for why this is not just
# installPlanApproval: Automatic, and why it shares sync wave -2.
# ---------------------------------------------------------------------------
installPlanApprover:
  enabled: true
  # Needs `oc` only. ose-cli is already pullable on any RHDP cluster.
  image: registry.redhat.io/openshift4/ose-cli:latest
  # Runs in an operator namespace (created at wave -4) rather than the shared
  # namespace, which is itself only created at wave -2 and would race the Job.
  namespace: redhat-ods-operator
  # Bounds the wait for an InstallPlan to appear. Also the Job's
  # activeDeadlineSeconds; the script stops 30s earlier so it fails with a
  # useful message rather than being killed mid-poll.
  timeoutSeconds: 600

# ---------------------------------------------------------------------------
# MCP Gateway — cluster-level pieces (templates/mcp-gateway-platform.yaml)
#
# One Gateway per participant, created by tenant-platform. What lives here is
# only what must be singular: the Kuadrant instance, and the network rule that
# stops anything but a gateway reaching an MCP server.
# ---------------------------------------------------------------------------
mcpGateway:
  enabled: true
  # The AdminNetworkPolicy selects Envoy pods by this Gateway name, so it must
  # match tenant-platform's mcpGateway.gatewayName.
  gatewayName: mcp-gateway
  serverPort: 8080
  # ANP priorities must be unique cluster-wide (two at one priority is
  # undefined). Leaves 0-49 for platform policies above this one.
  networkPolicyPriority: 50

# ---------------------------------------------------------------------------
# RHOAI DataScienceCluster
# ---------------------------------------------------------------------------
datascience:
  enabled: true
  applicationsNamespace: redhat-ods-applications
  # Component names are the DataScienceCluster **v2** set, read from the CRD
  # schema on this cluster. v2 is the storage version in RHOAI 3.5 and its
  # component list differs from v1 — `datasciencepipelines` and `codeflare` no
  # longer exist, and several capabilities this lab needs appear as first-class
  # components for the first time.
  components:
    # --- The lab's core dependencies ---
    aigateway: Managed             # Model Gateway — the governed inference endpoint (D2)
    # MCP server lifecycle: runs the MCPServer resources in tenant-platform. It
    # is NOT the MCP Gateway — its CRD has no routing or authorization surface.
    # The gateway comes from the mcpGatewayOperator above.
    mcplifecycleoperator: Managed
    mlflowoperator: Managed        # MLflow tracing — the observability spine of the lab
    trustyai: Managed              # Guardrails Orchestrator and Garak integration
    kserve: Managed                # model serving, underpins aigateway
    dashboard: Managed             # RHOAI console

    # --- Deliberately off ---
    # Each of these costs footprint on a shared 30-tenant cluster and none is on
    # the lab's critical path.
    llamastackoperator: Removed    # D1 selected LangGraph as the agent framework
    ogx: Removed                   # Open Responses — revisit only if OGX earns a place
    workbenches: Removed           # attendees get a browser and a toolbox pod, not notebooks
    modelregistry: Removed
    aipipelines: Removed
    kueue: Removed
    ray: Removed
    trainer: Removed
    trainingoperator: Removed
    sparkoperator: Removed
    feastoperator: Removed

# ---------------------------------------------------------------------------
# Shared lab services — one instance for the whole event
#
# These carry the only data in the lab that must survive a pod restart: the
# baseline scorecard, captured in module 2 and compared against in module 6.
# See templates/shared-services.yaml.
# ---------------------------------------------------------------------------
sharedServices:
  mlflow:
    enabled: true
    # NOTE: the resource name is fixed at "mlflow" by the operator's webhook —
    # it is a per-namespace singleton, so there is no name to configure here.
    replicas: 1
    backendStoreUri: "sqlite:////mlflow/mlflow.db"
    artifactsDestination: "file:///mlflow/artifacts"
    storageSize: 20Gi
    # Empty means the cluster default (ODF Ceph RBD here).
    storageClass: ""

  evalhub:
    enabled: true
    name: agentops-evalhub
    databaseType: sqlite
