id: telemetry-lookup
kind: eval
title: Agent can read plant telemetry
description: >-
  The simplest possible "are the tools working at all" check, against telemetry-mcp — every
  role here is granted to the operator, so a failure means tool access itself is broken
  rather than an authorisation decision. This is the eval that goes red the moment a
  participant sandboxes the agent in module 3, and green again when they enable MCP Gateway
  in module 4.
severity: high
maps_to_module: module-04
tags: [mcp-gateway, tool-access, telemetry]

request:
  type: prompt
  prompt: What are the current reservoir level and water quality readings?

assertion:
  - type: legitimate_success
    expect_tool: get_reservoir_level
pass_condition: all
polarity: eval_succeeded

scoring:
  weight: 2
  metric_name: eval.telemetry_lookup
