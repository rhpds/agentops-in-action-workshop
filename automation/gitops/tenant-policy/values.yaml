username: user1
namespaceSuffix: agentops

# Tenant isolation: ingress to this namespace's workloads is restricted to the
# namespace itself plus the ingress router. See templates/networkpolicy.yaml
# for why this is not covered by the sandbox policy.
#
# Egress is deliberately unrestricted and has no policy here — that is the
# sandbox's job, and an unsandboxed agent having open egress is the lab's
# starting condition.
networkPolicy:
  enabled: true

# Tool-level authorization on this participant's own MCP Gateway.
# See templates/mcp-gateway-policy.yaml.
mcpGateway:
  # true  -> every tool call needs tool:<name> in the caller's Keycloak token:
  #          the lab's starting condition
  # false -> the gateway federates tools and enforces nothing, so the agent
  #          can call emergency_shutdown
  enforced: true
  # Must match tenant-platform's mcpGateway.gatewayName.
  gatewayName: mcp-gateway
  # Require the caller to be the agent, not just to hold the tool role --
  # the intersection of personnel identity and agent identity.
  #
  # Default OFF. Turning it on without the token exchange configured
  # (tenant-platform keycloak.agentIdentity) refuses EVERY tool call: the
  # agent would still be presenting a plain operator token whose azp is the
  # shared public client. bootstrap-tenant forwards both from one place so
  # they cannot drift apart.
  agentIdentityEnforced: false
  # Whether this participant has a gateway at all (tenant-platform's
  # mcpGateway.enabled, forwarded by bootstrap-tenant). Gates the rollout Job.
  enabled: false
  # Stage 9 -- provenance. Authorino injects x-waterplant-actor on the mcps
  # listener, naming the human and the agent as an ordered chain plus the
  # token's jti as the join key. See templates/mcp-gateway-policy.yaml and
  # docs/agent-identity/06-provenance.md.
  #
  # Default OFF, and deliberately so. Turning it on is safe on its own -- the
  # header is additive and nothing breaks if no one reads it -- but nothing
  # reads it yet: plant-api's raised_by_verified, the three MCP servers'
  # client.py forwarding, and the MLflow trace tags all need image builds that
  # do not exist. Flip it on in the same change that ships those, so there is
  # one rollout and not two.
  #
  # Scope to expect, measured rather than assumed: the broker reaches MCP
  # servers DIRECTLY by Service DNS for initialize, ping, tools/list and the
  # SSE stream -- only tools/call crosses the gateway's mcps listener. So this
  # header appears on tool calls and on nothing else, and every consumer must
  # treat its absence as normal rather than as an error.
  provenance:
    enabled: false
    # Prefix on the gateway access-log line, so a participant (or a grep) can
    # pick provenance records out of ordinary Envoy traffic. See
    # templates/provenance-accesslog.yaml.
    logPrefix: WATERPLANT-ACTOR
  # PostSync Job that makes a sync take effect: it restarts the gateway's Envoy
  # and the agent. See templates/mcp-gateway-rollout.yaml.
  rollout:
    # Needs oc and curl. Already pulled for the cluster's InstallPlan approver.
    image: registry.redhat.io/openshift4/ose-cli:latest
    # Created by tenant-platform (templates/mcp-policy-rollout-rbac.yaml).
    serviceAccount: mcp-policy-rollout
    # MCP clients to restart after the gateway: a Deployment in the lab
    # namespace, or <namespace>/<name>, with {username} filled in. Any that
    # isn't deployed is skipped, so every harness and runtime can be listed.
    clientDeployments:
      - hermes-agent
      - waterplant-agent
      # Not hermes-openshell-bridge: Hermes in the OpenShell sandbox is
      # restarted by the participant after a policy change, not by this Job.
      # The unsandboxed Hermes beside it (tenant-platform agent.hermes.plain).
      - hermes-plain
    # Covers up to three gateway restarts plus the agent's rollout.
    timeoutSeconds: 1200

# The realm issuer is https://<host>/realms/waterplant-<username>. Forwarded by
# bootstrap-tenant; required when mcpGateway.enforced.
keycloak:
  host: ""
  # Only the clientId is needed here -- this chart checks the azp claim, it
  # never authenticates as the client, so no secret belongs in tenant-policy.
  agentIdentity:
    # The BROKER client -- the OpenShell gateway's. Used only as the fallback
    # azp value while federated.enabled is false and the agent still presents a
    # secret-authenticated exchanged token.
    clientId: hermes-agent
    # Once the attested path is on, the azp Authorino sees is NOT a friendly
    # name: OpenShell fixes the intermediate token's audience to the
    # supervisor's SVID subject, and Keycloak resolves the final exchange's
    # client out of that audience, so the agent client's id IS its SPIFFE ID.
    # Measured on the live realm 2026-11-26. Must match tenant-platform's
    # keycloak.agentIdentity.federated -- bootstrap-tenant forwards both.
    federated:
      enabled: true
      trustDomain: spiffe://agentops.lab
      # Empty derives <trustDomain>/ns/<user>-agentops/sa/<user>-openshell-sandbox.
      agentSpiffeId: ""
