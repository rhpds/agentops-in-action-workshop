username: user1
namespaceSuffix: agentops

# Tenant isolation: ingress to this namespace's workloads is restricted to the
# namespace itself plus the ingress router. See templates/networkpolicy.yaml
# for why this is not covered by the sandbox policy.
#
# Egress is deliberately unrestricted and has no policy here — that is the
# sandbox's job, and an unsandboxed agent having open egress is the lab's
# starting condition.
networkPolicy:
  enabled: true

# Tool-level authorization on this participant's own MCP Gateway.
# See templates/mcp-gateway-policy.yaml.
mcpGateway:
  # true  -> every tool call needs tool:<name> in the caller's Keycloak token:
  #          the lab's starting condition
  # false -> the gateway federates tools and enforces nothing, so the agent
  #          can call emergency_shutdown
  enforced: true
  # Must match tenant-platform's mcpGateway.gatewayName.
  gatewayName: mcp-gateway
  # Whether this participant has a gateway at all (tenant-platform's
  # mcpGateway.enabled, forwarded by bootstrap-tenant). Gates the rollout Job.
  enabled: false
  # PostSync Job that makes a sync take effect: it restarts the gateway's Envoy
  # and the agent. See templates/mcp-gateway-rollout.yaml.
  rollout:
    # Needs oc and curl. Already pulled for the cluster's InstallPlan approver.
    image: registry.redhat.io/openshift4/ose-cli:latest
    # Created by tenant-platform (templates/mcp-policy-rollout-rbac.yaml).
    serviceAccount: mcp-policy-rollout
    # MCP clients to restart after the gateway: a Deployment in the lab
    # namespace, or <namespace>/<name>, with {username} filled in. Any that
    # isn't deployed is skipped, so every harness and runtime can be listed.
    clientDeployments:
      - hermes-agent
      - waterplant-agent
      # Not hermes-openshell-bridge: Hermes in the OpenShell sandbox is
      # restarted by the participant after a policy change, not by this Job.
      # The unsandboxed Hermes beside it (tenant-platform agent.hermes.plain).
      - hermes-plain
    # Covers up to three gateway restarts plus the agent's rollout.
    timeoutSeconds: 1200

# The realm issuer is https://<host>/realms/waterplant-<username>. Forwarded by
# bootstrap-tenant; required when mcpGateway.enforced.
keycloak:
  host: ""
