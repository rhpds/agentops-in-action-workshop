{{- if .Values.mcpGateway.enforced }}
{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
{{- if not .Values.keycloak.host }}
{{- fail "mcpGateway.enforced needs keycloak.host (forwarded by bootstrap-tenant)" }}
{{- end }}
{{- $issuer := printf "https://%s/realms/waterplant-%s" .Values.keycloak.host .Values.username -}}
{{/*
Tool-level authorization on this participant's own MCP Gateway.

On by default: every tool call must carry the matching role from the
participant's Keycloak realm. Setting mcpGateway.enforced to false turns this
off, so the gateway federates the tools and enforces nothing and the agent can
call emergency_shutdown. `argocd app diff` on this Application shows the
change.

Two policies, one per Gateway listener, because the gateway handles a tool call
in two hops:

  mcp   the public listener the agent connects to. Authentication only: the
        caller must present a valid JWT from their realm.
  mcps  the internal listener the broker routes each tools/call through, with
        x-mcp-servername and x-mcp-toolname set. Authorization: the token must
        carry tool:<toolname> under the client whose ID matches the server
        name, which the broker sets to <namespace>/<registration>.

Both target this participant's Gateway, so editing them changes nothing for
anyone else — which a shared gateway could not offer.

Roles are granted and revoked in the participant's Keycloak realm, not here:
this policy says "a tool call needs the matching role", the realm says who has
it. Verified on cluster-tpss7: withheld role -> 403, grant -> 200, revoke -> 403.

A sync does not take effect by itself. The mcp-gateway-rollout PostSync Job
restarts the gateway and the agent so the policy takes effect reliably; see
templates/mcp-gateway-rollout.yaml for why.

One known limitation to teach around: Hermes' MCP client surfaces the 403 as a
dropped connection and a 5 s timeout, and reports "a network issue or service
outage". The denial is real; the agent's explanation of it is wrong. Authorino's
log is where the truth is.
*/}}
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-auth-policy
  namespace: {{ $ns }}
  labels:
    rhdp.redhat.com/lab: agentops-in-action
    rhdp.redhat.com/editable: "true"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.mcpGateway.gatewayName }}
    sectionName: mcp
  defaults:
    when:
      - predicate: "!request.path.contains('/.well-known')"
    rules:
      authentication:
        waterplant-{{ .Values.username }}:
          jwt:
            issuerUrl: {{ $issuer }}
      response:
        unauthenticated:
          code: 401
          body:
            value: '{"error":"Unauthorized","message":"Authentication required."}'
---
apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: mcp-authz-policy
  namespace: {{ $ns }}
  labels:
    rhdp.redhat.com/lab: agentops-in-action
    rhdp.redhat.com/editable: "true"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.mcpGateway.gatewayName }}
    sectionName: mcps
  rules:
    authentication:
      # Protocol traffic (initialize, tools/list, pings) carries no tool name
      # and needs no identity on the internal hop; the public listener already
      # authenticated the caller.
      anonymous:
        anonymous: {}
        when:
          - predicate: '!request.headers.exists(h, h == "x-mcp-toolname")'
      waterplant-{{ .Values.username }}:
        jwt:
          issuerUrl: {{ $issuer }}
        when:
          - predicate: 'request.headers.exists(h, h == "x-mcp-toolname")'
    authorization:
      tool-access-check:
        when:
          - predicate: "request.headers.exists(h, h == 'x-mcp-toolname')"
          - predicate: "request.headers['x-mcp-method'] == 'tools/call'"
        patternMatching:
          patterns:
            - predicate: |
                ('tool:' + request.headers['x-mcp-toolname']) in (has(auth.identity.resource_access) && auth.identity.resource_access.exists(p, p == request.headers['x-mcp-servername']) ? auth.identity.resource_access[request.headers['x-mcp-servername']].roles : [])
            {{- if .Values.mcpGateway.agentIdentityEnforced }}
            # The intersection: the operator must hold the tool role (above)
            # AND the caller must be the agent (here). Patterns within one
            # patternMatching block are AND-ed, so adding this narrows rather
            # than replaces.
            #
            # Without it the gateway can only ask "does the operator hold
            # tool:X?". The agent IS the operator, so there is no second
            # question to ask. With the exchange in place (see
            # tenant-platform keycloak.agentIdentity) the token names both,
            # and this is where the second half gets enforced.
            #
            # Verified on a live tenant, all four cases driven through the real
            # agent rather than synthesised requests:
            #
            #   exchanged token + operator holds the role   -> answers normally
            #   raw operator token, holds ALL 18 roles      -> refused
            #   exchanged token + role revoked in Keycloak  -> refused
            #   azp required to be a value nothing holds    -> refused
            #
            # The second line is the point: holding every permission is no
            # longer sufficient. The third is the converse -- being the agent
            # is not sufficient either, so module 3's revoke exercise still
            # behaves exactly as before.
            #
            # Note the failure surfaced cleanly as "I don't have sufficient
            # permissions" rather than the misleading "network issue or
            # service outage" this file warns about elsewhere.
{{- $fed := .Values.keycloak.agentIdentity.federated | default dict }}
{{- $ns2 := printf "%s-%s" .Values.username .Values.namespaceSuffix }}
{{- /* No fallback on purpose. The azp this matches is ALWAYS the attested
       agent's SPIFFE ID: if attestation is not working the call must be
       refused, not quietly accepted on a secret-authenticated token. Rendering
       a secret-path azp here would make a downgrade invisible. */}}
{{- if not $fed.enabled }}
{{- fail "tenant-policy: keycloak.agentIdentity.federated.enabled must be true -- the secret fallback was removed deliberately (docs/agent-identity)" }}
{{- end }}
{{- $expectedAzp := $fed.agentSpiffeId | default (printf "%s/ns/%s/sa/%s-openshell-sandbox" $fed.trustDomain $ns2 .Values.username) }}
            # With federated.enabled this is the sandbox's SPIFFE ID, not a
            # friendly name -- the agent client's id IS that SPIFFE ID, because
            # OpenShell fixes the intermediate token's audience to the
            # supervisor's SVID subject and Keycloak resolves the final
            # exchange's client from it. Hence templated, not a literal.
            - predicate: "has(auth.identity.azp) && auth.identity.azp == '{{ $expectedAzp }}'"
            {{- end }}
    response:
{{- if .Values.mcpGateway.provenance.enabled }}
      # Stage 9 -- provenance. The actor is created HERE and nowhere else:
      # this is the last hop before the MCP server and the only point that has
      # verified both principals. Everything downstream copies it; nothing
      # downstream recomputes it.
      #
      # Emitted as an ordered CHAIN, not as two scalar fields, even though it
      # only ever holds two entries today. When RHBK >= 26.8 makes a real
      # RFC 8693 `act` claim available, ONLY this expression changes -- it
      # walks `act` instead of reading sub and azp, and every consumer is
      # untouched. Modelling it as subject=...;agent=... would turn that into
      # a schema migration across plant-api, the trace tags and the QA
      # assertions. See docs/agent-identity/04-keycloak-upgrade-path.md.
      #
      # Verified it actually arrives: the data plane here is the Kuadrant
      # wasm-shim (EnvoyFilter/kuadrant-mcp-gateway loads kuadrant-wasm-shim),
      # NOT native Envoy ext_authz, so this was not a given. In shim 0.14.2 --
      # the version this cluster serves -- the legacy actionSet translation
      # maps ok_response.headers, which is what Authorino populates from
      # response.success.headers, to Operation::Headers(target: Request).
      # So it lands on the request forwarded upstream.
      #
      # The sharp edge, worth knowing before adding anything here: the same
      # translation turns response_headers_to_add, headers_to_remove and the
      # query_parameters_* fields into a TERMINAL FAILURE with the log line
      # "Unsupported field in OkHttpResponse". The shim does not ignore what
      # it cannot do -- it fails the request closed. Authorino does not expose
      # those fields for success responses, so this block is safe, but do not
      # assume an unsupported extra would be silently dropped.
      success:
        headers:
          x-waterplant-actor:
            plain:
              # has() guards are mandatory, not defensive style. The anonymous
              # authentication rule above leaves auth.identity empty, and an
              # unguarded field access is a CEL ERROR -- which fails the
              # request -- not an empty string.
              #
              # preferred_username before sub: a UUID in an audit row tells a
              # participant nothing, and reading the actor is the whole point.
              expression: >
                '{"chain":[{"role":"subject","sub":"' +
                (has(auth.identity.preferred_username) ? auth.identity.preferred_username :
                  (has(auth.identity.sub) ? auth.identity.sub : 'anonymous')) +
                '"},{"role":"agent","sub":"' +
                (has(auth.identity.azp) ? auth.identity.azp : 'none') +
                '"}],"jti":"' +
                (has(auth.identity.jti) ? auth.identity.jti : '') + '"}'
{{- end }}
      unauthorized:
        # Served as JSON so the agent's MCP client will read the body. It
        # parses a non-2xx body only when the content type says JSON, and
        # Authorino's default here is text/plain -- which would leave the
        # client with a generic "server returned an error response" and lose
        # the sentence below, the one that actually tells a participant what
        # happened. Status stays 403; that part was always right.
        headers:
          content-type:
            value: application/json
        body:
          value: '{"jsonrpc":"2.0","error":{"code":-32600,"message":"Forbidden: Insufficient permissions for this tool."}}'
{{- end }}
