{{- if .Values.networkPolicy.enabled }}
{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
{{/*
Tenant isolation for a participant namespace.

One policy, and the name undersells it: a pod that no NetworkPolicy selects
accepts traffic from anywhere on the cluster, so by existing this switches
these workloads to default-deny ingress and then re-allows exactly two
sources — pods in the same namespace, and the ingress router.

Without it, measured on cluster-pz7xk: a pod in user-7ql4q-agentops reached
user-jfhwq-agentops' plant-api and console on HTTP 200. plant-api has control
endpoints, so one participant could stop another's pumps — straight past the
gateway, Keycloak, the AuthPolicies and the sandbox, none of which can see
traffic arriving from another namespace.

That is why this is not redundant with the sandbox policy, which governs what
the sandboxed agent may reach *outbound*. Different direction, different
layer; note that this policy deliberately excludes the sandbox pods.

There was an egress-baseline policy here too. At its default it rendered
`egress: [{}]` — allow everything — so it restricted nothing and existed only
to be flipped in an exercise. Egress is the sandbox policy's job.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-within-namespace
  namespace: {{ $ns }}
  labels:
    rhdp.redhat.com/lab: agentops-in-action
    rhdp.redhat.com/editable: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: NotIn
        values: [openshell, hermes-openshell-bridge]
      - key: agents.x-k8s.io/sandbox-name-hash
        operator: DoesNotExist
  policyTypes: [Ingress]
  ingress:
    # The workloads talk to each other: UI -> agent -> MCP servers -> plant-api.
    - from:
        - podSelector: {}
    # The router needs to reach the UI, or the console is unreachable.
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
{{- end }}
