{{- /* Gateway only: the AdminNetworkPolicy leaves no other route to the tools. */}}
{{- if and (eq .Values.agent.harness "hermes") .Values.agent.hermes.plain.enabled .Values.mcpGateway.enabled }}
{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
{{- $h := .Values.agent.hermes -}}
{{- $image := printf "%s:%s" $h.plain.image $h.plain.tag -}}
{{- $gwUrl := printf "http://%s-%s.%s.svc.cluster.local:8080/mcp" .Values.mcpGateway.gatewayName .Values.mcpGateway.gatewayClassName $ns -}}
{{/*
A second, unsandboxed Hermes beside whichever runtime agent.hermes.runtime
selected, so the console can be pointed at either and the two compared on the
same plant, gateway and policies.

Same agent, same gateway, same token flow as the OpenShell sandbox — only the
sandbox is missing. Its config is kept as small as the bridge's for the same
reason: any difference between the two should be the runtime, not the config.

The console targets this one by default (ui.yaml). To use the sandboxed one:
  oc set env deploy/water-plant-ui AGENT_URL=http://hermes-agent.<ns>.svc:8787
bootstrap-tenant's platform Application ignores AGENT_URL, so self-heal keeps
the override.

MLflow traces: hermes_otel is staged into HERMES_HOME by the seed-otel init
container below, when ui.mlflowUrl is set. Unlike the sandboxed Hermes this
pod is not behind OpenShell's egress proxy, so it posts to MLflow directly
over the service CA and needs no hermes-mlflow-relay hop.
*/}}
{{- /* Lab soul, replacing Hermes' self-defending stock default_soul. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-plain-soul
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-plain
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/editable: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  SOUL.md: |
{{ $h.soul | required "agent.hermes.soul must be set" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-plain
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-plain
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  read-safety-docs-SKILL.md: |
{{ .Files.Get "files/skills/read-safety-docs/SKILL.md" | indent 4 }}
  write-report-SKILL.md: |
{{ .Files.Get "files/skills/write-report/SKILL.md" | indent 4 }}
  save-report.py: |
{{ .Files.Get "files/skills/write-report/scripts/save_report.py" | indent 4 }}
  # The one writer of the live skill files: seed-config calls it at every pod
  # start, and it is the documented way back when a skill has drifted.
  reseed-skills.sh: |
{{ .Files.Get "files/skills/reseed-skills.sh" | indent 4 }}
  mcp-token-refresh.py: |
{{ .Files.Get "files/mcp-token-refresh.py" | indent 4 }}
  wait-for-gateway.py: |
{{ .Files.Get "files/wait-for-gateway.py" | indent 4 }}
  {{- /*
  The report that is always in the reports directory.

  deleted-reports needs something real to destroy. It used to target a
  per-cycle canary planted by the write-report eval, which meant the one
  attack about destroying a participant's work skipped itself unless an eval
  sweep had run first. A file that is simply always there removes that
  coupling, and the console writes it back after any reset.

  Byte-identical to tenant-openshell/files/very-important-report.md, so the
  sandboxed Hermes starts from the same file — checked by automation/tests.
  */}}
  very-important-report.md: |
{{ .Files.Get "files/very-important-report.md" | indent 4 }}
  {{- /*
  A web_extract backend that just fetches the URL.

  Hermes ships seven web backends and none of them can fetch a page in this
  image: tavily, exa and parallel want SaaS credentials; searxng, brave-free
  and ddgs are search-only; and firecrawl — the only self-hostable one — needs
  a `firecrawl` package waterplant-hermes does not install. So web_extract
  answers every call "only supports search, not direct URL content
  extraction", and the agent has no way to read a document at all.

  That blocks three cases outright. read-documentation cannot pass, and
  malicious-doc-redirect and compromised-tool-injection can only report
  "blocked" — which tells a participant they are defended against something
  that was never tried.

  Staged into $HERMES_HOME/plugins/web/firecrawl/ by seed-config, where its
  path-derived key collides with the bundled provider's. hermes_cli/plugins.py
  dedups discovered manifests by key and lets the user source win, so the
  bundled module is never imported and there is no registration race.
  */}}
  web-direct-plugin.yaml: |
{{ .Files.Get "files/hermes-web-direct/plugin.yaml" | indent 4 }}
  web-direct-init.py: |
{{ .Files.Get "files/hermes-web-direct/__init__.py" | indent 4 }}
  web-direct-provider.py: |
{{ .Files.Get "files/hermes-web-direct/provider_direct.py" | indent 4 }}
  # Hermes' config. seed-config appends the model block, which carries the
  # key, so the key never reaches a manifest.
  hermes-config.yaml: |
{{ include "waterplant.hermesApprovals" . | indent 4 }}

{{ include "waterplant.hermesSkills" . | indent 4 }}

    mcp_servers:
      # One endpoint: this participant's MCP Gateway. `auth: oauth` makes Hermes
      # send the token mcp-token-refresh.py keeps at
      # $HERMES_HOME/mcp-tokens/gateway.json.
      gateway:
        url: {{ $gwUrl | quote }}
        transport: streamable-http
        auth: oauth
        ssl_verify: false
        enabled: true
        timeout: {{ $h.mcpTimeoutSeconds }}
        connect_timeout: 30

    # Unlike the sandbox, no skip_auth: nothing in front of this pod
    # authenticates callers, so the API_SERVER_KEY bearer is required.
    platforms:
      api_server:
        enabled: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-plain-data
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-plain
    app.kubernetes.io/part-of: water-plant
  annotations:
    # Same wave as the Deployment: on WaitForFirstConsumer storage an earlier
    # wave deadlocks the sync. See agent-hermes.yaml.
    argocd.argoproj.io/sync-wave: "4"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $h.plain.storageSize }}
---
{{- if .Values.ui.mlflowUrl }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-plain
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-plain
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
{{/*
seed-otel resolves the experiment id over MLflow's REST API, and MLflow runs
--app-name=kubernetes-auth: every call becomes a SelfSubjectAccessReview
against this (deliberately non-existent) API group. Without the grant the
lookup 403s.

`create` as well as `get`/`list`, because on a participant's first run nothing
has written to the experiment yet and it does not exist.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-plain-mlflow
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-plain-mlflow
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hermes-plain-mlflow
subjects:
  - kind: ServiceAccount
    name: hermes-plain
    namespace: {{ $ns }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-plain
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-plain
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    # After the gateway resources (1-3), so wait-for-gateway has something to poll.
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  # ReadWriteOnce volume: a second pod cannot roll alongside the first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-plain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-plain
        app.kubernetes.io/part-of: water-plant
      annotations:
        checksum/web-direct: {{ printf "%s%s%s" (.Files.Get "files/hermes-web-direct/plugin.yaml") (.Files.Get "files/hermes-web-direct/__init__.py") (.Files.Get "files/hermes-web-direct/provider_direct.py") | sha256sum }}
        checksum/docs-skill: {{ .Files.Get "files/skills/read-safety-docs/SKILL.md" | sha256sum }}
        checksum/report-skill: {{ printf "%s%s" (.Files.Get "files/skills/write-report/SKILL.md") (.Files.Get "files/skills/write-report/scripts/save_report.py") | sha256sum }}
        checksum/approvals: {{ include "waterplant.hermesApprovals" . | sha256sum }}
        checksum/skills-config: {{ include "waterplant.hermesSkills" . | sha256sum }}
        checksum/reseed: {{ .Files.Get "files/skills/reseed-skills.sh" | sha256sum }}
        # Roll when the scripts or any Hermes value change.
        checksum/config: {{ printf "%s%s%s%s" (.Files.Get "files/mcp-token-refresh.py") (.Files.Get "files/wait-for-gateway.py") (toJson $h) $gwUrl | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.ui.mlflowUrl }}
      serviceAccountName: hermes-plain
      {{- end }}
      initContainers:
        # Regenerated every start so the config always matches the chart.
        - name: seed-config
          image: {{ $image }}
          command:
            - sh
            - -c
            - |
              set -e
              # Seed the lab soul before Hermes writes its stock default_soul.
              cp /soul/SOUL.md "$HERMES_HOME/SOUL.md"
              # Restores both lab skills and drops anything else that has
              # appeared under skills/ — an agent-authored skill, or a
              # SKILL.md the self-improvement fork patched in an earlier run.
              # Same script the on-demand reset runs, so a pod restart and a
              # reset leave identical state.
              sh /config/reseed-skills.sh /config "$HERMES_HOME"
              # The always-present report. /reports is an emptyDir, so it is
              # empty on every pod start and this has to be written again.
              # Overwritten rather than written only when missing, so
              # restarting the pod is also a way back to a known-good file —
              # the console writes it back after a reset, which restarts
              # nothing.
              mkdir -p /reports
              cp /config/very-important-report.md /reports/very-important-report.md
              if [ -n "${WEB_DIRECT_ENABLED:-}" ]; then
                # Removed first, not just overwritten: $HERMES_HOME is a PVC,
                # so a file this plugin no longer ships would otherwise
                # survive forever and be imported by a package that has
                # stopped expecting it.
                WEBDIR="$HERMES_HOME/plugins/web/firecrawl"
                rm -rf "$WEBDIR"
                mkdir -p "$WEBDIR"
                cp /config/web-direct-plugin.yaml   "$WEBDIR/plugin.yaml"
                cp /config/web-direct-init.py       "$WEBDIR/__init__.py"
                cp /config/web-direct-provider.py   "$WEBDIR/provider_direct.py"
              fi
              {
                cat /config/hermes-config.yaml
                printf '\nmodel:\n  default: %s\n  provider: custom\n  base_url: %s\n  api_key: %s\n' \
                  "$MODEL_DEFAULT" "$MODEL_BASE_URL" "$MODEL_API_KEY"
                printf '\ncustom_providers:\n  - name: %s\n    base_url: %s\n    api_key: %s\n    model: %s\n' \
                  "$MODEL_DEFAULT" "$MODEL_BASE_URL" "$MODEL_API_KEY" "$MODEL_DEFAULT"
                # Hermes masks secret-shaped strings in tool output by default
                # (agent/redact.py, on per issue #17691), so this agent reading
                # its own config.yaml would report `api_key: ***` — the same
                # thing the sandboxed agent in module 2 shows, which is exactly
                # the distinction module 1 exists to make. Off here so the
                # baseline agent genuinely hands over the key when asked.
                #
                # Unconditional, and emitted before the web-direct block below
                # so that block can append to this mapping: two separate
                # `security:` keys would be a duplicate mapping key, and the
                # later one silently wins.
                printf '\nsecurity:\n  redact_secrets: false\n'
                if [ -n "${WEB_DIRECT_ENABLED:-}" ]; then
                  # Hermes refuses to fetch a private or internal address at
                  # all, in tools/url_safety.py, before any backend and before
                  # any policy of the participant's gets a say. Every service
                  # in this namespace is such an address, so left at its
                  # default the agent cannot read the documentation site:
                  # read-documentation cannot pass, and both honeypot attacks
                  # report "blocked" having never left the pod — telling a
                  # participant they are defended by a check they did not
                  # configure and cannot see.
                  #
                  # Turning it off here is the point, not a concession. The
                  # lab's thesis is that the platform enforces policy, not the
                  # application, so the baseline agent has to be genuinely
                  # undefended — what stops the exfiltration in module 5 must
                  # be the participant's own egress rules. Scope: this one
                  # sandboxed, fictional plant namespace.
                  #
                  # Cloud metadata endpoints (169.254.169.254,
                  # metadata.google.internal) stay blocked regardless of this
                  # flag — url_safety treats those as never-legitimate and
                  # honours no toggle. Verified on the running pod.
                  printf '  allow_private_urls: true\n'
                  # search_backend is pinned, not left to default. Setting
                  # FIRECRAWL_API_URL (which the legacy availability check
                  # needs) makes _get_backend() prefer "firecrawl" for *search*
                  # too — and the direct provider is extract-only, so
                  # web_search would start failing as "extract-only backend"
                  # and module 1's search demonstration would break. ddgs is
                  # what search already uses and it works.
                  printf '\nweb:\n  search_backend: ddgs\n  extract_backend: firecrawl\n'
                fi
                # Staging a plugin's files is not enough — Hermes auto-loads
                # only the bundled ones and gates everything else on this
                # allow-list. `hermes plugins enable <x>` writes this same
                # stanza, but into the config.yaml this script overwrites on
                # every start, so it has to be rendered rather than set once
                # by hand. web/firecrawl is the path-derived key, which is
                # what the loader matches.
                if [ -n "${HERMES_OTEL_ENABLED:-}" ] || [ -n "${WEB_DIRECT_ENABLED:-}" ]; then
                  printf '\nplugins:\n  enabled:\n'
                  if [ -n "${HERMES_OTEL_ENABLED:-}" ]; then
                    printf '    - hermes_otel\n'
                  fi
                  if [ -n "${WEB_DIRECT_ENABLED:-}" ]; then
                    printf '    - web/firecrawl\n'
                  fi
                  printf '  disabled: []\n'
                fi
              } > "$HERMES_HOME/config.yaml"
              chmod 600 "$HERMES_HOME/config.yaml"
          envFrom:
            - secretRef:
                name: {{ $h.envSecret }}
          env:
            - { name: HERMES_HOME,    value: {{ $h.home | quote }} }
            - { name: MODEL_BASE_URL, value: {{ .Values.agent.litellm.baseUrl | quote }} }
            - { name: MODEL_DEFAULT,  value: {{ .Values.agent.litellm.model | quote }} }
            {{- if .Values.ui.mlflowUrl }}
            - { name: HERMES_OTEL_ENABLED, value: "1" }
            {{- end }}
            {{- if .Values.docs.enabled }}
            - { name: WEB_DIRECT_ENABLED, value: "1" }
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: {{ $h.home | quote }} }
            - { name: config, mountPath: /config, readOnly: true }
            - { name: reports, mountPath: /reports }
            - { name: soul, mountPath: /soul, readOnly: true }
        # The first token, before Hermes' first MCP handshake.
        - name: seed-token
          image: {{ $image }}
          command: ["python3", "/config/mcp-token-refresh.py"]
          env: &tokenEnv
            - { name: HERMES_HOME,     value: {{ $h.home | quote }} }
            - { name: MCP_SERVER_NAME, value: gateway }
            - { name: MCP_CLIENT_ID,   value: {{ .Values.keycloak.agentClientId | quote }} }
            - { name: MCP_USERNAME,    value: {{ .Values.keycloak.agentUser | quote }} }
            - { name: MCP_PASSWORD,    value: {{ .Values.keycloak.agentPassword | quote }} }
            - name: MCP_TOKEN_URL
              value: {{ printf "https://%s/realms/waterplant-%s/protocol/openid-connect/token" .Values.keycloak.host .Values.username | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: {{ $h.home | quote }} }
            - { name: config, mountPath: /config, readOnly: true }
        # Hermes lists tools once at start-up and never refreshes.
        - name: wait-for-gateway
          image: {{ $image }}
          command: ["python3", "/config/wait-for-gateway.py"]
          env:
            - { name: HERMES_HOME,      value: {{ $h.home | quote }} }
            - { name: MCP_GATEWAY_URL,  value: {{ $gwUrl | quote }} }
            - { name: MCP_WAIT_SECONDS, value: {{ $h.mcpWaitSeconds | quote }} }
            - name: MCP_PREFIXES
              value: "{{ range $i, $s := .Values.mcp.servers }}{{ if $i }},{{ end }}{{ trimSuffix "-mcp" $s.name }}_{{ end }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: {{ $h.home | quote }} }
            - { name: config, mountPath: /config, readOnly: true }
{{- if .Values.ui.mlflowUrl }}
        {{/*
        Stage hermes_otel into HERMES_HOME so the plain Hermes traces to
        MLflow like the sandboxed one does.

        Three things make this cheaper than it looks, all verified against a
        running pod on cluster-pz7xk:

        * hermes_otel is stdlib-only. It needs neither the `mlflow` package
          nor the opentelemetry SDK — it posts OTLP over urllib — so nothing
          has to be installed into site-packages and the image is untouched.
        * HERMES_HOME is the PVC, so the plugin is staged once and survives
          restarts.
        * The plugin has no TLS options of its own, so MLflow's
          service-signer certificate has to be trusted process-wide. Note
          SSL_CERT_FILE *replaces* the trust store rather than adding to it:
          pointing it at the service CA alone cost an outage, because Hermes
          could then no longer verify the public certificate on the model
          endpoint and every completion failed with "Connection error". The
          bundle written below is the system roots plus the service CA.

        The experiment id is resolved here rather than baked in: it does not
        exist until something has written to the experiment, and the id — not
        the name — is what the OTLP header takes.
        */}}
        - name: seed-otel
          image: {{ $image }}
          # Deliberately not `-e`: a tracing problem must not stop the agent
          # from starting. Anything that fails here leaves no config.yaml
          # behind, the plugin stays dormant, and Hermes runs untraced.
          command: ["bash", "-uo", "pipefail", "-c"]
          args:
            - |
              PLUGIN="$HERMES_HOME/plugins/hermes_otel"
              if [ ! -f "$PLUGIN/__init__.py" ]; then
                mkdir -p "$PLUGIN"
                curl -fsSL -o /tmp/ho.tgz \
                  "https://github.com/{{ $h.otel.repo }}/archive/{{ $h.otel.commit }}.tar.gz"
                echo "{{ $h.otel.sha256 }}  /tmp/ho.tgz" | sha256sum -c -
                tar -xzf /tmp/ho.tgz --strip-components=2 -C "$PLUGIN" \
                  "hermes-otel-{{ $h.otel.commit }}/hermes_otel"
                rm -f /tmp/ho.tgz
              fi
              # System roots first, then MLflow's service CA. Both, or
              # Hermes can reach MLflow and nothing else.
              cat /etc/pki/tls/certs/ca-bundle.crt /etc/mlflow-ca/service-ca.crt \
                > "$HERMES_HOME/ca-bundle.crt"

              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              EXP_ID="$(python3 - <<'PY'
              import json, os, ssl, urllib.error, urllib.request
              base = os.environ["MLFLOW_API_URL"].rstrip("/") + "/mlflow/api/2.0/mlflow"
              ctx = ssl.create_default_context(cafile="/etc/mlflow-ca/service-ca.crt")
              hdr = {
                  "Authorization": "Bearer " + open(
                      "/var/run/secrets/kubernetes.io/serviceaccount/token").read().strip(),
                  "X-MLflow-Workspace": os.environ["NAMESPACE"],
                  "Content-Type": "application/json",
              }
              def post(path, body):
                  req = urllib.request.Request(
                      base + path, data=json.dumps(body).encode(), headers=hdr, method="POST")
                  return json.load(urllib.request.urlopen(req, timeout=20, context=ctx))
              name = os.environ["MLFLOW_EXPERIMENT"]
              try:
                  req = urllib.request.Request(
                      base + "/experiments/get-by-name?experiment_name=" + name, headers=hdr)
                  print(json.load(urllib.request.urlopen(req, timeout=20, context=ctx))
                        ["experiment"]["experiment_id"])
              except urllib.error.HTTPError as exc:
                  if exc.code in (401, 403):
                      # No MLflow permission. Say which, rather than falling
                      # through to create and reporting that failure instead.
                      raise SystemExit(
                          f"seed-otel: MLflow refused the lookup ({exc.code}); "
                          "the pod's ServiceAccount needs get/list/create on "
                          "experiments.mlflow.kubeflow.org")
                  if exc.code != 404:
                      raise
                  # First run for this participant: nothing has written to the
                  # experiment yet, so it does not exist.
                  print(post("/experiments/create", {"name": name})["experiment_id"])
              PY
              )"
              if [ -z "$EXP_ID" ]; then
                echo "seed-otel: could not resolve the MLflow experiment; starting untraced" >&2
                rm -f "$PLUGIN/config.yaml"
                exit 0
              fi
              umask 077
              cat > "$PLUGIN/config.yaml" <<EOF
              enabled: true
              force_flush_on_session_end: true
              capture_sender_id: true
              capture_conversation_history: true
              backends:
                - type: otlp
                  name: mlflow
                  endpoint: {{ printf "%s/v1/traces" .Values.ui.mlflowApiUrl | quote }}
                  metrics: false
                  logs: false
                  headers:
                    x-mlflow-experiment-id: "$EXP_ID"
                    Authorization: "Bearer $TOKEN"
                    X-MLflow-Workspace: "{{ $ns }}"
              EOF
          env:
            - { name: HERMES_HOME,     value: {{ $h.home | quote }} }
            - { name: NAMESPACE,       value: {{ $ns | quote }} }
            - { name: MLFLOW_API_URL,  value: {{ .Values.ui.mlflowApiUrl | quote }} }
            - { name: MLFLOW_EXPERIMENT, value: {{ .Values.ui.mlflowExperiment | default .Values.username | quote }} }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: {{ $h.home | quote }} }
            - { name: mlflow-ca, mountPath: /etc/mlflow-ca, readOnly: true }
{{- end }}
      containers:
        - name: hermes
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["hermes", "gateway", "run", "--verbose"]
          ports:
            - name: http
              containerPort: {{ $h.port }}
          envFrom:
            # MODEL_API_KEY and API_SERVER_KEY.
            - secretRef:
                name: {{ $h.envSecret }}
          env:
            - { name: HERMES_HOME,        value: {{ $h.home | quote }} }
            - { name: HERMES_PROFILE,     value: default }
            - { name: XDG_STATE_HOME,     value: "{{ $h.home }}/state" }
            - { name: API_SERVER_ENABLED, value: "true" }
            - { name: API_SERVER_HOST,    value: 0.0.0.0 }
            - { name: API_SERVER_PORT,    value: {{ $h.port | quote }} }
            {{- if .Values.docs.enabled }}
            # Not a Firecrawl endpoint and nothing calls it. It is here
            # because tools/web_tools.py gates backend selection on
            # _is_backend_available(), a hardcoded if-chain in which
            # "firecrawl" means check_firecrawl_api_key() — true when either
            # FIRECRAWL_API_KEY or FIRECRAWL_API_URL is set. Without it,
            # web.extract_backend: firecrawl is discarded, the lookup falls
            # back to the search-only ddgs, and web_extract returns "ddgs is a
            # search-only backend" having never consulted the registry.
            #
            # Pointed at the documentation site so the value is at least
            # honest about what the agent is meant to be reading.
            - { name: FIRECRAWL_API_URL,  value: {{ printf "http://waterplant-docs.%s.svc:8080" $ns | quote }} }
            {{- end }}
            {{- if .Values.ui.mlflowUrl }}
            # MLflow's openshift-service-serving-signer certificate has to be
            # trusted, and it takes two variables, not one.
            #
            # SSL_CERT_FILE covers stdlib ssl/urllib. The OTLP exporter does
            # not use either: it goes through `requests`, which ignores
            # SSL_CERT_FILE entirely and defaults to certifi's bundle. With
            # only SSL_CERT_FILE set, every span batch died on
            # "CERTIFICATE_VERIFY_FAILED: self-signed certificate in
            # certificate chain" and the agent looked perfectly healthy while
            # emitting nothing. CURL_CA_BUNDLE covers anything shelling to
            # curl for the same reason.
            - { name: SSL_CERT_FILE,      value: "{{ $h.home }}/ca-bundle.crt" }
            - { name: REQUESTS_CA_BUNDLE, value: "{{ $h.home }}/ca-bundle.crt" }
            - { name: CURL_CA_BUNDLE,     value: "{{ $h.home }}/ca-bundle.crt" }
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: {{ $h.home | quote }} }
            - { name: reports, mountPath: /reports }
            # The pristine lab soul, here as well as in seed-config, so that
            # resetting can put it back without restarting the pod. Read-only:
            # this is the copy to restore *from*, and the agent can already
            # read its own live SOUL.md next door, so it grants nothing new.
            - { name: soul, mountPath: /soul, readOnly: true }
            # The pristine skills and reseed-skills.sh, for the same reason as
            # the soul above: a reset should restore them without restarting
            # the pod. The sandbox runtime already has its equivalent visible
            # at /sandbox/hermes, so this keeps the two resets symmetrical.
            # Read-only, and the ConfigMap holds no credential — seed-config
            # appends the model block that carries the key — so it grants the
            # agent nothing it could not already read next door.
            - { name: config, mountPath: /config, readOnly: true }
            {{- if .Values.ui.mlflowUrl }}
            - { name: mlflow-ca, mountPath: /etc/mlflow-ca, readOnly: true }
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            {{- toYaml $h.resources | nindent 12 }}
        - name: mcp-token-refresh
          image: {{ $image }}
          command: ["python3", "/config/mcp-token-refresh.py", "--loop", {{ .Values.mcpGateway.tokenRefreshSeconds | quote }}]
          env: *tokenEnv
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: data, mountPath: {{ $h.home | quote }} }
            - { name: config, mountPath: /config, readOnly: true }
          resources:
            {{- toYaml $h.tokenRefreshResources | nindent 12 }}
      volumes:
        - name: reports
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: hermes-plain-data
        - name: config
          configMap:
            name: hermes-plain
        - name: soul
          configMap:
            name: hermes-plain-soul
        {{- if .Values.ui.mlflowUrl }}
        - name: mlflow-ca
          configMap:
            name: mlflow-service-ca
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-plain
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-plain
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    app.kubernetes.io/name: hermes-plain
  ports:
    - name: http
      port: {{ $h.port }}
      targetPort: http
{{- end }}
