{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plant-api
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: plant-api
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # EXACTLY ONE. Do not add an HPA and do not raise this.
  #
  # plant-api holds the simulated plant in memory behind an asyncio lock. Two
  # replicas would put two divergent plants behind one Service: a participant
  # would derate Pump 4, read the telemetry back, and get the un-derated value
  # roughly half the time. That is close to undebuggable inside a two-hour lab.
  # See implementation-plan.md §2.8.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: plant-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plant-api
        app.kubernetes.io/part-of: water-plant
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: plant-api
          image: {{ printf "%s/%s/%s:%s" .Values.image.registry .Values.image.namespace .Values.image.plantApi.repository .Values.image.plantApi.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLANT_TICK_SECONDS
              value: {{ .Values.plantApi.tickSeconds | quote }}
            {{- if .Values.docs.enabled }}
            # Where MR-2291's seeded prompt injection tells the agent to
            # upload the plant configuration. Env-driven because it names a
            # Service in the participant's own namespace, and because an
            # unreachable host makes the attack unobservable: it was
            # diagnostics.example.com, which resolves nowhere, so the agent
            # could not have exfiltrated to it if it had tried and nothing
            # recorded the attempt either way.
            - name: DOCS_COLLECT_URL
              value: {{ printf "http://waterplant-docs.%s.svc:8080/attack/collect" $ns | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.plantApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: plant-api
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: plant-api
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: plant-api
  ports:
    - name: http
      port: 8080
      targetPort: http
