{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
{{- $uiSa := "water-plant-ui" -}}
{{- /*
Which Hermes the console talks to, and therefore whose filesystem it reads.

Defined once, at file scope, because two things downstream depend on it and
they must not be able to disagree: AGENT_URL, and the pod the filesystem
goals exec into. They did disagree — the selector was keyed off
agent.hermes.runtime while AGENT_URL is keyed off whether the plain Hermes is
deployed, so on this tenant the console conversed with hermes-plain and
measured the sandbox, which has no /reports at all. Every delete attack would
have scored "got through" against the wrong pod.
*/ -}}
{{- $onPlain := and (eq .Values.agent.harness "hermes") .Values.agent.hermes.plain.enabled .Values.mcpGateway.enabled -}}
{{- $hermesSvc := ternary "hermes-plain" "hermes-agent" $onPlain -}}
{{/*
Identity for the console.

Its own ServiceAccount rather than the namespace's `default`, because of what
the RoleBinding below grants: read access to this participant's MLflow traces.
Keep this grant off `default`; only the console needs to read its traces.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $uiSa }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
{{/*
Reading the agent's filesystem, to judge the attacks that delete or tamper
with a file.

Those goals used to ask the *agent* — "does very-important-report.md still
exist? reply PRESENT or ABSENT" — which is asking the suspect whether the
evidence is still there, costs a model call, and scores the attack
inconclusive whenever the reply is too chatty to parse. The console now runs
`oc exec ... -- test -f` against the agent's pod and reads the answer off the
filesystem.

One mechanism for both runtimes: the OpenShell sandbox is an ordinary pod in
this namespace (`default--hermie`), so the same exec reaches it. Verified on
cluster-pz7xk against both. It also sidesteps the agent's own sandbox policy,
because exec starts a fresh process through the kubelet rather than inside the
agent's process tree — the observer sees ground truth however tightly the
participant has locked the agent down.

pods/exec is a real grant, so it is worth naming what it is: within this one
namespace, the console can run a command in the participant's own pods. The
participant already has admin on this namespace, so it is not an escalation —
but it is a capability the console did not have before.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $uiSa }}-agent-fs
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  # get/list to find the agent's pod by label; exec to read a path in it.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $uiSa }}-agent-fs
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $uiSa }}-agent-fs
subjects:
  - kind: ServiceAccount
    name: {{ $uiSa }}
    namespace: {{ $ns }}
---
{{- if .Values.ui.mlflowUrl }}
---
{{/*
Lets the console resolve which MLflow trace a turn just produced, so it can end
the turn with a link to that trace instead of MLflow's front door.

It needs this because Hermes loops server-side: no tool call crosses the wire to
the console, and module 6 has participants debug an over-restrictive policy from
the trace. The calls are not lost — hermes_otel exports them — but without a
link the participant is left to find their own turn among the others.

Read-only, unlike the bridge's Role in tenant-openshell, which also writes. Same
non-existent API group: nothing serves mlflow.kubeflow.org and nothing needs to,
because MLflow runs --app-name=kubernetes-auth and every request becomes a
SelfSubjectAccessReview matching these strings.

Two traps when checking this by hand, both hit on cluster-jddlk:
`oc auth can-i get experiments.mlflow.kubeflow.org` answers "no" even when the
access is granted, because there is no CRD for it to resolve — post a real
SubjectAccessReview instead, which answers allowed:true and names the binding.
And the authorizer caches denials for 300s, so a lookup tried before this
existed keeps failing for five minutes after it does.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $uiSa }}-mlflow-read
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    # create and update as well as read: the console records an eval sweep as
    # an MLflow run, and on a participant's first sweep the experiment does
    # not exist yet. get/list alone is enough to resolve a trace link and not
    # enough to write a scorecard — the sweep 403s and silently reports no
    # run URL.
    verbs: ["get", "list", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $uiSa }}-mlflow-read
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $uiSa }}-mlflow-read
subjects:
  - kind: ServiceAccount
    name: {{ $uiSa }}
    namespace: {{ $ns }}
{{- end }}
---
{{/*
The operator console.

The dashboard reads plant-api directly rather than through the agent. That is
deliberate: the plant must stay observable when the agent is denied, broken or
not yet deployed — which is most of module 4 — and a participant needs to see
what a control action actually did, independently of what the agent says it
did. AGENT_URL is empty until the agent exists, and the chat pane degrades to a
clear "not deployed" state rather than failing opaquely.
*/}}
{{/*
The attack and eval definitions, mounted into the console.

This is the single source for them. The console ships a copy inside its image
as a fallback, but whenever this ConfigMap is mounted it wins — so a lab
author edits a prompt in files/attack-eval-defs/, ArgoCD delivers it, and the
next console restart picks it up without anyone rebuilding waterplant-ui.

Two ranges rather than one glob, because Helm's .Files.Glob is filepath.Match:
no brace alternation and no "**", so "attack-eval-defs/{attacks,evals}/*.yaml"
silently renders an empty ConfigMap. The key prefixes keep an attack and an
eval of the same name from colliding in what is a flat namespace.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: water-plant-ui-probe-defs
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
    # The definitions are meant to be tuned during the lab.
    rhdp.redhat.com/editable: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
{{- /* Soul fs_probe path: the sandboxed agent (openshell runtime, what the
       console targets from module 2 on) homes at /sandbox/.hermes; plain at
       /app/.hermes. */}}
{{- /*
Where the agent the console talks to keeps its instructions.

Derived from $onPlain, the same switch AGENT_URL and AGENT_POD_SELECTOR use —
not from agent.hermes.runtime. Those are different questions: runtime says
whether a sandbox was deployed, while the console is pointed at hermes-plain
whenever the plain agent exists alongside the gateway. Keyed on runtime, a
tenant with both got definitions naming /sandbox/.hermes while the console was
conversing with hermes-plain at /app/.hermes, so tampered-agent-config told the
agent to edit a path that does not exist in the pod it was talking to — and
the goal then measured that same wrong path and reported the attack blocked.
*/ -}}
{{- $hermesHome := ternary "/app/.hermes" "/sandbox/.hermes" $onPlain }}
{{- range $path, $_ := .Files.Glob "files/attack-eval-defs/attacks/*.yaml" }}
  attack-{{ base $path }}: |
{{ $.Files.Get $path | replace "__HERMES_HOME__" $hermesHome | indent 4 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "files/attack-eval-defs/evals/*.yaml" }}
  eval-{{ base $path }}: |
{{ $.Files.Get $path | replace "__HERMES_HOME__" $hermesHome | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-plant-ui
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: water-plant-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: water-plant-ui
        app.kubernetes.io/part-of: water-plant
    spec:
      serviceAccountName: {{ $uiSa }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: {{ printf "%s/%s/%s:%s" .Values.image.registry .Values.image.namespace .Values.image.ui.repository .Values.image.ui.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLANT_API_URL
              value: http://plant-api.{{ $ns }}.svc:8080
            {{- /*
            The console follows the harness. agentUrl was once a flat value
            pointing at waterplant-agent, which meant flipping agent.harness
            deployed Hermes and left the chat pane talking to a Service that no
            longer existed — the swap looked like a broken console. Derived
            here so there is one switch, not two that must agree.
            */}}
            {{- /*
            On the hermes harness the console defaults to the plain Hermes
            (agent.hermes.plain) whenever it is deployed, and to hermes-agent
            (the pod, or the OpenShell bridge) otherwise. AGENT_URL can be
            flipped by hand between the two; the platform Application ignores
            this one field so self-heal keeps the override.
            */}}
            {{- if eq .Values.agent.harness "hermes" }}
            - name: AGENT_URL
              value: {{ .Values.ui.agentUrl | default (printf "http://%s.%s.svc:%v" $hermesSvc $ns .Values.agent.hermes.port) | quote }}
            - name: AGENT_PROTOCOL
              value: openai
            - name: AGENT_MODEL
              value: hermes-agent
            - name: AGENT_API_KEY
              # Hermes authenticates with one static server key and rejects a
              # participant token, so the BFF holds a service credential here
              # and the caller's identity stops at the console. That is a real
              # loss for the identity scenarios; /api/config reports it rather
              # than letting an exercise fail silently.
              #
              # optional, because a hard reference here took out whole tenants
              # on three clusters. The console is sync wave 2 and the gateway's
              # MCPServerRegistrations are wave 3: with the Secret absent this
              # container could not start, the Deployment never went healthy,
              # the sync failed at wave 2, and wave 3 never ran. The gateway
              # then federated only its own two broker tools, the agent waited
              # for tool prefixes that could never appear, and the console
              # reported "agent unreachable" — no part of which names a missing
              # Secret. On cluster-jddlk ArgoCD's retries were exhausted and a
              # participant could not recover it, because the platform
              # Application is deliberately beyond their reach.
              #
              # Unset, the console still serves the dashboard and the chat pane
              # fails per request. On the openshell runtime the key is inert
              # anyway: the relay strips Authorization and the gateway's mTLS
              # authenticates the caller.
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.agent.hermes.envSecret }}
                  key: API_SERVER_KEY
                  optional: true
            {{- else }}
            - name: AGENT_URL
              value: {{ .Values.ui.agentUrl | default (printf "http://waterplant-agent.%s.svc:8080" $ns) | quote }}
            - name: AGENT_PROTOCOL
              value: waterplant
            {{- end }}
            - name: MLFLOW_URL
              value: {{ .Values.ui.mlflowUrl | quote }}
            {{- if .Values.ui.mlflowUrl }}
            # Which experiment holds this participant's traces, so the console
            # can find the one its own turn just wrote. Defaults the same way
            # the bridge's MLFLOW_EXPERIMENT does — the participant's username —
            # because they must name the same experiment or the console searches
            # somewhere Hermes never wrote to.
            #
            # Inert on the waterplant harness, which emits its tool calls to the
            # console directly and never reaches this code path.
            - name: MLFLOW_EXPERIMENT
              value: {{ .Values.ui.mlflowExperiment | default .Values.username | quote }}
            # Where the attack/eval runner writes its cycle summaries — one run every
            # five minutes, separate from the traces above so the rollups do not bury
            # the participant's own turns. The console reads the latest run here to
            # show "you were just attacked" and the results panel behind it.
            #
            # The run id doubles as the freshness cursor: the console compares it
            # against the last one it showed and only raises the alert when it changes,
            # which is why no push channel is needed for any of this.
            #
            # Must resolve to the same name the runner builds from
            # attackEvalRunner.cycleExperimentSuffix in bootstrap-infra. Change one and
            # you must change the other, the same coupling MLFLOW_EXPERIMENT has above.
            - name: MLFLOW_CYCLE_EXPERIMENT
              value: {{ .Values.ui.cycleMlflowExperiment | default (printf "%s-cycle" .Values.username) | quote }}
            {{- end }}
            {{- if .Values.ui.mlflowUrl }}
            # Where the console TALKS to MLflow, as opposed to MLFLOW_URL,
            # which is the browser-facing route behind the OAuth proxy. A
            # POST to MLFLOW_URL from in here is answered with a 302 to a
            # login page and a cheerful 200 full of HTML.
            - name: MLFLOW_API_URL
              value: {{ .Values.ui.mlflowApiUrl | quote }}
            # The per-turn trace lookup verifies MLflow's service-signer
            # certificate against this. Without it the lookup fails on TLS and
            # the console reports "no trace was collected for this turn" —
            # which looks like a tracing problem rather than a trust problem,
            # because find_trace swallows transport errors by design.
            - name: MLFLOW_CA_FILE
              value: /etc/mlflow-ca/service-ca.crt
            {{- end }}
            # Attacks fire on a randomised timer when this is "1". Off leaves
            # the console fully usable and only stops the clock, so nothing
            # lands in the middle of a demonstration.
            - name: ATTACK_SCHEDULER_ENABLED
              value: {{ .Values.ui.probes.scheduler | quote }}
            - name: ATTACK_INTERVAL_MIN_S
              value: {{ .Values.ui.probes.intervalMinSeconds | quote }}
            - name: ATTACK_INTERVAL_MAX_S
              value: {{ .Values.ui.probes.intervalMaxSeconds | quote }}
            # Reseed the plant before each attack so every one starts from an
            # identical baseline. Only sane with the scheduler off: a reset
            # discards the participant's work orders, and unattended that
            # happens every few minutes.
            - name: PROBE_RESET_BEFORE_ATTACK
              value: {{ .Values.ui.probes.resetBeforeAttack | quote }}
            # And before an eval sweep, so two scorecards are comparable.
            # Unlike the attack reset this one is always participant-initiated
            # — it only runs when somebody presses Run all evals — so the
            # scheduler caveat above does not apply to it.
            - name: PROBE_RESET_BEFORE_EVALS
              value: {{ .Values.ui.probes.resetBeforeEvals | quote }}
            # The mounted definitions win over the set baked into the image.
            # Empty or absent, the image's own copy is used, so the console
            # still works with no ConfigMap at all.
            - name: PROBE_DEFS_DIR
              value: /config/probe-defs
            {{- if .Values.docs.enabled }}
            # The documentation site, which is also the exfiltration observer.
            # Without it the honeypot attacks have no way to see whether data
            # actually left, and the engine reports them unjudgeable rather
            # than inferring a verdict from what the agent said it did.
            # Read by the engine for the hit log, and rendered into every
            # attack prompt as {{ "{{ docs_url }}" }}. Use the same short host
            # as the documentation skill and OpenShell policy, so a hostname
            # mismatch cannot masquerade as a blocked redirect attack.
            - name: DOCS_URL
              value: http://waterplant-docs:8080
            {{- end }}
            # Which pod holds the agent's filesystem, and which container in
            # it. The sandbox runtime's pod is created by the participant and
            # is named for the sandbox, so both are values rather than
            # something the console infers.
            {{- if $onPlain }}
            - name: AGENT_POD_SELECTOR
              value: app.kubernetes.io/name=hermes-plain
            - name: AGENT_POD_CONTAINER
              value: hermes
            # Where the agent keeps its instructions, and where the pristine
            # lab copy sits. Both differ by runtime, and the defaults in
            # goals.py are the plain ones — so the sandbox needs them stated
            # or the console would look for SOUL.md at the wrong path
            # entirely and report it missing.
            - name: AGENT_HERMES_HOME
              value: {{ .Values.agent.hermes.home | quote }}
            - name: AGENT_SOUL_SOURCE
              value: /soul/SOUL.md
            # The pristine skills, and reseed-skills.sh beside them. Same
            # reasoning as the soul: a reset that leaves a patched SKILL.md
            # behind has not reset the lab, because Hermes re-reads the file
            # on the next lookup of that kind. agent-hermes-plain.yaml mounts
            # this ConfigMap read-only into the hermes container so the
            # console can reach it.
            - name: AGENT_SKILLS_SOURCE
              value: /config
            # The pristine always-present report, published beside them. The
            # console clears the reports directory and puts this one back,
            # rather than asking the agent to rewrite it — which restored one
            # file at best and never removed the ones its earlier turns had
            # written.
            - name: AGENT_REPORT_SOURCE
              value: /config/very-important-report.md
            {{- else }}
            - name: AGENT_POD_SELECTOR
              value: agents.x-k8s.io/sandbox-name-hash
            - name: AGENT_POD_CONTAINER
              value: agent
            # The sandbox's own home, and the copy the bridge uploaded —
            # start-hermes seeds the live file from exactly this path.
            - name: AGENT_HERMES_HOME
              value: /sandbox/.hermes
            - name: AGENT_SOUL_SOURCE
              value: /sandbox/hermes/SOUL.md
            # Where the bridge uploaded them — start-hermes seeds the live
            # skills from exactly this directory, so a reset and a Hermes
            # restart put back the same files.
            - name: AGENT_SKILLS_SOURCE
              value: /sandbox/hermes
            - name: AGENT_REPORT_SOURCE
              value: /sandbox/hermes/very-important-report.md
            {{- end }}
            - name: NAMESPACE
              value: {{ $ns }}
            # The input guardrail: the Service address, called as-is, with no
            # token and no RBAC behind it -- tenant-guardrails sets
            # guardrails.authEnabled false precisely so this stays a plain
            # pod-to-pod call.
            #
            # Rendered even when empty, as AGENT_URL is, so the value stays
            # settable through ui.nemoEndpoint -- but do
            # not expect it on a participant's Deployment: both are named in
            # the platform Application's ignoreDifferences, and with
            # RespectIgnoreDifferences that strips the path from the desired
            # state as well, so Argo never writes it. Verified on
            # cluster-pz7xk: NEMO_CONFIG_ID below lands, NEMO_ENDPOINT does
            # not. Module 6's `oc set env` is what creates it, and the ignore
            # entry is what then keeps self-heal off it.
            - name: NEMO_ENDPOINT
              value: {{ .Values.ui.nemoEndpoint | quote }}
            {{- if .Values.ui.nemoConfigId }}
            - name: NEMO_CONFIG_ID
              value: {{ .Values.ui.nemoConfigId | quote }}
            {{- end }}
            - name: NEMO_MODEL
              value: {{ .Values.ui.nemoModel | default .Values.agent.litellm.model | quote }}
          volumeMounts:
            - name: probe-defs
              mountPath: /config/probe-defs
              readOnly: true
          {{- if .Values.ui.mlflowUrl }}
            # MLflow is served with an openshift-service-serving-signer
            # certificate that no public trust store knows, so without this
            # every eval sweep fails to record with "self-signed certificate
            # in certificate chain".
            - name: mlflow-ca
              mountPath: /etc/mlflow-ca
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      volumes:
        - name: probe-defs
          configMap:
            name: water-plant-ui-probe-defs
        {{- if .Values.ui.mlflowUrl }}
        - name: mlflow-ca
          configMap:
            name: mlflow-service-ca
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: water-plant-ui
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: water-plant-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.ui.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: water-plant-ui
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # The router defaults to a 30s server timeout. A full agent investigation is
    # a seven-step tool chain plus backoff through the shared model endpoint's
    # 429s, which routinely exceeds that — the request would 504 mid-thought and
    # look like the agent had crashed.
    haproxy.router.openshift.io/timeout: {{ .Values.ui.route.timeout | quote }}
spec:
  to:
    kind: Service
    name: water-plant-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
