{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
{{/*
The operator console.

The dashboard reads plant-api directly rather than through the agent. That is
deliberate: the plant must stay observable when the agent is denied, broken or
not yet deployed — which is most of module 4 — and a participant needs to see
what a control action actually did, independently of what the agent says it
did. AGENT_URL is empty until the agent exists, and the chat pane degrades to a
clear "not deployed" state rather than failing opaquely.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-plant-ui
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: water-plant-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: water-plant-ui
        app.kubernetes.io/part-of: water-plant
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: {{ printf "%s/%s/%s:%s" .Values.image.registry .Values.image.namespace .Values.image.ui.repository .Values.image.ui.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLANT_API_URL
              value: http://plant-api.{{ $ns }}.svc:8080
            - name: AGENT_URL
              value: {{ .Values.ui.agentUrl | quote }}
            - name: MLFLOW_URL
              value: {{ .Values.ui.mlflowUrl | quote }}
            - name: NAMESPACE
              value: {{ $ns }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: water-plant-ui
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    app.kubernetes.io/name: water-plant-ui
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.ui.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: water-plant-ui
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: water-plant-ui
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # The router defaults to a 30s server timeout. A full agent investigation is
    # a seven-step tool chain plus backoff through the shared model endpoint's
    # 429s, which routinely exceeds that — the request would 504 mid-thought and
    # look like the agent had crashed.
    haproxy.router.openshift.io/timeout: {{ .Values.ui.route.timeout | quote }}
spec:
  to:
    kind: Service
    name: water-plant-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
