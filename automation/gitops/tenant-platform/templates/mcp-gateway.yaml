{{- if .Values.mcpGateway.enabled }}
{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
{{- $gw := .Values.mcpGateway.gatewayName -}}
{{- $svc := printf "%s-%s.%s.svc.cluster.local" $gw .Values.mcpGateway.gatewayClassName $ns -}}
{{- $kcHost := required "keycloak.host is required when mcpGateway.enabled (forwarded by bootstrap-tenant)" .Values.keycloak.host -}}
{{- $realm := printf "waterplant-%s" .Values.username -}}
{{/*
This participant's own MCP Gateway.

One per participant rather than one shared, because a shared broker federates
every tenant's tools into a single list: prefixes come from the server type,
so every tenant's control_set_pump_speed collides; every agent sees every
tenant's tools; and the AuthPolicies on a shared Gateway would need patching
by 30 Applications that then fight over one object. Here the gateway, the
broker, the routes, the registrations and the realm all belong to this
participant, and editing any of them affects no one else.

Traffic path for one tool call:

  agent -> Gateway listener `mcp`  (public; mcp-auth-policy authenticates)
        -> broker (MCPGatewayExtension) picks the upstream server
        -> Gateway listener `mcps` (internal, <server>.mcp.local;
                                    mcp-authz-policy checks tool:<name>)
        -> MCP server Service

The AuthPolicies live in tenant-policy, not here: they are what participants
edit. This chart provides only the mechanism.

Four OpenShift-specific settings, each of which broke something when absent —
all found on cluster-tpss7:

  * networking.istio.io/service-type: ClusterIP. OpenShift's gateway controller
    creates a LoadBalancer Service, and with no LB provider it never gets an
    address, so the Gateway reports Programmed=False indefinitely.
  * parametersRef -> one Envoy replica with bounded resources. The class
    default is an HPA of 2-10 replicas with a 2 CPU limit each, which on its
    own blows the participant's 8 CPU limit quota before the broker starts.
  * privateHost. The broker hair-pins tool calls back through the gateway and
    defaults to <gateway>-istio.<ns>.svc; OpenShift names the Service
    <gateway>-<gatewayclass>, so the default host does not exist.
  * publicHost. The listener has no hostname, and without publicHost the
    extension is rejected outright.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $gw }}-parameters
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $gw }}
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  deployment: |
    spec:
      template:
        spec:
          containers:
            - name: istio-proxy
              resources:
                {{- toYaml .Values.mcpGateway.envoyResources | nindent 16 }}
              # Istio's default startup probe allows about 30s (30 x 1s). With an
              # AuthPolicy in place, Envoy compiles Kuadrant's 5.4 MB policy
              # module before it reports ready, and that took about 28s here. So
              # a start under enforcement was often killed just before it
              # finished, over and over. Only the threshold is overridden; the
              # patch is merged, so Istio's health check stays.
              startupProbe:
                failureThreshold: {{ .Values.mcpGateway.envoyStartupSeconds }}
  horizontalPodAutoscaler: |
    spec:
      minReplicas: 1
      maxReplicas: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # The AdminNetworkPolicy in bootstrap-infra selects Envoy pods by this name.
  name: {{ $gw }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ $gw }}
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: {{ .Values.mcpGateway.gatewayClassName }}
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: {{ $gw }}-parameters
  listeners:
    - name: mcp
      protocol: HTTP
      port: 8080
      allowedRoutes:
        namespaces:
          from: Same
    - name: mcps
      protocol: HTTP
      port: 8080
      hostname: "*.mcp.local"
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPGatewayExtension
metadata:
  name: {{ $gw }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $gw }}
    # Explicit, although the CRD documents it as optional and defaulting to the
    # extension's own namespace. The 0.7.1 controller does not apply that
    # default: without this it looks the Gateway up in namespace "" and rejects
    # the extension with "invalid: gateway target /mcp-gateway not found" —
    # observed on cluster-tpss7. Every registration then reports "no valid
    # mcpgatewayextensions configured", so the whole gateway is dead.
    namespace: {{ $ns }}
    sectionName: mcp
  httpRouteManagement: Enabled
  publicHost: {{ $svc | quote }}
  privateHost: {{ printf "%s:8080" $svc | quote }}
  oauthProtectedResource:
    resourceName: "Water Plant MCP Gateway ({{ .Values.username }})"
    resource: {{ printf "http://%s:8080/mcp" $svc | quote }}
    authorizationServers:
      - {{ printf "https://%s/realms/%s" $kcHost $realm | quote }}
    bearerMethodsSupported: [header]
    scopesSupported: [openid, groups, roles]
{{- range .Values.mcp.servers }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name }}-route
  namespace: {{ $ns }}
  labels:
    mcp-server: "true"
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: {{ $gw }}
      sectionName: mcps
  hostnames:
    - {{ .name }}.mcp.local
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: {{ .name }}
          port: 8080
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  # The broker sends x-mcp-servername as <namespace>/<this name>, and the
  # Keycloak client IDs below must match it exactly.
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # telemetry-mcp -> telemetry_, so get_pump_status becomes
  # telemetry_get_pump_status on the federated list.
  prefix: {{ printf "%s_" (trimSuffix "-mcp" .name) }}
  hint: {{ .hint | quote }}
  category:
    - {{ trimSuffix "-mcp" .name }}
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ .name }}-route
{{- end }}
---
{{/*
This participant's Keycloak realm — where tool roles are granted and revoked.

Adapted from deploy/keycloak/realms/waterplant-realm-template.yaml with two
changes. Client IDs follow the tenant namespace, because they must equal the
x-mcp-servername the broker sends. And the confidential wp-dev/hermes-agent
client is gone: its secret could not live in git, and Hermes authenticates as
the realm's operator user anyway, so its tool scope is capped at the operator
persona rather than a full-access service account.

Lives in the Keycloak namespace (a KeycloakRealmImport must sit beside its
Keycloak CR), which is why bootstrap-infra's AppProject allows that
destination.

A realm import is applied once. Selfheal on this Application re-applies the CR,
not the realm contents, so a participant's role changes in the Keycloak admin
console survive a sync — which is the point, since that is the exercise.
*/}}
{{- $kc := .Values.keycloak }}
{{- $fed := $kc.agentIdentity.federated }}
{{- /* The two signers of OpenShell's token_exchange. The AGENT id is also the
       agent client's clientId and the azp the AuthPolicy matches on: OpenShell
       always sets the intermediate token's audience to the supervisor's SVID
       subject, and Keycloak resolves the final exchange's client out of it. */}}
{{- $brokerId := $fed.brokerSpiffeId | default (printf "%s/ns/%s/sa/%s-openshell" $fed.trustDomain $ns .Values.username) }}
{{- $brokerClientId := $fed.brokerClientId | default "delegation-broker" }}
{{- $agentId := $fed.agentSpiffeId | default (printf "%s/ns/%s/sa/%s-openshell-sandbox" $fed.trustDomain $ns .Values.username) }}
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ $realm }}
  namespace: {{ $kc.namespace }}
  labels:
    rhdp.redhat.com/lab: agentops-in-action
    rhdp.redhat.com/participant: {{ .Values.username }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  keycloakCRName: {{ $kc.crName }}
  realm:
    realm: {{ $realm }}
    id: {{ $realm }}
    enabled: true
    displayName: "Water Plant — {{ .Values.username }}"
    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: true
    duplicateEmailsAllowed: false
    resetPasswordAllowed: false
    editUsernameAllowed: false
    bruteForceProtected: true
    accessTokenLifespan: 1800
    ssoSessionMaxLifespan: 1800
{{- if and $kc.agentIdentity.enabled $kc.agentIdentity.federated.enabled }}
{{- $fed := $kc.agentIdentity.federated }}
{{- $domain := regexReplaceAll "^[^.]+\\." $kcHost "" }}
{{- $bundle := $fed.bundleEndpoint | default (printf "https://spire-oidc.%s/keys" $domain) }}

    # -----------------------------------------------------------------------
    # SPIRE as an identity provider, so the agent's client can authenticate
    # with an attested JWT-SVID instead of the shared secret below.
    #
    # Two non-obvious things, both of which cost a session:
    #
    #   The trust domain goes in `issuer`, NOT `trustDomain`.
    #   SpiffeIdentityProviderConfig.getTrustDomain() reads
    #   IdentityProviderModel.ISSUER. Anything else is rejected 400
    #   "Invalid trust domain name", and the value must match
    #   ^spiffe://[a-z0-9.\-_]*$.
    #
    #   This only works on a realm CREATED while the Keycloak CR has
    #   features.enabled: [spiffe, client-auth-federated].
    #   DefaultAuthenticationFlows.clientAuthFlow() adds the `federated-jwt`
    #   execution to the built-in `clients` flow only when the feature is on at
    #   realm-creation time, and the admin API refuses to add an execution to a
    #   built-in flow afterwards ("It is illegal to add execution to a built in
    #   flow"). A realm imported before the flag was set needs
    #   files/apply-realm-identity.sh, which copies the flow, extends the copy
    #   and rebinds it. Both paths end up equivalent.
    # -----------------------------------------------------------------------
    identityProviders:
      - alias: {{ $fed.idpAlias | quote }}
        providerId: spiffe
        enabled: true
        config:
          issuer: {{ $fed.trustDomain | quote }}
          bundleEndpoint: {{ $bundle | quote }}
{{- end }}

    roles:
      realm:
        - name: operator
          description: Plant operator — normal shift duties
      client:
        # Declared so they appear in the admin console and can be granted or
        # withheld during the exercises. The authz policy checks
        # ('tool:' + x-mcp-toolname) in resource_access[x-mcp-servername].roles
{{- range $server, $tools := $kc.toolRoles }}
        {{ printf "%s/%s" $ns $server | quote }}:
{{- range $tools }}
          - name: {{ printf "tool:%s" . | quote }}
{{- end }}
{{- end }}

    groups:
      - name: operators
        subGroups: []
    defaultGroups:
      - operators

    clients:
      # Public client the agent authenticates through (password grant).
      - clientId: {{ $kc.agentClientId }}
        name: MCP Gateway Client
        enabled: true
        publicClient: true
        directAccessGrantsEnabled: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        redirectUris:
          - "http://localhost:*"
          - "http://127.0.0.1:*"
          - "https://localhost:*"
        webOrigins:
          - "*"
        protocol: openid-connect
        attributes:
          pkce.code.challenge.method: S256
        defaultClientScopes:
          - openid
          - roles
          - groups
        {{- if $kc.agentIdentity.enabled }}
        # Mappers that exist only to make RFC 8693 token exchange possible.
        #
        # The realm declares clientScopes: explicitly, which REPLACES Keycloak's
        # built-ins rather than adding to them. So there is no `basic` scope and
        # therefore no subject, and no `profile` scope and therefore no
        # username. Verified on a live tenant: the operator's token carried
        # [azp exp groups iat iss jti resource_access scope sid typ] and nothing
        # else -- 18 permissions with no principal attached.
        #
        # The audience mapper is not a nicety. Keycloak's standard token
        # exchange requires the REQUESTING client to be the subject token's azp
        # or to appear in its aud, and without this it is neither: the exchange
        # fails 400 "Client is not within the token audience". Note Keycloak
        # writes the configured string without resolving it, so this is valid
        # even before the hermes-agent client below exists.
        protocolMappers:
{{- if not $fed.enabled }}
          # Only for the pre-attestation agent client. Absent once attestation is
          # on, along with the client itself.
          - name: aud-{{ $kc.agentIdentity.clientId }}
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: {{ $kc.agentIdentity.clientId | quote }}
              access.token.claim: "true"
              introspection.token.claim: "true"
              id.token.claim: "false"
{{- end }}
{{- if $fed.enabled }}
          # The same requirement, for the delegation broker: RFC 8693 needs the
          # requesting client to be the subject token's azp or in its aud, and
          # in attested mode the exchange is performed by the broker rather
          # than by the secret-path agent above.
          - name: aud-{{ $brokerClientId }}
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: {{ $brokerClientId | quote }}
              access.token.claim: "true"
              introspection.token.claim: "true"
              id.token.claim: "false"
{{- end }}
          - name: preferred-username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            consentRequired: false
            config:
              user.attribute: username
              claim.name: preferred_username
              jsonType.label: String
              access.token.claim: "true"
              id.token.claim: "true"
              introspection.token.claim: "true"
              userinfo.token.claim: "true"
        {{- end }}
{{- if and $kc.agentIdentity.enabled (not $fed.enabled) }}
      # ---------------------------------------------------------------------
      # The PRE-ATTESTATION agent client, created only when federated is off.
      # It is the secret-authenticated fallback, and it is deliberately absent
      # once attestation is on: a client that can mint the same token with a
      # string is a downgrade path, and an invisible one.
      #
      # The agent's own identity.
      #
      # This replaces the confidential wp-dev/hermes-agent client that used to
      # be here and was removed because "its secret could not live in git".
      # Two things answer that objection:
      #
      #   serviceAccountsEnabled: false -- this client cannot obtain a token in
      #   its own name. It can do exactly one thing: re-mint a token whose
      #   subject someone else already authenticated, carrying no more
      #   permissions than that subject had. Its secret therefore grants
      #   strictly LESS than the operator/operator password already printed in
      #   the lab guide, which is why it can sit in values.yaml beside
      #   adminPassword: redhat without reopening the hole the old client
      #   opened. If that ever changes -- in particular if delegation forces
      #   serviceAccountsEnabled: true -- the secret must move to the catalog
      #   item's channel, or better, be replaced by a SPIFFE-attested
      #   credential.
      #
      #   The sanctioned secret channel exists anyway: MODEL_API_KEY and
      #   API_SERVER_KEY already reach a tenant through the catalog item.
      #
      # The `roles` scope is LOAD-BEARING. The resource_access.${client_id}.roles
      # mapper lives in the realm's custom `roles` client scope; omit it and the
      # exchanged token has no resource_access at all, and every tool call fails
      # the FIRST authz predicate -- which reads like a policy bug rather than a
      # scope omission.
      #
      # preferred-username is repeated here deliberately. Mappers are per
      # client, and the exchanged token is issued FOR this client, so it carries
      # only this client's mappers plus the shared scopes. Measured: without
      # this the exchanged token came back with preferred_username ABSENT while
      # sub was present, leaving the actor chain a bare UUID.
      # ---------------------------------------------------------------------
      - clientId: {{ $kc.agentIdentity.clientId | quote }}
        name: Hermie agent identity
        description: >-
          The agent acting on the operator's behalf. No service account: it can
          only re-mint a token someone else authenticated.
        enabled: true
        publicClient: false
        serviceAccountsEnabled: false
        directAccessGrantsEnabled: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        fullScopeAllowed: true
        protocol: openid-connect
        secret: {{ required "keycloak.agentIdentity.clientSecret is required when agentIdentity.enabled" $kc.agentIdentity.clientSecret | quote }}
        defaultClientScopes:
          - roles
          - groups
        attributes:
          # GA and on by default since Keycloak 26.2; verified advertised on
          # RHBK 26.4.18. NOT the same as delegation (actor_token / the `act`
          # claim), which needs 26.8+, a preview feature and FGAP v2 -- see
          # docs/agent-identity/04-keycloak-upgrade-path.md.
          standard.token.exchange.enabled: "true"
        protocolMappers:
          # Per-hop audience. Set by a fixed mapper rather than by passing
          # audience= on the exchange request: requesting an audience re-scopes
          # which client's mappers apply and risks dropping resource_access,
          # which is the operator's entire permission set.
          - name: aud-mcp-gateway-resource
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.custom.audience: {{ printf "http://%s:%d/mcp" $svc (int 8080) | quote }}
              access.token.claim: "true"
              introspection.token.claim: "true"
              id.token.claim: "false"
          - name: preferred-username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            consentRequired: false
            config:
              user.attribute: username
              claim.name: preferred_username
              jsonType.label: String
              access.token.claim: "true"
              id.token.claim: "true"
              introspection.token.claim: "true"
              userinfo.token.claim: "true"
{{- end }}
{{- if and $kc.agentIdentity.enabled $fed.enabled }}
      # ---------------------------------------------------------------------
      # The DELEGATION BROKER.
      #
      # The OpenShell gateway authenticates as this client, proving it with its
      # own JWT-SVID, when it exchanges a stored user token for an intermediate
      # one. Named for the function: one gateway can broker for any number of
      # realm users, so it is emphatically NOT "the agent".
      #
      # Born federated-jwt, which is safe only because this client is NEW. It
      # has no secret path to take out of service, so enabling attested mode is
      # purely additive and `hermes-agent` keeps working as the fallback.
      # ---------------------------------------------------------------------
      - clientId: {{ $brokerClientId | quote }}
        name: Delegation broker
        description: >-
          The OpenShell gateway, authenticated by its SPIRE-issued JWT-SVID.
          Exchanges a stored user token for an intermediate token addressed to
          one specific sandbox.
        enabled: true
        publicClient: false
        serviceAccountsEnabled: false
        directAccessGrantsEnabled: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        fullScopeAllowed: true
        protocol: openid-connect
        clientAuthenticatorType: federated-jwt
        defaultClientScopes:
          - roles
          - groups
        attributes:
          standard.token.exchange.enabled: "true"
          jwt.credential.issuer: {{ $fed.idpAlias | quote }}
          jwt.credential.sub: {{ $brokerId | quote }}
        protocolMappers:
          # Required for the intermediate exchange. Verified: Keycloak's
          # checkRequestedAudiences asserts the ISSUED token actually carries
          # the requested audience, so `audience=<agent>` is refused 400
          # "Requested audience not available" unless a mapper puts it there.
          - name: aud-agent
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.client.audience: {{ $agentId | quote }}
              access.token.claim: "true"
              introspection.token.claim: "true"
              id.token.claim: "false"
      # ---------------------------------------------------------------------
      # The AGENT client. Its clientId IS the sandbox's SPIFFE ID -- see the
      # comment on $agentId above; this is forced by OpenShell, not chosen.
      #
      # fullScopeAllowed: false with NO scope mappings is load-bearing. It makes
      # the baseline ZERO roles, so the token carries only the tool whose
      # optional `tool-<name>` scope the exchange asked for, and only if the
      # operator holds that role too. Measured 2026-11-26: with it true a
      # requested scope does not narrow at all (18 roles either way), and a
      # scope mapping placed here instead would be an always-on grant that
      # appears in every token and defeats the narrowing.
      # ---------------------------------------------------------------------
      - clientId: {{ $agentId | quote }}
        name: Hermie agent (attested)
        description: >-
          The sandbox supervisor, authenticated by its SPIRE-issued JWT-SVID.
          Signs the final token exchange, so its id is the azp Authorino sees.
        enabled: true
        publicClient: false
        serviceAccountsEnabled: false
        directAccessGrantsEnabled: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        fullScopeAllowed: false
        protocol: openid-connect
        clientAuthenticatorType: federated-jwt
        defaultClientScopes:
          - roles
          - groups
{{- if $fed.perToolScopes }}
        optionalClientScopes:
{{- range $server, $tools := $kc.toolRoles }}
{{- range $tools }}
{{- if or (eq (toString $fed.delegableTools) "all") (has . $fed.delegableTools) }}
          - {{ printf "tool-%s" . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
        attributes:
          standard.token.exchange.enabled: "true"
          jwt.credential.issuer: {{ $fed.idpAlias | quote }}
          jwt.credential.sub: {{ $agentId | quote }}
        protocolMappers:
          # Mappers are per client and the FINAL token is issued for this one,
          # so without these the token came back with preferred_username and aud
          # both absent -- measured on the live realm 2026-11-26.
          - name: aud-mcp-gateway-resource
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            consentRequired: false
            config:
              included.custom.audience: {{ printf "http://%s:%d/mcp" $svc (int 8080) | quote }}
              access.token.claim: "true"
              introspection.token.claim: "true"
              id.token.claim: "false"
          - name: preferred-username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            consentRequired: false
            config:
              user.attribute: username
              claim.name: preferred_username
              jsonType.label: String
              access.token.claim: "true"
              id.token.claim: "true"
              introspection.token.claim: "true"
              userinfo.token.claim: "true"
{{- end }}
{{- range $server, $tools := $kc.toolRoles }}
      # One bearer-only client per MCP server; its ID is the broker's
      # x-mcp-servername for that server.
      - clientId: {{ printf "%s/%s" $ns $server | quote }}
        name: {{ $server | quote }}
        enabled: true
        bearerOnly: true
        publicClient: false
        serviceAccountsEnabled: false
        protocol: openid-connect
        defaultClientScopes:
          - openid
{{- end }}

    clientScopes:
      - name: groups
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            consentRequired: false
            config:
              full.path: "false"
              introspection.token.claim: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: groups
      - name: roles
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: resource_access
            protocol: openid-connect
            protocolMapper: oidc-usermodel-client-role-mapper
            consentRequired: false
            config:
              multivalued: "true"
              userinfo.token.claim: "true"
              id.token.claim: "true"
              access.token.claim: "true"
              claim.name: "resource_access.${client_id}.roles"
              jsonType.label: String
{{- if and $kc.agentIdentity.enabled $fed.enabled $fed.perToolScopes }}
      # --------------------------------------------------------------------
      # One optional client scope per tool, so a single exchange can ask for
      # exactly the tool in flight and the token carries ONE role instead of
      # eighteen -- the smaller blast radius Uber's design is after.
      #
      # The scope carries no mapper of its own: the roles claim still comes
      # from the `roles` scope above. What each scope carries is a
      # scope-MAPPING to its matching tool role, declared in
      # clientScopeMappings below, which is what widens the agent client's
      # otherwise-empty effective scope by exactly one role.
      #
      # Scope names are realm-wide while tool names are per server, so two
      # servers sharing a tool name would collide. All 18 are distinct today;
      # if that changes the name must become tool-<server>-<tool>.
      # --------------------------------------------------------------------
{{- range $server, $tools := $kc.toolRoles }}
{{- range $tools }}
      - name: {{ printf "tool-%s" . | quote }}
        description: {{ printf "Permission to call %s on this one hop" . | quote }}
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
{{- end }}
{{- end }}
{{- end }}


    users:
      # Realm admin: the account a participant uses to grant and revoke tool
      # roles at https://<keycloak-host>/admin/{{ $realm }}/console
      - username: admin
        email: admin@waterplant.local
        firstName: Realm
        lastName: Admin
        enabled: true
        emailVerified: true
        credentials:
          - type: password
            value: {{ $kc.adminPassword | quote }}
            temporary: false
        clientRoles:
          realm-management:
            - realm-admin

      # Operator persona, and the identity the agent's tool calls carry.
      # Holds every declared tool role except those listed under
      # withheldFromOperator — the ones the exercises grant.
      - username: {{ $kc.agentUser }}
        email: operator@waterplant.local
        firstName: Plant
        lastName: Operator
        enabled: true
        emailVerified: true
        credentials:
          - type: password
            value: {{ $kc.agentPassword | quote }}
            temporary: false
        realmRoles:
          - operator
        groups:
          - operators
        clientRoles:
{{- range $server, $tools := $kc.toolRoles }}
{{- $withheld := index $kc.withheldFromOperator $server | default list }}
          {{ printf "%s/%s" $ns $server | quote }}:
{{- range $tools }}
{{- if not (has . $withheld) }}
            - {{ printf "tool:%s" . | quote }}
{{- end }}
{{- end }}
{{- end }}

    # NOTE: one key for the whole realm. Anything else that needs a scope
    # mapping must be added INSIDE this block -- a second `clientScopeMappings:`
    # is a duplicate YAML key and one of the two is silently dropped.
    clientScopeMappings:
{{- range $server, $tools := $kc.toolRoles }}
{{- $withheld := index $kc.withheldFromOperator $server | default list }}
      {{ printf "%s/%s" $ns $server | quote }}:
        - client: {{ $kc.agentClientId }}
          roles:
{{- range $tools }}
{{- if not (has . $withheld) }}
            - {{ printf "tool:%s" . | quote }}
{{- end }}
{{- end }}
{{- if and $kc.agentIdentity.enabled $fed.enabled $fed.perToolScopes }}
        # Each tool-<name> scope maps to exactly its own tool:<name> role, so
        # requesting that scope widens the agent client's otherwise-empty
        # effective scope by one role and nothing else -- and only when the
        # operator holds it too: a requested scope can narrow, never grant
        # (measured on the live realm 2026-11-26).
{{- range $tools }}
        - clientScope: {{ printf "tool-%s" . | quote }}
          roles:
            - {{ printf "tool:%s" . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.mcpGateway.enabled }}
{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix }}
{{/*
Lets mcp-gateway-controller reach this tenant's broker.

This is what makes a tenant DELETABLE in reasonable time, which is not
obvious from its name, so the measurement is recorded here.

The controller reconciles every MCPServerRegistration by probing
http://mcp-gateway.<ns>.svc:8080/status. That Service fronts the BROKER pod
the controller itself creates -- labelled app.kubernetes.io/managed-by:
mcp-gateway-controller -- not the Envoy gateway pod, which carries
gateway.networking.k8s.io/gateway-name and is a different workload on a
different IP. Worth stating because aiming this policy at the Envoy pod looks
right, changes nothing, and was the first thing tried.

tenant-policy's allow-ingress-within-namespace switches the namespace to
default-deny ingress and re-allows only same-namespace pods and the router.
The broker is caught by it, so the probe had no path in and timed out after
10s, every reconcile, for every registration of every tenant.

The visible symptom is cosmetic: registrations stay Ready=False with no
discoveredTools, which healthcheck TEN-MCP-02 reports as a known-benign
warning because the data plane is unaffected -- the agent reaches Envoy and
Envoy reaches the MCP servers entirely in-namespace.

The expensive symptom is not. The controller's work queue is serialized, so
10s of dead time per registration per tenant starves it, and removal of the
mcp.kuadrant.io/finalizer on a DELETING tenant waits behind that backlog.

Measured on cluster-z4r9v with 7 tenants, before this policy: deleting one
tenant sat 147 seconds with its platform Application already Missing and four
MCP objects still holding finalizers, finishing at 3m48s. agnosticd's
ocp4_workload_gitops_bootstrap waits 30 retries -- roughly 5 minutes -- then
fails the entire destroy. That is AWX job 109384. The backlog grows with
tenant count, so a full event sails past the budget.

After this policy, the same probe answered HTTP 200 in 11ms.

Scoped to one namespace, one port and the broker pod alone. It does not
reopen the cross-tenant path allow-ingress-within-namespace exists to close,
and that policy -- along with the lab exercise built on it -- is untouched.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-broker-from-controller
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: mcp-gateway-controller
      app.kubernetes.io/name: {{ .Values.mcpGateway.gatewayName }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.mcpGateway.controllerNamespace | default "kuadrant-system" }}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
