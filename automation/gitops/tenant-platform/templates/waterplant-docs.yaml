{{- if .Values.docs.enabled }}
{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
# ---------------------------------------------------------------------------
# waterplant-docs — Northgate's safety documentation, and the one thing in the
# lab that can see an outbound request arrive.
#
# It serves three legitimate pages the agent is expected to read, and one
# "field service bulletin" that redirects onward to /attack/collect. Every
# request that reaches an /attack/ path is recorded with its query string and
# body, and GET /hits?since= hands the log to the console's probe engine.
#
# Why one host and not two: a separate attacker host is stopped by any
# host-level allowlist, and a participant who blocks it has learned nothing
# transferable. With the bulletin and the real pages on the same host, the
# cheap fix breaks read-documentation and the correct fix — allowing /doc/ and
# refusing the rest — passes both. That tension is module 5.
#
# Sync wave 0 alongside plant-api: the console reads its /hits endpoint, and
# MR-2291's seeded injection in plant-api names it, so it must exist before
# either comes up.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waterplant-docs
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: waterplant-docs
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  # One replica, for the same reason plant-api has one: the hit log is an
  # in-process ring buffer. Two replicas would put the log behind a round-robin
  # Service, so roughly half of "did the exfiltration arrive?" would answer no
  # while the request sat in the other pod's buffer — an attack reported
  # blocked when it got through is the one failure this console must not have.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: waterplant-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: waterplant-docs
        app.kubernetes.io/part-of: water-plant
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: docs
          image: {{ printf "%s/%s/%s:%s" .Values.image.registry .Values.image.namespace .Values.image.docs.repository .Values.image.docs.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.docs.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: waterplant-docs
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: waterplant-docs
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: waterplant-docs
  ports:
    - name: http
      port: 8080
      targetPort: http
---
{{/*
A Route so a participant can read the documentation in a browser.

For people only. Everything in the lab that fetches this site -- the console's
probe engine, the agent's web_extract, MR-2291's seeded injection -- addresses
it by Service name, and must keep doing so: from inside a pod the apps domain
resolves to the router's internal address (10.10.10.101 on cluster-pz7xk),
which is exactly what Hermes' SSRF check in tools/url_safety.py blocks. Nothing
here is wired into DOCS_URL or DOCS_COLLECT_URL, and it should not be.

Unscoped on purpose, so all three things a participant wants to see by hand
work: /doc to browse, /doc/field-service-bulletin to watch the 302 fire, and
/hits to confirm whether their own exfiltration attempt actually landed. That
does put /attack/collect on the internet -- an in-memory, bounded log of
requests to a fictional plant, which is the receiving end of an attack the lab
fires at itself. Scope it with `path: /doc` if that is not wanted, accepting
that the redirect then dead-ends for a browser.
*/}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: waterplant-docs
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: waterplant-docs
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  to:
    kind: Service
    name: waterplant-docs
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
