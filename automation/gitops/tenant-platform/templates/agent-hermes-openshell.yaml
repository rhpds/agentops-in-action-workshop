{{- if and (eq .Values.agent.harness "hermes") (eq (.Values.agent.hermes.runtime | default "pod") "openshell") }}
{{- if not .Values.mcpGateway.enabled }}
{{- fail "agent.hermes.runtime openshell reaches tools only through this participant's MCP Gateway; set mcpGateway.enabled" }}
{{- end }}
{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
{{/*
Hermes, the bridge, console and MCP broker now share this namespace.
The broker hairpin must work before the participant policy Application syncs.
The cluster AdminNetworkPolicy still prevents bypassing the gateway to tools.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-from-openshell
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: {{ .Values.mcpGateway.gatewayName }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
{{- end }}
