{{- if and (eq .Values.agent.harness "hermes") (eq (.Values.agent.hermes.runtime | default "pod") "pod") }}
{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
{{- $viaGateway := .Values.mcpGateway.enabled -}}
{{- $gwSvc := printf "%s-%s.%s.svc.cluster.local" .Values.mcpGateway.gatewayName .Values.mcpGateway.gatewayClassName $ns -}}
{{- $gwUrl := printf "http://%s:8080/mcp" $gwSvc -}}
{{/*
Hermes as an alternative agent harness.

BYOA is the lab's premise — Red Hat does not pick the agent framework — so
swapping the harness while every surrounding control stays identical is worth
demonstrating rather than asserting. Flip `agent.harness` to "hermes" and the
plant, the MCP servers, the policy layer and the console are untouched.

Two things this deliberately does NOT do.

It does not use the community `hermes-operator`. That bundle is third-party
(paperclipinc v0.2.0) and its CRDs offer `selfConfigure` and `autoUpdate` — an
agent that rewrites its own configuration and pulls images on a channel. Both
conflict with this lab: the thesis is that the agent is *unchanged* while the
infrastructure around it changes, so an agent that mutates itself makes the
before/after comparison unattributable. It also breaks the pin-everything rule.

It does not use the upstream `nousresearch/hermes-agent` image, which is built
on s6-overlay and must start as root before dropping to UID 10000. Under
OpenShift's restricted-v2 SCC it gets an arbitrary UID and dies in preinit:
"/run belongs to uid 0 ... lacking the privileges to fix it". Verified on the
cluster. Granting anyuid would fix it and would be incoherent in a lab about
runtime containment — and it would break the Phase 3 plan, where the agent must
drop into the OpenShell governed environment unmodified.

Two MCP modes, chosen by mcpGateway.enabled:

  direct   one mcp_servers entry per MCP server, no auth. The original shape.
  gateway  a single `gateway` entry pointing at this participant's MCP Gateway,
           with auth: oauth. A token for the realm's operator user is seeded
           before Hermes starts and refreshed by a sidecar; Hermes re-reads it
           from disk on change, so no restart is needed. The tool names Hermes
           sees gain the gateway's prefixes (telemetry_get_pump_status).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  config.yaml: |
    # Staged here and copied into the data volume at start-up, because the
    # container's entrypoint rewrites this file from HERMES_CONFIG_* variables
    # and cannot write to a mounted ConfigMap.
    mcp_servers:
{{- if $viaGateway }}
      # One endpoint: this participant's MCP Gateway. `auth: oauth` makes Hermes
      # send the token at $HERMES_HOME/mcp-tokens/gateway.json.
      gateway:
        url: {{ $gwUrl | quote }}
        transport: streamable-http
        auth: oauth
        ssl_verify: false
        enabled: true
        timeout: {{ .Values.agent.hermes.mcpTimeoutSeconds }}
        connect_timeout: 30
{{- else }}
      # The MCP block is the load-bearing part: Hermes discovers the same three
      # servers our own agent uses, over the same streamable HTTP transport,
      # with the same tools and descriptions. That is what makes a comparison
      # between harnesses mean anything.
{{- range .Values.mcp.servers }}
      {{ .name | replace "-" "_" }}:
        url: "http://{{ .name }}.{{ $ns }}.svc:8080/mcp"
        enabled: true
        timeout: {{ $.Values.agent.hermes.mcpTimeoutSeconds }}
        connect_timeout: 30
{{- end }}
{{- end }}
{{- if $viaGateway }}
  mcp-token-refresh.py: |
{{ .Files.Get "files/mcp-token-refresh.py" | indent 4 }}
  wait-for-gateway.py: |
    # Waits until the gateway lists tools from every expected server.
    #
    # A TCP check is not enough here. Hermes lists tools once at start-up and
    # never refreshes, and on a fresh tenant the broker accepts connections
    # before it has discovered any upstream server — so Hermes could start
    # against an empty tool list and fall back to its local shell. Waiting for
    # each server's prefix to appear closes that window.
    import json, os, sys, time
    import urllib.request as u

    GW = os.environ["MCP_GATEWAY_URL"]
    PREFIXES = [p for p in os.environ["MCP_PREFIXES"].split(",") if p]
    TOKEN_FILE = os.path.join(os.environ["HERMES_HOME"], "mcp-tokens", "gateway.json")
    DEADLINE = time.time() + float(os.environ["MCP_WAIT_SECONDS"])

    def post(body, sid, token):
        headers = {"content-type": "application/json",
                   "accept": "application/json, text/event-stream",
                   "authorization": "Bearer " + token}
        if sid:
            headers["mcp-session-id"] = sid
        r = u.urlopen(u.Request(GW, data=json.dumps(body).encode(), headers=headers), timeout=15)
        raw = r.read().decode()
        sid = r.headers.get("mcp-session-id") or sid
        msgs = [json.loads(line[5:]) for line in raw.splitlines() if line.startswith("data:")]
        if not msgs and raw.strip().startswith("{"):
            msgs = [json.loads(raw)]
        return sid, msgs

    last = "not attempted"
    while time.time() < DEADLINE:
        try:
            token = json.load(open(TOKEN_FILE))["access_token"]
            init = {"jsonrpc": "2.0", "id": 1, "method": "initialize",
                    "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                               "clientInfo": {"name": "wait-for-gateway", "version": "1"}}}
            sid, _ = post(init, None, token)
            post({"jsonrpc": "2.0", "method": "notifications/initialized"}, sid, token)
            _, msgs = post({"jsonrpc": "2.0", "id": 2, "method": "tools/list"}, sid, token)
            names = [t["name"] for t in (msgs[0].get("result", {}).get("tools", []) if msgs else [])]
            missing = [p for p in PREFIXES if not any(n.startswith(p) for n in names)]
            if not missing:
                print("gateway ready: %d tools" % len(names), flush=True)
                sys.exit(0)
            last = "%d tools listed, still waiting for %s" % (len(names), missing)
        except Exception as exc:
            last = "%s: %s" % (type(exc).__name__, exc)
        print(last, flush=True)
        time.sleep(5)
    sys.exit("MCP gateway not ready after %ss: %s" % (os.environ["MCP_WAIT_SECONDS"], last))
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/part-of: water-plant
  annotations:
    # Same wave as the Deployment, deliberately.
    #
    # This was wave 1 and deadlocked ArgoCD on a cluster whose default
    # StorageClass binds WaitForFirstConsumer: the PVC stays Pending until a
    # pod consumes it, ArgoCD will not begin the next wave until this one is
    # Healthy, and the only consumer is in that next wave. The sync sat at
    # "waiting for healthy state of PersistentVolumeClaim/hermes-data"
    # indefinitely — no error, no event, just a tenant that never finishes.
    #
    # Applying both in one wave lets the pod bind the volume and the two go
    # healthy together. Invisible to `oc apply`, which has no waves at all,
    # which is exactly why this survived earlier testing.
    argocd.argoproj.io/sync-wave: "4"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.agent.hermes.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    # After the gateway resources (1-3), so the MCPServerRegistrations exist by
    # the time the wait-for-gateway init container starts polling.
    argocd.argoproj.io/sync-wave: "4"
spec:
  replicas: 1
  # Persistent memory on a ReadWriteOnce volume: a second pod cannot roll
  # alongside the first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/part-of: water-plant
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Assembles the two files Hermes reads. Necessary because the
        # published image ships no entrypoint.sh, so nothing else writes them.
        - name: seed-config
          image: {{ printf "%s:%s" .Values.agent.hermes.image .Values.agent.hermes.tag }}
          command:
            - sh
            - -c
            - |
              set -e
              # Regenerated every start so the config always matches the chart.
              # The model block is appended here rather than templated into the
              # ConfigMap because it carries the LiteLLM key: this way the
              # credential stays in the Secret and never reaches a manifest,
              # Helm values, or git.
              cp /config/config.yaml "$HERMES_HOME/config.yaml"
              cat >> "$HERMES_HOME/config.yaml" <<EOF

              model:
                default: $MODEL_DEFAULT
                provider: custom
                base_url: $MODEL_BASE_URL
                api_key: $MODEL_API_KEY

              custom_providers:
                - name: $MODEL_DEFAULT
                  base_url: $MODEL_BASE_URL
                  api_key: $MODEL_API_KEY
                  model: $MODEL_DEFAULT
              EOF
              # API server settings live in .env; the published image has no
              # entrypoint.sh, so nothing else writes this file.
              {
                echo "API_SERVER_ENABLED=true"
                echo "API_SERVER_HOST=0.0.0.0"
                echo "API_SERVER_PORT={{ .Values.agent.hermes.port }}"
                echo "API_SERVER_KEY=$API_SERVER_KEY"
              } > "$HERMES_HOME/.env"
              chmod 600 "$HERMES_HOME/.env" "$HERMES_HOME/config.yaml"
          envFrom:
            - secretRef:
                name: {{ .Values.agent.hermes.envSecret }}
          env:
            - { name: HERMES_HOME,      value: "{{ .Values.agent.hermes.home }}" }
            - { name: MODEL_BASE_URL,   value: "{{ .Values.agent.litellm.baseUrl }}" }
            - { name: MODEL_DEFAULT,    value: "{{ .Values.agent.litellm.model }}" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: "{{ .Values.agent.hermes.home }}" }
            - { name: config, mountPath: /config, readOnly: true }
{{- if $viaGateway }}
        # Fetch the first token before Hermes' first MCP handshake. Fails the pod
        # if Keycloak or the realm is unavailable — better than an agent that is
        # refused on every tool call with no visible cause.
        - name: seed-token
          image: {{ printf "%s:%s" .Values.agent.hermes.image .Values.agent.hermes.tag }}
          command: ["python3", "/config/mcp-token-refresh.py"]
          env: &tokenEnv
            - { name: HERMES_HOME,     value: "{{ .Values.agent.hermes.home }}" }
            - { name: MCP_SERVER_NAME, value: gateway }
            - { name: MCP_CLIENT_ID,   value: {{ .Values.keycloak.agentClientId | quote }} }
            - { name: MCP_USERNAME,    value: {{ .Values.keycloak.agentUser | quote }} }
            - { name: MCP_PASSWORD,    value: {{ .Values.keycloak.agentPassword | quote }} }
            - name: MCP_TOKEN_URL
              value: {{ printf "https://%s/realms/waterplant-%s/protocol/openid-connect/token" .Values.keycloak.host .Values.username | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: "{{ .Values.agent.hermes.home }}" }
            - { name: config, mountPath: /config, readOnly: true }
        - name: wait-for-gateway
          image: {{ printf "%s:%s" .Values.agent.hermes.image .Values.agent.hermes.tag }}
          command: ["python3", "/config/wait-for-gateway.py"]
          env:
            - { name: HERMES_HOME,      value: "{{ .Values.agent.hermes.home }}" }
            - { name: MCP_GATEWAY_URL,  value: {{ $gwUrl | quote }} }
            - { name: MCP_WAIT_SECONDS, value: {{ .Values.agent.hermes.mcpWaitSeconds | quote }} }
            - name: MCP_PREFIXES
              value: "{{ range $i, $s := .Values.mcp.servers }}{{ if $i }},{{ end }}{{ trimSuffix "-mcp" $s.name }}_{{ end }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: "{{ .Values.agent.hermes.home }}" }
            - { name: config, mountPath: /config, readOnly: true }
{{- else }}
        {{/*
        Hermes dials every MCP server once at start-up, retries three times over
        about seven seconds, and then gives up for the life of the process. It
        does not reconnect. Losing that race is not loud: the agent starts
        healthy, serves requests, and answers plant questions out of its
        *local shell* instead — "I don't see any files related to pumps in the
        current directory" — because the terminal tool is still registered when
        the MCP tools are not. Nothing in the console or the probes says why.

        So wait for the servers, and fail the pod rather than start without
        them: a CrashLoopBackOff names the problem, a shell-only agent does not.
        */}}
        - name: wait-for-mcp
          image: {{ printf "%s:%s" .Values.agent.hermes.image .Values.agent.hermes.tag }}
          # `python3` on PATH: the OpenShell-based image has no /opt/hermes/venv.
          command:
            - python3
            - -c
            - |
              import os, socket, sys, time
              targets = [t for t in os.environ["MCP_TARGETS"].split(",") if t]
              deadline = time.time() + float(os.environ["MCP_WAIT_SECONDS"])
              pending = list(targets)
              while pending and time.time() < deadline:
                  host, port = pending[0].split(":")
                  try:
                      with socket.create_connection((host, int(port)), timeout=5):
                          print(f"ready: {pending.pop(0)}", flush=True)
                          continue
                  except OSError as exc:
                      print(f"waiting for {pending[0]}: {exc}", flush=True)
                  time.sleep(3)
              if pending:
                  sys.exit(f"MCP servers unreachable after {os.environ['MCP_WAIT_SECONDS']}s: "
                           + ", ".join(pending))
              print("all MCP servers reachable", flush=True)
          env:
            - name: MCP_TARGETS
              value: "{{ range $i, $s := .Values.mcp.servers }}{{ if $i }},{{ end }}{{ $s.name }}.{{ $ns }}.svc:8080{{ end }}"
            - name: MCP_WAIT_SECONDS
              value: {{ .Values.agent.hermes.mcpWaitSeconds | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
{{- end }}
      containers:
        - name: hermes
          image: {{ printf "%s:%s" .Values.agent.hermes.image .Values.agent.hermes.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Start the API server explicitly rather than trusting the image's
          # entrypoint.
          #
          # This image's entrypoint is `entrypoint.sh` with CMD ["bash"], so the
          # container ran a non-interactive bash that exited 0 immediately:
          # CrashLoopBackOff with no logs at all. Bare `hermes` launches the
          # interactive TUI, which exits when stdin is not a terminal.
          # `gateway run` runs Hermes's OpenAI-compatible api_server platform.
          command: ["hermes", "gateway", "run"]
          ports:
            - name: http
              containerPort: {{ .Values.agent.hermes.port }}
          envFrom:
            # Carries MODEL_API_KEY and API_SERVER_KEY. Plain names: the
            # HERMES_ENV_* convention needs the repo's entrypoint.sh, which the
            # published image does not have.
            - secretRef:
                name: {{ .Values.agent.hermes.envSecret }}
          env:
            - name: HERMES_HOME
              value: {{ .Values.agent.hermes.home | quote }}
            - name: HERMES_PROFILE
              value: default
            - name: XDG_STATE_HOME
              value: "{{ .Values.agent.hermes.home }}/state"
            - name: MEM0_DB_PATH
              value: "{{ .Values.agent.hermes.home }}/mem0"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # Not read-only: Hermes writes memory, profiles and its own state
            # under HERMES_HOME. The harness is less constrained than our own
            # agent, which is worth showing rather than hiding — module 4 has to
            # govern whatever runtime is actually present.
            readOnlyRootFilesystem: false
          volumeMounts:
            - { name: data, mountPath: "{{ .Values.agent.hermes.home }}" }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          resources:
            {{- toYaml .Values.agent.hermes.resources | nindent 12 }}
{{- if $viaGateway }}
        # Keeps the token fresh. Its interval is also how long a role granted in
        # Keycloak takes to reach the agent.
        - name: mcp-token-refresh
          image: {{ printf "%s:%s" .Values.agent.hermes.image .Values.agent.hermes.tag }}
          command: ["python3", "/config/mcp-token-refresh.py", "--loop", {{ .Values.mcpGateway.tokenRefreshSeconds | quote }}]
          env: *tokenEnv
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: data, mountPath: "{{ .Values.agent.hermes.home }}" }
            - { name: config, mountPath: /config, readOnly: true }
          resources:
            {{- toYaml .Values.agent.hermes.tokenRefreshResources | nindent 12 }}
{{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: config
          configMap:
            name: hermes-config
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  selector:
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: http
      port: {{ .Values.agent.hermes.port }}
      targetPort: http
{{- end }}
