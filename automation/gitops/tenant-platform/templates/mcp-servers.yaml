{{- $ns := printf "%s-%s" .Values.username .Values.namespaceSuffix -}}
{{- $root := . -}}
{{/*
One image, three entrypoints. These are stateless proxies onto plant-api
(§2.8), which is why they can scale, restart or reschedule freely and why the
gateway needs no session affinity to them.
*/}}
{{- range .Values.mcp.servers }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: water-plant
    rhdp.redhat.com/lab: agentops-in-action
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: water-plant
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: {{ printf "%s/%s/%s:%s" $root.Values.image.registry $root.Values.image.namespace $root.Values.image.mcp.repository $root.Values.image.mcp.tag }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args: [{{ .server | quote }}]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLANT_API_URL
              value: http://plant-api.{{ $ns }}.svc:8080
            - name: MCP_PORT
              value: "8080"
            # The SDK enables DNS-rebinding protection by default and rejects
            # any Host header not on its allow list. In-cluster the Host is a
            # Service name or whatever MCP Gateway forwards, so a restrictive
            # value fails every call with an opaque 400. The real boundary here
            # is the gateway plus NetworkPolicy, not a Host header check.
            - name: MCP_ALLOWED_HOSTS
              value: "*"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml $root.Values.mcp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: water-plant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
