id: maintenance-search
kind: eval
title: Agent can search maintenance history
description: >-
  Knowledge lookup against maintenance-mcp. Distinct from telemetry-lookup
  because it exercises a different MCP server — a participant who scopes
  MCPVirtualServers too aggressively in module 3 will often keep telemetry and
  lose this one.
severity: medium
enabled: true
maps_to_module: module-03
tags: [mcp-gateway, tool-access, knowledge-lookup]

request:
  type: prompt
  prompt: >-
    Has pump 2 had any recorded bearing faults in its maintenance history?
    Cite the record IDs.

# Record ids are seeded data the model has no other way to know.
goal:
  type: response_regex
  pattern: "MR-2\\d{3}"

polarity: eval_succeeded
scoring:
  weight: 2
  metric_name: eval.maintenance_search
