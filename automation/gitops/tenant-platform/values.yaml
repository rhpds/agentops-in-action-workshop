# Participant username — overridden per-user by the ApplicationSet generator.
username: user1

# Namespace pattern must match bootstrap-tenant, which creates it.
namespaceSuffix: agentops

image:
  # Public images in the rh-aiservices-bu Quay org, built on-cluster from the
  # agent repo and pushed there. No developer builds these locally
  # (implementation-plan §2.6).
  #
  # These pointed at an ImageStream in a personal dev namespace until now, which
  # meant the lab only ran on the one cluster that namespace happened to exist
  # on — everywhere else every workload sat in ImagePullBackOff with nothing
  # naming the cause. A public registry makes provisioning deterministic at 30x
  # concurrency and removes the on-cluster build from the attendee path.
  registry: quay.io
  namespace: rh-aiservices-bu
  plantApi:
    repository: plant-api
    tag: latest
  # Three images now, one per MCP server — each has its own package,
  # Containerfile, tests and entrypoint upstream. They share a tag.
  mcpTag: latest
  ui:
    repository: waterplant-ui
    tag: latest
  agent:
    repository: waterplant-agent
    tag: latest
  pullPolicy: Always

# ---------------------------------------------------------------------------
# plant-api — the ONLY stateful workload per participant.
#
# replicas is deliberately not configurable. State is an in-process object
# behind an asyncio lock, so a second replica would give the participant two
# divergent plants behind one Service, with answers changing depending on which
# pod served the request. See implementation-plan §2.8.
# ---------------------------------------------------------------------------
plantApi:
  tickSeconds: "1.0"
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: 500m, memory: 384Mi }

# ---------------------------------------------------------------------------
# MCP servers — stateless proxies onto plant-api.
#
# Streamable HTTP on /mcp, never stdio: MCP Gateway can only route, authorize
# and token-exchange over HTTP (§D3). `hint` is what the gateway's
# discover_tools meta-tool returns to help an agent choose a server.
# ---------------------------------------------------------------------------
mcp:
  servers:
    - name: telemetry-mcp
      repository: mcp-telemetry
      hint: "Read-only plant telemetry: pump status, safety status, water quality, reservoir level, valve positions."
    - name: maintenance-mcp
      repository: mcp-maintenance
      hint: "Maintenance history and work orders: search records, get details, list/create/update work orders."
    - name: control-mcp
      repository: mcp-control
      hint: "Plant control: set pump speed, start/stop pumps, open/close valves, emergency shutdown."
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }

# ---------------------------------------------------------------------------
# MCP Gateway — this participant's own. See templates/mcp-gateway.yaml.
#
# Off by default here so the chart renders standalone; bootstrap-tenant
# forwards true. When on, the agent's tool calls go through the gateway rather
# than straight to the MCP servers, and bootstrap-infra's AdminNetworkPolicy
# makes that the only route.
#
# The authorization policies are not here — they are participant-editable and
# live in tenant-policy (mcpGateway.enforced).
# ---------------------------------------------------------------------------
mcpGateway:
  enabled: false
  # bootstrap-infra's AdminNetworkPolicy selects Envoy pods by this name.
  gatewayName: mcp-gateway
  # RHOAI's class: same controller (openshift.io/gateway-controller/v1) and no
  # parametersRef of its own. Reused rather than creating openshift-default,
  # which the Cluster Ingress Operator watches and would act on.
  gatewayClassName: data-science-gateway-class
  # One replica. The class default (2-10 replicas at a 2 CPU limit each) does
  # not fit the participant quota.
  #
  # The CPU limit covers startup, not traffic. Under enforcement Envoy compiles
  # Kuadrant's policy module before it reports ready, which took about 28s at
  # 500m, likely throttled. A full core shortens that and is still well inside
  # the 8 CPU limit quota.
  envoyResources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: "1", memory: 512Mi }
  # Seconds Envoy may take to report ready before the kubelet restarts it, as
  # startupProbe failureThreshold x 1s. See templates/mcp-gateway.yaml.
  envoyStartupSeconds: 180
  # How often the agent's token is refreshed. Also the worst-case delay before
  # a role granted in Keycloak reaches the agent: 1200s was measured as a
  # 20-minute wait for a participant who grants a role and retries.
  tokenRefreshSeconds: 300

# ---------------------------------------------------------------------------
# Keycloak — this participant's realm (created by templates/mcp-gateway.yaml)
# ---------------------------------------------------------------------------
keycloak:
  # sso.<apps domain>. Forwarded by bootstrap-tenant.
  host: ""
  # RHDP's Keycloak. The realm import must live beside this CR.
  namespace: keycloak
  crName: keycloak
  # The identity the agent's tool calls carry: the realm's operator user,
  # through the public mcp-gateway client. These are lab credentials, printed
  # in the lab guide, on a fictional plant — not secrets.
  agentClientId: mcp-gateway
  agentUser: operator
  agentPassword: operator
  adminPassword: redhat
  # Every tool role declared in the realm, per MCP server.
  toolRoles:
    telemetry-mcp:
      - get_plant_safety_status
      - get_pump_status
      - get_all_pump_status
      - get_water_quality
      - get_reservoir_level
      - get_valve_positions
    maintenance-mcp:
      - search_maintenance_history
      - get_maintenance_record
      - list_work_orders
      - create_work_order
      - update_work_order
    control-mcp:
      - set_pump_speed
      - start_pump
      - stop_pump
      - open_valve
      - close_valve
      - dump_plant_configuration
      - emergency_shutdown
  # Declared but not granted to the operator: the roles the exercises grant.
  withheldFromOperator:
    control-mcp:
      - dump_plant_configuration   # Scenario 3
      - emergency_shutdown         # Scenario 4

# Coarse egress restriction as defence in depth. Deliberately permissive at
# baseline — the interesting per-binary policy is OpenShell's job in module 4,
# and this is the layer participants compare it against.
networkPolicy:
  enabled: true
  baselinePermissive: true

# ---------------------------------------------------------------------------
# Operator console
#
# The dashboard reads plant-api directly, so it stays useful when the agent is
# denied, broken or absent — which is most of module 4.
# ---------------------------------------------------------------------------
ui:
  replicas: 1
  # Empty means "follow agent.harness" — the console points at whichever agent
  # this chart actually deployed and speaks that harness's protocol. Set a
  # value only to aim the console at an agent outside this chart.
  agentUrl: ""
  mlflowUrl: ""
  route:
    enabled: true
    timeout: 600s
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }

# ---------------------------------------------------------------------------
# Maintenance assistant
#
# Makes no authorization decisions: forwards the caller's token to the MCP
# servers and reports what refused it. Built to drop into the OpenShell
# governed execution environment in module 4 unmodified.
# ---------------------------------------------------------------------------
agent:
  # Which agent harness to deploy. BYOA is the lab's premise, so the harness is
  # swappable and everything around it — plant, MCP servers, policy, console —
  # stays identical.
  #
  #   waterplant  our own agent: a plain loop, measured at 100% on the golden
  #               workflow, speaking our /chat and /chat/stream contract
  #   hermes      hermes-agent, run as a plain container
  #
  # Both are driveable from the console. Its backend carries an adapter that
  # translates an OpenAI-compatible server into the console's own event shape,
  # selected by AGENT_PROTOCOL, so the front end never learns there is a second
  # harness. ui.yaml derives the URL, protocol and credential from this value —
  # one switch, not several that have to agree.
  #
  # Two things the hermes path cannot do, both reported through /api/config so
  # an exercise fails loudly rather than silently:
  #
  #   * Identity stops at the console. Hermes authenticates with one static
  #     server key and rejects a participant token, so the console holds a
  #     service credential. That is Scenarios 1, 4 and 6.
  #   * There is no tool trace. Hermes runs its loop server-side and returns
  #     only the finished answer, and module 6 has participants debug an
  #     over-restrictive policy *from* the trace.
  #
  # Both argue for putting tracing and identity at MCP Gateway, where they
  # survive a harness swap. On the hermes default that is no longer a
  # "nice to have later": it is the only way modules 4 and 6 get a trace and an
  # identity at all, because the harness supplies neither.
  #
  # hermes requires a `hermes-env` Secret in the namespace — see
  # agent.hermes.envSecret below. Without it the pod cannot start, so tenant
  # provisioning has to create it alongside litellm-credentials.
  #
  # With mcpGateway.enabled, only the hermes harness is wired to the gateway.
  # The waterplant agent still dials the MCP servers directly, which
  # bootstrap-infra's AdminNetworkPolicy blocks.
  harness: hermes

  replicas: 1
  # Holds LITELLM_VIRTUAL_KEY. Created out of band — never a chart value.
  credentialsSecret: litellm-credentials
  litellm:
    baseUrl: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
    model: "qwen3-235b"
  temperature: 0
  maxSteps: 14
  # The shared MaaS endpoint 429s under light load: one sequential client saw
  # 52 across 15 golden-workflow runs. Backoff absorbs it, it does not fix it.
  rateLimitRetries: 5
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  # --- Hermes harness -------------------------------------------------------
  # Only used when agent.harness is "hermes".
  #
  # This is the rh-aiservices-bu/cai-krew build, not the upstream image. That
  # one is built on s6-overlay, needs to start as root, and dies under
  # restricted-v2 with "/run belongs to uid 0 ... lacking the privileges to fix
  # it" — verified on the cluster. The cai-krew Containerfile uses UBI9 with
  # tini and runs non-root, which is what OpenShift needs.
  #
  hermes:
    # Built from hermes/Containerfile in the agent repo and pushed to the same
    # Quay org as everything else. It layers hermes-agent's optional [mcp]
    # extra on, which the base image ships without — and without it the MCP
    # servers list as enabled and fail only on connect, so `hermes mcp list`
    # shows three ticks and only `hermes mcp test` tells the truth.
    #
    # Note this image is not reproducible the way the other six are: its
    # Containerfile pulls an unpinned base and shallow-clones a fork with no
    # ref, so the pushed digest is fixed but a rebuild will not recreate it.
    image: quay.io/rh-aiservices-bu/waterplant-hermes
    tag: latest
    port: 8787
    home: /app/.hermes
    storageSize: 5Gi
    mcpTimeoutSeconds: 120
    # How long to wait for MCP before failing the pod. Hermes lists tools once at
    # start-up and never refreshes, so starting before they exist yields an
    # agent that silently falls back to its local shell.
    mcpWaitSeconds: 180
    # Two keys, both plain-named. The HERMES_ENV_* convention only works when
    # the repo's entrypoint.sh is present to strip the prefix, and the
    # published image ships without it — so prefixed names are simply inert.
    # The init container reads these and writes config.yaml and .env instead.
    #
    #   MODEL_API_KEY   the same LiteLLM key our own agent uses
    #   API_SERVER_KEY  Hermes' static bearer, also read by the console's BFF
    #
    # Created out of band so neither reaches git:
    #   oc create secret generic hermes-env \
    #     --from-literal=MODEL_API_KEY="$LITELLM_KEY" \
    #     --from-literal=API_SERVER_KEY="$(openssl rand -hex 24)"
    envSecret: hermes-env
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: "2",  memory: 4Gi }
    # The token-refresh sidecar, gateway mode only.
    tokenRefreshResources:
      requests: { cpu: 10m, memory: 32Mi }
      limits:   { cpu: 100m, memory: 64Mi }
