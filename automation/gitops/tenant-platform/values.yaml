# Participant username — overridden per-user by the ApplicationSet generator.
username: user1

# Namespace pattern must match bootstrap-tenant, which creates it.
namespaceSuffix: agentops

image:
  # Built on-cluster by BuildConfig and referenced from the internal registry.
  # No developer ever builds these locally (implementation-plan §2.6).
  registry: image-registry.openshift-image-registry.svc:5000
  namespace: wp-dev-phayes
  plantApi:
    repository: plant-api
    tag: latest
  # Three images now, one per MCP server — each has its own package,
  # Containerfile, tests and entrypoint upstream. They share a tag.
  mcpTag: latest
  ui:
    repository: waterplant-ui
    tag: latest
  agent:
    repository: waterplant-agent
    tag: latest
  pullPolicy: Always

# ---------------------------------------------------------------------------
# plant-api — the ONLY stateful workload per participant.
#
# replicas is deliberately not configurable. State is an in-process object
# behind an asyncio lock, so a second replica would give the participant two
# divergent plants behind one Service, with answers changing depending on which
# pod served the request. See implementation-plan §2.8.
# ---------------------------------------------------------------------------
plantApi:
  tickSeconds: "1.0"
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: 500m, memory: 384Mi }

# ---------------------------------------------------------------------------
# MCP servers — stateless proxies onto plant-api.
#
# One image, three entrypoints. Streamable HTTP on /mcp, never stdio: MCP
# Gateway can only route, authorize and token-exchange over HTTP (§D3).
# ---------------------------------------------------------------------------
mcp:
  servers:
    - name: telemetry-mcp
      repository: mcp-telemetry
    - name: maintenance-mcp
      repository: mcp-maintenance
    - name: control-mcp
      repository: mcp-control
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }

# Coarse egress restriction as defence in depth. Deliberately permissive at
# baseline — the interesting per-binary policy is OpenShell's job in module 4,
# and this is the layer participants compare it against.
networkPolicy:
  enabled: true
  baselinePermissive: true

# ---------------------------------------------------------------------------
# Operator console
#
# The dashboard reads plant-api directly, so it stays useful when the agent is
# denied, broken or absent — which is most of module 4.
# ---------------------------------------------------------------------------
ui:
  replicas: 1
  agentUrl: "http://waterplant-agent:8080"
  mlflowUrl: ""
  route:
    enabled: true
    timeout: 600s
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { cpu: 300m, memory: 256Mi }

# ---------------------------------------------------------------------------
# Maintenance assistant
#
# Makes no authorization decisions: forwards the caller's token to the MCP
# servers and reports what refused it. Built to drop into the OpenShell
# governed execution environment in module 4 unmodified.
# ---------------------------------------------------------------------------
agent:
  # Which agent harness to deploy. BYOA is the lab's premise, so the harness is
  # swappable and everything around it — plant, MCP servers, policy, console —
  # stays identical.
  #
  #   waterplant  our own agent: a plain loop, measured at 100% on the golden
  #               workflow, speaking our /chat and /chat/stream contract
  #   hermes      nousresearch/hermes-agent, run as a plain container
  #
  # NOT YET INTERCHANGEABLE. Hermes serves an OpenAI-compatible API on 8642;
  # the console's backend speaks our /chat contract and expects tool calls in
  # our shape. Selecting hermes deploys and configures it, but the console
  # cannot drive it until the backend grows an OpenAI-compatible branch.
  harness: waterplant

  replicas: 1
  # Holds LITELLM_VIRTUAL_KEY. Created out of band — never a chart value.
  credentialsSecret: litellm-credentials
  litellm:
    baseUrl: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
    model: "qwen3-235b"
  temperature: 0
  maxSteps: 14
  # The shared MaaS endpoint 429s under light load: one sequential client saw
  # 52 across 15 golden-workflow runs. Backoff absorbs it, it does not fix it.
  rateLimitRetries: 5
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

  # --- Hermes harness -------------------------------------------------------
  # Only used when agent.harness is "hermes".
  #
  # This is the rh-aiservices-bu/cai-krew build, not the upstream image. That
  # one is built on s6-overlay, needs to start as root, and dies under
  # restricted-v2 with "/run belongs to uid 0 ... lacking the privileges to fix
  # it" — verified on the cluster. The cai-krew Containerfile uses UBI9 with
  # tini and runs non-root, which is what OpenShift needs.
  #
  # Building it into our own registry from that Containerfile would be the next
  # step for supply-chain control; this pulls the published image for now.
  hermes:
    image: quay.io/ckavili/hermes-mem0
    tag: "0.0.3"
    port: 8787
    home: /app/.hermes
    storageSize: 5Gi
    mcpTimeoutSeconds: 120
    # Carries HERMES_ENV_MODEL_API_KEY — the same LiteLLM key our own agent
    # uses, under the name this build expects. Created out of band:
    #   oc create secret generic hermes-env \
    #     --from-literal=HERMES_ENV_MODEL_API_KEY="$LITELLM_KEY"
    envSecret: hermes-env
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits:   { cpu: "2",  memory: 4Gi }
