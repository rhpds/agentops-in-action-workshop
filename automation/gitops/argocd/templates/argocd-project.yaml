{{/*
The AppProject every lab Application belongs to.

This lives in the `argocd` chart, not in `bootstrap-infra`, and that placement
is the whole point. It used to sit in bootstrap-infra, which is deployed *by*
the agentops-infra Application — an Application that declares
`project: agentops-in-action`. So the project an Application needed in order to
sync was created by that same Application. ArgoCD refused the lot with
"Application referencing project agentops-in-action which does not exist" and
nothing in the lab ever deployed.

The `bootstrap` Application runs under `project: default`, which has no
restrictions, so it can legally create this. Sync wave -1 puts it in before the
Applications and ApplicationSets in applications.yaml, which are wave 0.

Do not move this back into bootstrap-infra, and do not let a second copy exist
there: two sources reconciling the same AppProject with different specs will
fight, and the narrower one wins whenever it syncs last.
*/}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.lab.argocdProject }}
  namespace: {{ .Values.argocd.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: AgentOps in Action lab — manages shared infra and per-user tenant Applications
  sourceRepos:
    - '*'
  destinations:
    - namespace: {{ .Values.lab.sharedNamespace }}
      server: https://kubernetes.default.svc
    # Per-participant namespaces, one per attendee.
    - namespace: '*-agentops'
      server: https://kubernetes.default.svc
    # Operator namespaces. bootstrap-infra renders an OperatorGroup and a
    # Subscription into each of these, and without them here every operator
    # install is rejected as a destination not permitted in the project — so
    # RHOAI and Agent Sandbox never install and the DataScienceCluster never
    # gets a CRD to reconcile against. Keep this list in step with
    # `operators.*.namespace` in bootstrap-infra/values.yaml.
{{- range .Values.lab.operatorNamespaces }}
    - namespace: {{ . }}
      server: https://kubernetes.default.svc
{{- end }}
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    # The participant read-only role, bound per attendee by bootstrap-tenant.
    # Without it every tenant ClusterRoleBinding points at a role that does not
    # exist, and attendees cannot read their own Sandbox — the first hands-on
    # step of module 4.
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    # Both of these are cluster-scoped singletons, not namespaced resources.
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
    - group: mlflow.opendatahub.io
      kind: MLflow
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
